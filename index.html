<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferry Cargo Log</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy-deep:#0B3D2E;
    --navy-mid:#14503D;
    --teal:#29AB87;
    --teal-light:#3FC79A;
    --amber:#D98E04;
    --paper:#F6F1E7;
    --paper-dark:#EAE2D0;
    --ink:#1C1A17;
    --ink-soft:#5B5548;
    --red:#B23A2F;
    --green:#2F7A4F;
    --line:#D8CFB8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(255,255,255,0.04), transparent 40%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  .shell{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
  header.app-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 4px 22px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:6px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .brand-mark svg{width:22px;height:22px;stroke:var(--navy-deep);}
  .brand h1{font-size:20px;color:#F6F1E7;margin:0;font-weight:600;letter-spacing:0.06em;}
  .brand span{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#9FB3C8;letter-spacing:0.14em;text-transform:uppercase;margin-top:2px;}

  .role-pill{
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);
    padding:6px 6px 6px 14px;border-radius:24px;
  }
  .role-pill .rlabel{font-family:'JetBrains Mono',monospace;font-size:11px;color:#C7D3E0;letter-spacing:0.06em;text-transform:uppercase;}
  .role-pill button{
    background:var(--amber);color:var(--navy-deep);border:none;border-radius:18px;
    padding:6px 12px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.04em;
    text-transform:uppercase;cursor:pointer;font-weight:600;
  }

  .mode-toggle{
    display:flex;gap:6px;background:rgba(255,255,255,0.06);
    padding:5px;border-radius:10px;margin-bottom:12px;
  }
  .mode-toggle button{
    flex:1;background:transparent;border:none;color:#C7D3E0;
    font-family:'Oswald',sans-serif;letter-spacing:0.05em;text-transform:uppercase;
    font-size:13px;padding:12px 8px;border-radius:7px;cursor:pointer;font-weight:500;
  }
  .mode-toggle button.active{background:var(--amber);color:var(--navy-deep);font-weight:700;}
  .mode-toggle button:not(.active):hover{background:rgba(255,255,255,0.08);color:#fff;}

  nav.tabs{
    display:flex;gap:6px;background:rgba(255,255,255,0.06);
    padding:5px;border-radius:10px;margin-bottom:22px;flex-wrap:wrap;
  }
  nav.tabs button{
    flex:1;min-width:110px;
    background:transparent;border:none;color:#C7D3E0;
    font-family:'Oswald',sans-serif;letter-spacing:0.05em;text-transform:uppercase;
    font-size:12.5px;padding:10px 8px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background 0.15s, color 0.15s;
  }
  nav.tabs button.active{background:var(--amber);color:var(--navy-deep);font-weight:600;}
  nav.tabs button:not(.active):hover{background:rgba(255,255,255,0.08);color:#fff;}
  .badge{
    background:var(--red);color:#fff;font-size:10px;font-family:'JetBrains Mono',monospace;
    padding:1px 6px;border-radius:20px;min-width:16px;text-align:center;
  }
  nav.tabs button.active .badge{background:var(--navy-deep);color:var(--amber);}

  .panel{
    background:var(--paper);border-radius:12px;padding:26px;
    box-shadow:0 12px 34px rgba(0,0,0,0.28);
  }
  .panel h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:22px;margin:0 0 4px;color:var(--navy-deep);}
  .panel .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}

  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:5px;}
  input[type=text],input[type=tel],input[type=password],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:7px;
    font-family:'Inter',sans-serif;font-size:14.5px;background:#fff;color:var(--ink);
    margin-bottom:16px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:12px 20px;border-radius:8px;border:none;cursor:pointer;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:14px;font-weight:500;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-light);}
  .btn-amber{background:var(--amber);color:var(--navy-deep);}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--navy-deep);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy-deep);}
  .btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .tag{
    position:relative;background:#fff;border-radius:10px;border:1.5px dashed var(--line);
    padding:18px 18px 16px 26px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;
  }
  .tag::before{
    content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;border-radius:50%;background:var(--navy-deep);border:3px solid var(--paper);
  }
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .tag-code{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--navy-deep);letter-spacing:0.02em;}
  .tag-meta{font-size:13px;color:var(--ink-soft);}
  .status-pill{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;font-weight:700;white-space:nowrap;
  }
  .status-pending{background:#FBE7C6;color:#8A5A00;}
  .status-loaded{background:#D9F0E6;color:#1E7A5F;}
  .status-in_transit{background:#DCE4F5;color:#2C4A8C;}
  .status-delivered{background:#DCEBDD;color:#2F7A4F;}
  .tag-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .tag-items{font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;}

  .rate-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;
  }
  .rate-row .name{font-weight:600;font-size:14px;}
  .rate-row .price{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);background:#fff;
    font-size:16px;cursor:pointer;line-height:1;
  }
  .stepper button:hover{border-color:var(--teal);color:var(--teal);}
  .stepper .qty{width:26px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;}

  .total-line{
    display:flex;justify-content:space-between;align-items:center;
    border-top:2px solid var(--navy-deep);padding-top:12px;margin-top:6px;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:16px;
  }
  .total-line .amt{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--navy-deep);}

  .empty{text-align:center;padding:36px 12px;color:var(--ink-soft);font-size:14px;}

  .qr-wrap{background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;margin-bottom:18px;}
  #qr-canvas{display:inline-block;}

  .confirm-code{text-align:center;padding:24px;background:var(--navy-deep);border-radius:10px;color:#fff;margin-bottom:16px;}
  .confirm-code .big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;letter-spacing:0.05em;color:var(--amber);margin:8px 0;}

  .timeline{display:flex;gap:0;margin:18px 0 4px;}
  .tl-step{flex:1;text-align:center;position:relative;}
  .tl-dot{width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1;}
  .tl-step.done .tl-dot{background:var(--teal);}
  .tl-step::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .tl-step:first-child::after{display:none;}
  .tl-step.done::after{background:var(--teal);}
  .tl-label{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);font-weight:600;}
  .tl-date{font-size:10.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-top:2px;}

  .invoice{border:1.5px solid var(--navy-deep);border-radius:10px;padding:20px;margin-top:16px;background:#fff;}
  .invoice table{width:100%;border-collapse:collapse;margin:14px 0;}
  .invoice th,.invoice td{text-align:left;padding:7px 4px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .invoice th{text-transform:uppercase;font-size:10.5px;letter-spacing:0.05em;color:var(--ink-soft);}
  .invoice td.num,.invoice th.num{text-align:right;font-family:'JetBrains Mono',monospace;}

  .sub-tabs{
    display:flex;gap:6px;background:var(--paper-dark);
    padding:5px;border-radius:9px;margin-bottom:22px;flex-wrap:wrap;
  }
  .sub-tabs button{
    flex:1;min-width:130px;background:transparent;border:none;color:var(--ink-soft);
    font-family:'Oswald',sans-serif;letter-spacing:0.04em;text-transform:uppercase;
    font-size:12.5px;padding:9px 8px;border-radius:6px;cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .sub-tabs button.active{background:var(--navy-deep);color:var(--paper);font-weight:600;}
  .sub-tabs button:not(.active):hover{background:rgba(0,0,0,0.06);color:var(--navy-deep);}
  .staff-row{
    display:flex;gap:8px;align-items:center;margin-bottom:8px;
    background:var(--paper-dark);border-radius:8px;padding:8px 10px;
  }
  .staff-row .sname{flex:1;font-weight:600;color:var(--navy-deep);}
  .staff-row .spin{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:0.12em;background:var(--paper);padding:4px 10px;border-radius:6px;}
  .staff-empty{font-size:12.5px;color:var(--ink-soft);padding:8px 2px 12px;}
  .settings-block{margin-bottom:26px;}
  .settings-block h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:0.04em;color:var(--navy-deep);margin:0 0 12px;}
  .rate-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .rate-edit-row input[type=text]{margin-bottom:0;}
  .rate-edit-row input.price-input{width:90px;}
  .search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .search-row input{margin-bottom:0;flex:1;min-width:180px;}
  .filter-chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
    border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .filter-chip.active{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff;}
  .note{font-size:12.5px;color:var(--ink-soft);background:var(--paper-dark);border-radius:7px;padding:10px 12px;margin-top:6px;line-height:1.5;}
  .url-box{
    display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;
    border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;flex-wrap:wrap;
  }
  .url-box .u{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--navy-deep);word-break:break-all;}
  .url-box .tag-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;}

  .gate-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  .gate-card{max-width:420px;width:100%;}
  .gate-title{text-align:center;color:#F6F1E7;margin-bottom:26px;}
  .gate-title h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:24px;margin:0 0 6px;}
  .gate-title p{color:#9FB3C8;font-size:13px;margin:0;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-card{
    background:var(--paper);border-radius:12px;padding:20px 16px;text-align:center;cursor:pointer;
    border:2px solid transparent;transition:border-color .15s, transform .1s;
  }
  .role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .role-card .ricon{
    width:44px;height:44px;border-radius:10px;background:var(--navy-deep);margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
  }
  .role-card .ricon svg{width:22px;height:22px;stroke:var(--amber);}
  .role-card .rname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:14.5px;color:var(--navy-deep);margin-bottom:3px;}
  .role-card .rdesc{font-size:11.5px;color:var(--ink-soft);}
  .pin-box{background:var(--paper);border-radius:12px;padding:26px;max-width:340px;margin:0 auto;text-align:center;}
  .pin-box .rname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:16px;color:var(--navy-deep);margin-bottom:14px;}
  .pin-box input{text-align:center;letter-spacing:0.4em;font-family:'JetBrains Mono',monospace;font-size:20px;}
  .pin-error{color:var(--red);font-size:12.5px;margin:-8px 0 12px;min-height:16px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:16px;}
  .stat-card .slabel{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;}
  .stat-card .sval{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--navy-deep);}

  @media print{
    body *{visibility:hidden;}
    .invoice, .invoice *{visibility:visible;}
    .invoice{position:absolute;top:0;left:0;width:100%;border:none;}
  }
  @media (max-width:560px){
    .brand h1{font-size:16px;}
    nav.tabs button{font-size:11px;min-width:80px;padding:9px 5px;}
    .role-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="app-head">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l1.5-6h15L21 17"/><path d="M5 17v2a1 1 0 001 1h12a1 1 0 001-1v-2"/><path d="M12 3v8"/><path d="M8 6l4-3 4 3"/></svg>
      </div>
      <div>
        <h1>Ferry Cargo Log</h1>
        <span id="clock">--</span>
      </div>
    </div>
    <div class="role-pill" id="role-pill" style="display:none;">
      <span class="rlabel" id="role-label"></span>
      <button id="switch-role-btn">Log out</button>
    </div>
  </header>

  <div class="mode-toggle" id="mode-toggle" style="display:none;"></div>
  <nav class="tabs" id="tabs" style="display:none;"></nav>
  <main class="panel" id="panel" style="display:none;"></main>
  <div id="gate-area"></div>
</div>

<script>
/* ---------------- Storage helpers ---------------- */
const DEFAULT_RATES = [
  {id:'small-box', name:'Small Box', price:50},
  {id:'big-bag', name:'Big Bag', price:120},
  {id:'cement-bag', name:'Cement Bag', price:80},
  {id:'steel-bar', name:'Steel Bar', price:20},
];
const DEFAULT_SETTINGS = {qrUrl:'', ownerPin:'1234', staffPin:'0000', staffUsers:[], pendingStaff:[]};
const INTERNAL_HASH = 'staff';
const OWNER_HASH = 'owner';

/* ---------------- API layer (Neon-backed, via your own serverless endpoint) ----------------
   EDIT THIS to your deployed API's base URL, e.g. "https://cargo-api.yourname.workers.dev"
   The API must implement:
     GET  /api/data/:key   -> { value: <any JSON> }   (404 or {value:null} if missing)
     PUT  /api/data/:key   body {value: <any JSON>}   -> upserts the row
   See neon-schema.sql and api-example/server.js for a ready-made reference implementation. */
const API_BASE = 'https://greenlinkcargo-trhl.onrender.com';

async function apiGet(key, fallback){
  try{
    const res = await fetch(`${API_BASE}/api/data/${key}`);
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data && data.value !== undefined && data.value !== null) ? data.value : fallback;
  }catch(e){ console.error('apiGet failed for', key, e); return fallback; }
}
async function apiSet(key, value){
  try{
    await fetch(`${API_BASE}/api/data/${key}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ value })
    });
  }catch(e){ console.error('apiSet failed for', key, e); }
}

async function loadShipments(){ return await apiGet('shipments', []); }
async function saveShipments(list){ await apiSet('shipments', list); }
async function loadRates(){ return await apiGet('rates', DEFAULT_RATES.slice()); }
async function saveRates(list){ await apiSet('rates', list); }
async function loadTrips(){ return await apiGet('trips', []); }
async function saveTrips(list){ await apiSet('trips', list); }
async function loadSettings(){
  const s = await apiGet('settings', {});
  return Object.assign({}, DEFAULT_SETTINGS, s);
}
async function saveSettings(s){ await apiSet('settings', s); }

// Always re-fetch the current settings from the database right before changing
// them, so a stale in-memory copy (e.g. an old tab, or a page left open) can
// never overwrite changes someone else made in the meantime.
async function withFreshSettings(mutate){
  const fresh = await loadSettings();
  mutate(fresh);
  await saveSettings(fresh);
  state.settings = fresh;
  return fresh;
}
async function withFreshTrips(mutate){
  const fresh = await loadTrips();
  mutate(fresh);
  await saveTrips(fresh);
  state.trips = fresh;
  return fresh;
}

/* ---------------- Utilities ---------------- */
function trackingCode(){
  const d = new Date();
  const ymd = d.getFullYear().toString().slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `CF-${ymd}-${rand}`;
}
function fmtMoney(n){ return '\u20b1' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return '\u2014'; const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startOfWeek(){ const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day===0?-6:1); const s = new Date(d.setDate(diff)); s.setHours(0,0,0,0); return s; }
function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function baseUrl(){ return location.href.split('#')[0]; }

/* ---------------- Status flow ---------------- */
const STATUS_STEPS = ['pending','loaded','in_transit','delivered'];
const STATUS_LABELS = { pending:'Submitted', loaded:'Loaded', in_transit:'In Transit', delivered:'Delivered' };
function invoiceId(){
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `INV-${ymd}-${rand}`;
}
function fmtDMY(dateStr){
  if(!dateStr) return '--/--/2026';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function activeTrip(list){
  return (list||[]).find(t => t.active) || null;
}
function buildAnnouncement(t){
  const dests = (t.destinations||[]).join(', ');
  return `Dear All,
Our Next trip is from 
${t.origin} To ${dests}
${t.trackingLink||''}
Date ${fmtDMY(t.date)} Time ${t.loadingTime||'--:--'} - ${t.departureTime||'--:--'} Departure, Location: ${t.location||''}

Boat Contact Details: ${t.boatContacts||''}
${t.viberLink||''}
Thankyou \ud83d\ude0a
~GREEN LINE ~\u0783\u07b0\u0783\u07a8\u0796\u07ac \u0784\u07a8\u078b\u07a9\u0782`;
}

/* ---------------- App state ---------------- */
const ROLES = {
  owner:  { name:'Owner',      desc:'Full oversight, rates & revenue', pinField:'ownerPin', icon:'crown' },
  staff:  { name:'Boat Staff', desc:'Log loading & unloading',         pinField:'staffPin', icon:'clipboard' },
  sender: { name:'Sender',     desc:'Sending cargo',                   pinField:null,        icon:'box' },
  receiver:{name:'Receiver',   desc:'Receiving cargo',                 pinField:null,        icon:'pin' },
};
const ROLE_TABS = {
  owner:   [{id:'dashboard',label:'Dashboard'},{id:'trips',label:'Trips'},{id:'invoices',label:'Invoices'},{id:'reports',label:'Reports'},{id:'settings',label:'Settings'},{id:'track',label:'Track'}],
  staff:   [{id:'dashboard',label:'Dashboard'},{id:'track',label:'Track'}],
  sender:  [{id:'checkin',label:'New Check-In'},{id:'track',label:'Track'}],

};
const DEFAULT_TAB = { owner:'dashboard', staff:'dashboard', sender:'checkin', receiver:'track' };
const INTERNAL_ROLES = ['owner','staff'];

let state = {
  entryMode: 'customer', // 'customer' | 'internal'
  gateRole: null, // 'owner' | 'staff' | null (which link they entered through)
  gateMode: 'signin', // for staff gate: 'signin' | 'request'
  role: null,
  gateStage: 'pick',
  pinTargetRole: null,
  pinError: '',
  tab: null,
  staffName: null,
  settingsTab: 'staff',
  shipments: [],
  rates: [],
  trips: [],
  settings: Object.assign({}, DEFAULT_SETTINGS),
  loadingDraft: {},
  trackQuery: '',
  filter: 'all',
};

async function refreshData(){
  state.shipments = await loadShipments();
  state.rates = await loadRates();
  state.trips = await loadTrips();
  state.settings = await loadSettings();
}

/* ---------------- Icons ---------------- */
const ICONS = {
  crown: '<path d="M3 8l4 4 5-7 5 7 4-4-2 10H5L3 8z"/><path d="M5 21h14"/>',
  clipboard: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M9 11h6M9 15h6"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',

/* ---------------- Internal gate (Owner / Boat Staff) ---------------- */
function renderGate(){
  document.getElementById('mode-toggle').style.display='none';
  document.getElementById('tabs').style.display='none';
  document.getElementById('panel').style.display='none';
  document.getElementById('role-pill').style.display='none';
  const area = document.getElementById('gate-area');

  if(state.gateStage === 'pin' && state.pinTargetRole){
    const r = ROLES[state.pinTargetRole];
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="pin-box">
          <div class="rname">${r.name} PIN</div>
          <input type="password" inputmode="numeric" id="pin-input" maxlength="6" placeholder="&bull;&bull;&bull;&bull;">
          <div class="pin-error">${state.pinError}</div>
          <button class="btn btn-primary" id="pin-submit" style="width:100%;margin-bottom:10px;">Enter</button>
          <button class="btn btn-ghost" id="pin-back" style="width:100%;">Back</button>
        </div>
      </div>
    `;
    const input = document.getElementById('pin-input');
    input.focus();
    const grant = (staffName) => {
      state.role = state.pinTargetRole;
      state.staffName = staffName || null;
      state.gateStage = 'pick';
      state.pinError = '';
      state.tab = DEFAULT_TAB[state.role];
      location.hash = state.tab;
      render();
    };
    const fail = () => { state.pinError = 'Incorrect PIN. Try again.'; renderGate(); };
    const tryPin = () => {
      const entered = input.value;
      if(state.pinTargetRole === 'staff'){
        const users = state.settings.staffUsers || [];
        const match = users.find(u => u.pin === entered);
        if(match){ grant(match.name); return; }
        // Legacy fallback: single staff PIN, only while no staff accounts exist yet.
        if(users.length === 0 && entered === state.settings.staffPin){ grant(null); return; }
        fail();
        return;
      }
      // Owner (and any other pinField role)
      if(entered === state.settings[r.pinField]){ grant(null); }
      else fail();
    };
    document.getElementById('pin-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
    document.getElementById('pin-back').addEventListener('click', () => {
      if(state.gateRole){ state.gateStage='signin'; } else { state.gateStage='pick'; }
      state.pinError=''; renderGate();
    });
    return;
  }

  // Owner-specific link: go straight to the Owner PIN box, no picker.
  if(state.gateRole === 'owner'){
    state.pinTargetRole = 'owner';
    state.gateStage = 'pin';
    renderGate();
    return;
  }

  // Staff-specific link: Sign In / Request Access toggle, no Owner card.
  if(state.gateRole === 'staff'){
    renderStaffGate();
    return;
  }

  // Fallback (shouldn't normally be reached, kept for safety): generic picker.
  area.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-title">
          <h1>Staff Sign-In</h1>
          <p>This link is for internal use only</p>
        </div>
        <div class="role-grid">
          ${INTERNAL_ROLES.map(key => {
            const r = ROLES[key];
            return `
              <div class="role-card" data-role="${key}">
                <div class="ricon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[r.icon]}</svg></div>
                <div class="rname">${r.name}</div>
                <div class="rdesc">${r.desc}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  area.querySelectorAll('.role-card').forEach(c => c.addEventListener('click', () => {
    state.pinTargetRole = c.dataset.role; state.gateStage = 'pin'; state.pinError=''; renderGate();
  }));
}

function renderStaffGate(){
  const area = document.getElementById('gate-area');
  const mode = state.gateMode || 'signin';
  area.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-title">
          <h1>Boat Staff</h1>
          <p>Sign in, or request access if you're new</p>
        </div>
        <div class="mode-toggle" style="display:flex;margin-bottom:16px;">
          <button class="${mode==='signin'?'active':''}" data-gm="signin">Sign In</button>
          <button class="${mode==='request'?'active':''}" data-gm="request">Request Access</button>
        </div>
        <div id="staff-gate-body"></div>
      </div>
    </div>
  `;
  area.querySelectorAll('[data-gm]').forEach(b => b.addEventListener('click', () => {
    state.gateMode = b.dataset.gm; renderStaffGate();
  }));

  const body = document.getElementById('staff-gate-body');
  if(mode === 'signin'){
    body.innerHTML = `
      <div class="pin-box" style="margin:0;">
        <div class="rname">Enter your PIN</div>
        <input type="password" inputmode="numeric" id="staffgate-pin" maxlength="6" placeholder="&bull;&bull;&bull;&bull;">
        <div class="pin-error" id="staffgate-error"></div>
        <button class="btn btn-primary" id="staffgate-submit" style="width:100%;">Enter</button>
      </div>
    `;
    const input = document.getElementById('staffgate-pin');
    input.focus();
    const tryPin = () => {
      const entered = input.value;
      const users = state.settings.staffUsers || [];
      const match = users.find(u => u.pin === entered);
      if(match || (users.length === 0 && entered === state.settings.staffPin)){
        state.role = 'staff';
        state.staffName = match ? match.name : null;
        state.tab = DEFAULT_TAB.staff;
        location.hash = state.tab;
        render();
        return;
      }
      document.getElementById('staffgate-error').textContent = 'Incorrect PIN. Try again.';
    };
    document.getElementById('staffgate-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
  } else {
    body.innerHTML = `
      <label>Your name</label>
      <input type="text" id="req-name" placeholder="e.g. Ahmed">
      <label>Email address</label>
      <input type="text" id="req-email" placeholder="e.g. ahmed@example.com">
      <label>Mobile number</label>
      <input type="tel" id="req-mobile" placeholder="e.g. 771 2345">
      <div id="req-msg" class="note" style="display:none;"></div>
      <button class="btn btn-primary" id="req-submit" style="width:100%;">Request Access</button>
      <div class="note" style="margin-top:12px;">An owner or manager will need to approve your request and share a sign-in PIN with you before you can get in.</div>
    `;
    document.getElementById('req-submit').addEventListener('click', async () => {
      const name = document.getElementById('req-name').value.trim();
      const email = document.getElementById('req-email').value.trim();
      const mobile = document.getElementById('req-mobile').value.trim();
      if(!name || !email){ alert('Enter your name and email address.'); return; }
      await withFreshSettings(fresh => {
        const list = fresh.pendingStaff || (fresh.pendingStaff = []);
        list.push({id:'req-'+Date.now(), name, email, mobile, requestedAt:new Date().toISOString()});
      });
      const msg = document.getElementById('req-msg');
      msg.style.display = 'block';
      msg.textContent = 'Request sent. Wait for an owner or manager to approve you and share your PIN.';
      document.getElementById('req-name').value=''; document.getElementById('req-email').value=''; document.getElementById('req-mobile').value='';
    });
  }
}

function logoutInternal(){
  const backHash = state.gateRole === 'owner' ? OWNER_HASH : INTERNAL_HASH;
  state.role = null; state.gateStage='pick'; state.pinTargetRole=null; state.pinError=''; state.tab=null; state.staffName=null; state.gateMode='signin';
  history.replaceState(null,'','#'+backHash);
  render();
}

/* ---------------- Mode toggle (Sender / Receiver) ---------------- */
function renderModeToggle(){
  const el = document.getElementById('mode-toggle');
  el.style.display = 'flex';
  el.innerHTML = `
    <button class="${state.role==='sender'?'active':''}" data-mode="sender">I'm Sending Cargo</button>
    <button class="${state.role==='receiver'?'active':''}" data-mode="receiver">I'm Receiving Cargo</button>
  `;
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    state.role = b.dataset.mode;
    state.tab = DEFAULT_TAB[state.role];
    location.hash = state.tab;
    render();
  }));
}

/* ---------------- Nav ---------------- */
function renderTabs(){
  const pending = state.shipments.filter(s => s.status === 'pending').length;
  const el = document.getElementById('tabs');
  el.style.display = 'flex';
  const tabs = ROLE_TABS[state.role] || [];
  el.innerHTML = tabs.map(t => {
    const active = t.id === state.tab ? 'active' : '';
    const badge = (t.id === 'dashboard' && pending > 0) ? `<span class="badge">${pending}</span>` : '';
    return `<button class="${active}" data-tab="${t.id}">${t.label}${badge}</button>`;
  }).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; }));

  const pill = document.getElementById('role-pill');
  if(state.entryMode === 'internal'){
    pill.style.display = 'flex';
    document.getElementById('role-label').textContent = ROLES[state.role].name + (state.staffName ? ' \u00b7 ' + state.staffName : '');
    document.getElementById('switch-role-btn').onclick = logoutInternal;
  } else {
    pill.style.display = 'none';
  }
}

/* ---------------- Dashboard (owner + staff) ---------------- */
function renderDashboard(){
  const panel = document.getElementById('panel');
  const filtered = state.shipments
    .filter(s => state.filter === 'all' ? true : s.status === state.filter)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const counts = {
    all: state.shipments.length,
    pending: state.shipments.filter(s=>s.status==='pending').length,
    loaded: state.shipments.filter(s=>s.status==='loaded').length,
    in_transit: state.shipments.filter(s=>s.status==='in_transit').length,
    delivered: state.shipments.filter(s=>s.status==='delivered').length,
  };

  panel.innerHTML = `
    <h2>Dispatch Dashboard</h2>
    <p class="sub">Customer check-ins, loading log, and delivery status.</p>
    <div class="search-row">
      <span class="filter-chip ${state.filter==='all'?'active':''}" data-f="all">All (${counts.all})</span>
      <span class="filter-chip ${state.filter==='pending'?'active':''}" data-f="pending">Awaiting load (${counts.pending})</span>
      <span class="filter-chip ${state.filter==='loaded'?'active':''}" data-f="loaded">Loaded (${counts.loaded})</span>
      <span class="filter-chip ${state.filter==='in_transit'?'active':''}" data-f="in_transit">In Transit (${counts.in_transit})</span>
      <span class="filter-chip ${state.filter==='delivered'?'active':''}" data-f="delivered">Delivered (${counts.delivered})</span>
    </div>
    <div id="list"></div>
  `;
  panel.querySelectorAll('.filter-chip').forEach(c => c.addEventListener('click', () => { state.filter = c.dataset.f; renderDashboard(); }));

  const list = panel.querySelector('#list');
  if(filtered.length === 0){ list.innerHTML = `<div class="empty">No shipments here yet.</div>`; return; }
  list.innerHTML = filtered.map(s => renderTagCard(s)).join('');

  list.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => openLoadForm(b.dataset.load)));
  list.querySelectorAll('[data-transit]').forEach(b => b.addEventListener('click', () => markInTransit(b.dataset.transit)));
  list.querySelectorAll('[data-deliver]').forEach(b => b.addEventListener('click', () => markDelivered(b.dataset.deliver)));
  list.querySelectorAll('[data-invoice]').forEach(b => b.addEventListener('click', () => { state.trackQuery=b.dataset.invoice; location.hash='track'; }));
  list.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', async () => {
    const s = state.shipments.find(x => x.id === b.dataset.pay);
    s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString();
    await saveShipments(state.shipments);
    renderDashboard();
  }));
}

function renderTagCard(s){
  const statusClass = 'status-' + s.status;
  const statusLabel = STATUS_LABELS[s.status] || s.status;
  const draft = state.loadingDraft[s.id];
  let actions = '';
  if(s.status === 'pending'){
    actions = `<button class="btn btn-amber" data-load="${s.id}">Log Items Loaded</button>`;
  } else if(s.status === 'loaded'){
    actions = `<button class="btn btn-primary" data-transit="${s.id}">Mark In Transit</button>
               <button class="btn btn-ghost" data-invoice="${s.id}">View Invoice</button>`;
  } else if(s.status === 'in_transit'){
    actions = `<button class="btn btn-primary" data-deliver="${s.id}">Mark Delivered</button>
               <button class="btn btn-ghost" data-invoice="${s.id}">View Invoice</button>`;
  } else {
    actions = `<button class="btn btn-ghost" data-invoice="${s.id}">View Invoice</button>`;
  }

  const itemsSummary = (s.items && s.items.length) ? s.items.map(i => `${i.qty}\u00d7 ${escapeHtml(i.name)}`).join(', ') : '';
  const receiverLine = s.receiverName ? `<div class="tag-meta">Receiver: ${escapeHtml(s.receiverName)} \u00b7 ${escapeHtml(s.receiverMobile||'')}</div>` : '';
  const invoiceLine = s.invoiceId ? `<div class="tag-meta">Invoice ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#2F7A4F':'#B23A2F'}">${s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid'}</strong></div>` : '';
  const paymentActions = (s.invoiceId && !s.voided && !s.paid) ? `
    <button class="btn btn-primary" data-pay="${s.id}" data-method="cash">Collect \u2014 Cash</button>
    <button class="btn btn-primary" data-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
  ` : '';

  return `
    <div class="tag">
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.id}</div>
          <div class="tag-meta">Sender: ${escapeHtml(s.name)} \u00b7 ${escapeHtml(s.mobile)} \u00b7 to <strong>${escapeHtml(s.island)}</strong></div>
        </div>
        <span class="status-pill ${statusClass}">${statusLabel}</span>
      </div>
      ${receiverLine}
      ${s.note ? `<div class="tag-meta">Note: ${escapeHtml(s.note)}</div>` : ''}
      ${itemsSummary ? `<div class="tag-items">Items: ${itemsSummary} \u2014 Total ${fmtMoney(s.total)}</div>` : ''}
      ${invoiceLine}
      <div class="tag-actions">${actions}${paymentActions}</div>
      ${draft ? renderLoadForm(s) : ''}
    </div>
  `;
}

function openLoadForm(id){
  if(!state.loadingDraft[id]){
    state.loadingDraft[id] = { items: state.rates.map(r => ({ id:r.id, name:r.name, price:r.price, qty:0 })), customName:'', customPrice:'' };
  } else { delete state.loadingDraft[id]; }
  renderDashboard();
}

function renderLoadForm(s){
  const draft = state.loadingDraft[s.id];
  const total = draft.items.reduce((sum,i) => sum + i.qty*i.price, 0);
  return `
    <div style="border-top:1.5px dashed var(--line);margin-top:10px;padding-top:14px;">
      <label style="margin-bottom:10px;">Items loaded for ${s.id}</label>
      ${draft.items.map((i,idx) => `
        <div class="rate-row">
          <div>
            <div class="name">${escapeHtml(i.name)}</div>
            <div class="price">${fmtMoney(i.price)} / unit</div>
          </div>
          <div class="stepper">
            <button data-dec="${idx}" data-sid="${s.id}">\u2212</button>
            <span class="qty">${i.qty}</span>
            <button data-inc="${idx}" data-sid="${s.id}">+</button>
          </div>
        </div>
      `).join('')}
      <div style="display:flex;gap:8px;align-items:flex-end;margin:12px 0;">
        <div style="flex:1;">
          <label>Custom item</label>
          <input type="text" placeholder="e.g. Motorcycle" data-custom-name="${s.id}" value="${escapeHtml(draft.customName)}" style="margin-bottom:0;">
        </div>
        <div style="width:100px;">
          <label>Price</label>
          <input type="text" placeholder="0" data-custom-price="${s.id}" value="${escapeHtml(draft.customPrice)}" style="margin-bottom:0;">
        </div>
        <button class="btn btn-ghost" data-add-custom="${s.id}" style="height:44px;">Add</button>
      </div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(total)}</span></div>
      <div class="tag-actions" style="margin-top:14px;">
        <button class="btn btn-primary" data-confirm-load="${s.id}">Confirm Loaded &amp; Generate Invoice</button>
        <button class="btn btn-ghost" data-cancel-load="${s.id}">Cancel</button>
      </div>
    </div>
  `;
}

function wireLoadFormEvents(){
  document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items[b.dataset.inc].qty++; renderDashboard();
  }));
  document.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items[b.dataset.dec].qty = Math.max(0, d.items[b.dataset.dec].qty - 1); renderDashboard();
  }));
  document.querySelectorAll('[data-custom-name]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customName].customName = inp.value; }));
  document.querySelectorAll('[data-custom-price]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customPrice].customPrice = inp.value; }));
  document.querySelectorAll('[data-add-custom]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.addCustom];
    const name = (d.customName||'').trim();
    const price = parseFloat(d.customPrice) || 0;
    if(!name) return;
    d.items.push({id:'custom-'+Date.now(), name, price, qty:1});
    d.customName=''; d.customPrice='';
    renderDashboard();
  }));
  document.querySelectorAll('[data-cancel-load]').forEach(b => b.addEventListener('click', () => { delete state.loadingDraft[b.dataset.cancelLoad]; renderDashboard(); }));
  document.querySelectorAll('[data-confirm-load]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.confirmLoad;
    const draft = state.loadingDraft[id];
    const items = draft.items.filter(i => i.qty > 0).map(i => ({name:i.name, qty:i.qty, price:i.price}));
    if(items.length === 0){ alert('Add at least one item before confirming.'); return; }
    const total = items.reduce((sum,i) => sum + i.qty*i.price, 0);
    const s = state.shipments.find(x => x.id === id);
    s.status = 'loaded'; s.items = items; s.total = total; s.loadedAt = new Date().toISOString();
    s.invoiceId = s.invoiceId || invoiceId();
    s.paid = s.paid || false;
    delete state.loadingDraft[id];
    await saveShipments(state.shipments);
    renderDashboard();
  }));
}

async function markInTransit(id){
  const s = state.shipments.find(x => x.id === id);
  if(!s) return;
  s.status = 'in_transit'; s.inTransitAt = new Date().toISOString();
  await saveShipments(state.shipments);
  renderDashboard();
}

async function markDelivered(id){
  const s = state.shipments.find(x => x.id === id);
  if(!s) return;
  s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
  await saveShipments(state.shipments);
  renderDashboard();
}

/* ---------------- Check-In (sender) ---------------- */

      <label>Destination island</label>

        <option value="" disabled selected>Select destination</option>
        ${dests.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}
        <option value="__other">Other</option>
      </select>
      <input type="text" id="f-island-other" placeholder="Type destination" style="display:none;">
    ` : `
      <label>Destination island</label>
      <input type="text" id="f-island-other" required placeholder="e.g. Maafushi">
    `;

  panel.innerHTML = `
    <h2>Cargo Check-In</h2>
    <p class="sub">Enter your details and who's receiving the cargo. You'll get a tracking code to share.</p>
    ${trip ? `<div class="note" style="margin-bottom:16px;">Next trip: <strong>${escapeHtml(trip.origin)} \u2192 ${escapeHtml(dests.join(', '))}</strong> on ${fmtDMY(trip.date)}</div>` : ''}

    <form id="checkin-form">
      <label>Your name (sender)</label>
      <input type="text" id="f-name" required>
      <label>Your mobile number</label>
      <input type="tel" id="f-mobile" required>
      ${islandField}
      <label>Receiver's name</label>
      <input type="text" id="f-rname" required>
      <label>Receiver's mobile number</label>
      <input type="tel" id="f-rmobile" required>
      <label>Cargo note (optional)</label>
      <textarea id="f-note" rows="2" placeholder="e.g. 3 sacks of rice, fragile"></textarea>
      <button type="submit" class="btn btn-primary">Submit Check-In</button>
    </form>
    <div id="checkin-result"></div>
  `;

  const selectEl = document.getElementById('f-island-select');
  const otherEl = document.getElementById('f-island-other');
  if(selectEl){
    selectEl.addEventListener('change', () => {
      if(selectEl.value === '__other'){ otherEl.style.display = 'block'; otherEl.required = true; }
      else { otherEl.style.display = 'none'; otherEl.required = false; otherEl.value=''; }
    });
  }

  document.getElementById('checkin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    const mobile = document.getElementById('f-mobile').value.trim();
    const island = selectEl && selectEl.value && selectEl.value !== '__other' ? selectEl.value : (document.getElementById('f-island-other').value||'').trim();
    const receiverName = document.getElementById('f-rname').value.trim();
    const receiverMobile = document.getElementById('f-rmobile').value.trim();
    const note = document.getElementById('f-note').value.trim();
    if(!name || !mobile || !island || !receiverName || !receiverMobile) return;

    const code = trackingCode();
    const shipment = { id: code, name, mobile, island, receiverName, receiverMobile, note, status:'pending', items:[], total:0, tripId: trip ? trip.id : null, createdAt: new Date().toISOString() };
    state.shipments.push(shipment);
    await saveShipments(state.shipments);

    document.getElementById('checkin-result').innerHTML = `
      <div class="confirm-code">
        <div>Check-in received. Save this tracking code:</div>
        <div class="big">${code}</div>
        <div style="font-size:12.5px;color:#C7D3E0;">Share it with ${escapeHtml(receiverName)} so they can track it too.</div>
      </div>
    `;
    e.target.reset();
  });
}

/* ---------------- Track (sender + receiver + staff + owner) ---------------- */
function renderTrack(){
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <h2>Track a Shipment</h2>
    <p class="sub">Search by tracking code, sender mobile, or receiver mobile.</p>
    <div class="search-row">
      <input type="text" id="track-input" placeholder="CF-260721-A3K9 or mobile number" value="${escapeHtml(state.trackQuery)}">
      <button class="btn btn-primary" id="track-btn">Search</button>
    </div>
    <div id="track-results"></div>
  `;
  const runSearch = () => {
    const q = document.getElementById('track-input').value.trim().toLowerCase();
    state.trackQuery = q;
    const results = state.shipments.filter(s =>
      s.id.toLowerCase() === q ||
      (s.mobile||'').toLowerCase().includes(q) ||
      (s.receiverMobile||'').toLowerCase().includes(q)
    );
    const box = document.getElementById('track-results');
    if(!q){ box.innerHTML = ''; return; }
    if(results.length === 0){ box.innerHTML = `<div class="empty">No shipment found for "${escapeHtml(q)}".</div>`; return; }
    box.innerHTML = results.map(renderTrackResult).join('');
  };
  document.getElementById('track-btn').addEventListener('click', runSearch);
  document.getElementById('track-input').addEventListener('keydown', (e) => { if(e.key==='Enter') runSearch(); });
  if(state.trackQuery) runSearch();
}

function renderTrackResult(s){
  const steps = STATUS_STEPS;
  const idx = steps.indexOf(s.status);
  const dates = { pending: s.createdAt, loaded: s.loadedAt, in_transit: s.inTransitAt, delivered: s.deliveredAt };
  const labels = { pending:'Checked In', loaded:'Loaded', in_transit:'In Transit', delivered:'Delivered' };

  const timeline = steps.map((step,i) => `
    <div class="tl-step ${i<=idx?'done':''}">
      <div class="tl-dot"></div>
      <div class="tl-label">${labels[step]}</div>
      <div class="tl-date">${dates[step] ? fmtDate(dates[step]) : ''}</div>
    </div>
  `).join('');

  const invoice = s.items && s.items.length ? `
    <div class="invoice">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="display" style="font-size:15px;color:var(--navy-deep);">Invoice \u2014 ${s.id}</div>
        <button class="btn btn-ghost" onclick="window.print()" style="padding:6px 12px;font-size:11px;">Print</button>
      </div>
      <div class="tag-meta" style="margin-top:6px;">Sender: ${escapeHtml(s.name)} \u00b7 ${escapeHtml(s.mobile)} \u2192 ${escapeHtml(s.island)}</div>
      ${s.receiverName ? `<div class="tag-meta">Receiver: ${escapeHtml(s.receiverName)} \u00b7 ${escapeHtml(s.receiverMobile||'')}</div>` : ''}
      ${s.invoiceId ? `<div class="tag-meta">Invoice ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#2F7A4F':'#B23A2F'}">${s.paid?'Paid':'Unpaid'}</strong></div>` : ''}
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td><td class="num">${fmtMoney(i.price)}</td><td class="num">${fmtMoney(i.qty*i.price)}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="total-line"><span>Total Due</span><span class="amt">${fmtMoney(s.total)}</span></div>
    </div>
  ` : '';

  return `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${labels[s.status]}</span>
      </div>
      <div class="tag-meta">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.island)} ${s.receiverName ? '(for '+escapeHtml(s.receiverName)+')' : ''}</div>
      <div class="timeline">${timeline}</div>
      ${invoice}
    </div>
  `;
}

    const date = document.getElementById('trip-date').value;
    const loadingTime = document.getElementById('trip-loading').value;

    const location = document.getElementById('trip-location').value.trim();

    if(!origin || destinations.length === 0 || !date){ alert('Origin, at least one destination, and a date are required.'); return; }
    const trip = {id:'trip-'+Date.now(), origin, destinations, date, loadingTime, departureTime, location, boatContacts, trackingLink, viberLink, active:true, createdAt:new Date().toISOString()};
    await withFreshTrips(list => {
      list.forEach(t => t.active = false);
      list.push(trip);
    });
    renderTrips();
  });

  if(trips.length === 0){ list.innerHTML = `<div class="empty">No trips planned yet.</div>`; return; }

  list.innerHTML = trips.map(t => `
    <div class="tag">
      <div class="tag-top">
        <div>
          <div class="tag-code">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</div>
          <div class="tag-meta">${fmtDMY(t.date)} \u00b7 Load ${escapeHtml(t.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(t.departureTime||'--:--')}</div>

        <button class="btn btn-danger" data-del-trip="${t.id}">Delete</button>

    </div>

  }));
  list.querySelectorAll('[data-del-trip]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Delete this trip?')) return;
    await withFreshTrips(l => { const i = l.findIndex(t => t.id === b.dataset.delTrip); if(i>-1) l.splice(i,1); });
    renderTrips();
  }));
  list.querySelectorAll('[data-copy-ann]').forEach(b => b.addEventListener('click', () => {
    const t = trips.find(x => x.id === b.dataset.copyAnn);
    const text = buildAnnouncement(t);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => alert('Announcement copied.')).catch(() => alert('Could not copy \u2014 select the text box manually.'));
    } else { alert('Select the text in the box and copy manually.'); }
  }));
}

/* ---------------- Invoices (owner only) ---------------- */
async function renderInvoices(){
  const panel = document.getElementById('panel');

  // Backfill: older shipments may have items/total but never got an invoiceId
  // assigned (e.g. created before this feature existed) -- fix that once, here,
  // so nothing invoiced silently stays invisible on this page.
  let needsSave = false;
  state.shipments.forEach(s => {
    if(s.items && s.items.length && !s.invoiceId){
      s.invoiceId = invoiceId();
      if(s.paid === undefined) s.paid = false;
      needsSave = true;
    }
  });
  if(needsSave) await saveShipments(state.shipments);

  const invoices = state.shipments.filter(s => s.invoiceId && !s.voided);
  const total = invoices.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaid = invoices.filter(s => !s.paid);
  const paid = invoices.filter(s => s.paid);
  const sorted = state.shipments.filter(s => s.invoiceId).sort((a,b) => new Date(b.loadedAt) - new Date(a.loadedAt));

  panel.innerHTML = `
    <h2>Invoices</h2>
    <p class="sub">Generated automatically when a shipment's items are logged.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Invoiced</div><div class="sval">${fmtMoney(total)}</div></div>
      <div class="stat-card"><div class="slabel">Unpaid</div><div class="sval" style="color:var(--red);">${unpaid.length}</div></div>
      <div class="stat-card"><div class="slabel">Paid</div><div class="sval" style="color:var(--green);">${paid.length}</div></div>
    </div>
    <div id="invoice-list"></div>
  `;

  const list = panel.querySelector('#invoice-list');
  if(sorted.length === 0){ list.innerHTML = `<div class="empty">No invoices yet.</div>`; return; }

  list.innerHTML = sorted.map(s => `
    <div class="tag" style="${s.voided ? 'opacity:0.5;' : ''}">
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.voided ? 'status-pending' : (s.paid ? 'status-delivered' : 'status-in_transit')}">${s.voided ? 'Voided' : (s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid')}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      <div class="tag-actions">
        <button class="btn btn-ghost" data-inv-print="${s.id}">Print</button>
        ${!s.voided && !s.paid ? `
          <button class="btn btn-primary" data-inv-pay="${s.id}" data-method="cash">Collect \u2014 Cash</button>
          <button class="btn btn-primary" data-inv-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
        ` : ''}
        ${!s.voided && s.paid ? `<button class="btn btn-ghost" data-inv-unpay="${s.id}">Mark Unpaid</button>` : ''}
        ${!s.voided ? `<button class="btn btn-danger" data-inv-void="${s.id}">Void</button>` : ''}
      </div>
    </div>
  `).join('');

  list.querySelectorAll('[data-inv-print]').forEach(b => b.addEventListener('click', () => { state.trackQuery = b.dataset.invPrint; location.hash = 'track'; }));
  list.querySelectorAll('[data-inv-pay]').forEach(b => b.addEventListener('click', async () => {
    const s = state.shipments.find(x => x.id === b.dataset.invPay);
    s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString();
    await saveShipments(state.shipments);
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
    const s = state.shipments.find(x => x.id === b.dataset.invUnpay);
    s.paid = false; s.paymentMethod = null; s.paidAt = null;
    await saveShipments(state.shipments);
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-void]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Void this invoice? It will be excluded from totals.')) return;
    const s = state.shipments.find(x => x.id === b.dataset.invVoid);
    s.voided = true;
    await saveShipments(state.shipments);
    renderInvoices();
  }));
}

/* ---------------- Reports (owner only) ---------------- */
function renderReports(){
  const panel = document.getElementById('panel');
  const invoiced = state.shipments.filter(s => s.items && s.items.length && !s.voided);
  const totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const todayStart = startOfToday(), weekStart = startOfWeek();
  const revToday = invoiced.filter(s => new Date(s.loadedAt) >= todayStart).reduce((sum,s)=>sum+(s.total||0),0);
  const revWeek = invoiced.filter(s => new Date(s.loadedAt) >= weekStart).reduce((sum,s)=>sum+(s.total||0),0);

  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);

  panel.innerHTML = `
    <h2>Revenue Reports</h2>
    <p class="sub">Owner-only view. Based on invoiced (loaded) shipments.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
      <div class="stat-card"><div class="slabel">This Week</div><div class="sval">${fmtMoney(revWeek)}</div></div>
      <div class="stat-card"><div class="slabel">Today</div><div class="sval">${fmtMoney(revToday)}</div></div>
      <div class="stat-card"><div class="slabel">Shipments Logged</div><div class="sval">${state.shipments.length}</div></div>
    </div>
    <div class="settings-block">
      <h3>By Destination Island</h3>
      ${islandRows.length === 0 ? '<div class="empty">No invoiced shipments yet.</div>' : `
        <div class="invoice" style="padding:14px 18px;">
          <table>
            <thead><tr><th>Island</th><th class="num">Shipments</th><th class="num">Revenue</th></tr></thead>
            <tbody>
              ${islandRows.map(isl => `<tr><td>${escapeHtml(isl)}</td><td class="num">${byIsland[isl].count}</td><td class="num">${fmtMoney(byIsland[isl].revenue)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

            <span class="spin">PIN ${escapeHtml(u.pin)}</span>
            <button class="btn btn-danger" data-staff-del="${idx}" style="padding:8px 12px;">Remove</button>
          </div>
        `).join('')}
      </div>
    `;
    el.querySelectorAll('[data-staff-del]').forEach(b => b.addEventListener('click', async () => {
      const idx = parseInt(b.dataset.staffDel,10);
      b.disabled = true;
      await withFreshSettings(fresh => {
        const list = fresh.staffUsers || (fresh.staffUsers = []);
        const target = (state.settings.staffUsers || [])[idx];
        if(target){
          const pos = list.findIndex(u => (target.id && u.id === target.id) || (u.name === target.name && u.pin === target.pin));
          if(pos > -1) list.splice(pos, 1);
        }
      });
      renderStaffList();
    }));
  };
  renderStaffList();

  function closeInviteModal(){ document.getElementById('invite-modal-wrap').innerHTML = ''; }

  document.getElementById('open-invite-btn').addEventListener('click', () => {
    document.getElementById('invite-modal-wrap').innerHTML = `
      <div class="settings-block" style="border:1.5px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;background:#fff;">
        <h3 style="margin-bottom:12px;">Invite Staff Member</h3>
        <label>Staff member name</label>
        <input type="text" id="invite-name" placeholder="e.g. Ahmed">
        <label>Email address</label>
        <input type="text" id="invite-email" placeholder="e.g. ahmed@example.com">
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" id="invite-cancel-btn" style="flex:1;">Cancel</button>
          <button class="btn btn-primary" id="invite-create-btn" style="flex:1;">Create Invite</button>
        </div>
      </div>
    `;
    document.getElementById('invite-cancel-btn').addEventListener('click', closeInviteModal);
    document.getElementById('invite-create-btn').addEventListener('click', async () => {
      const name = document.getElementById('invite-name').value.trim();
      const email = document.getElementById('invite-email').value.trim();
      if(!name || !email){ alert('Enter both a name and an email address.'); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ alert('Enter a valid email address.'); return; }
      let blocked = false, newPin = '';
      await withFreshSettings(fresh => {
        const users = fresh.staffUsers || (fresh.staffUsers = []);
        const usedPins = new Set(users.map(u => u.pin).concat([fresh.ownerPin]));
        do { newPin = String(Math.floor(1000 + Math.random()*9000)); } while(usedPins.has(newPin));
        users.push({id:'staff-'+Date.now(), name, email, pin:newPin, status:'approved'});
      });
      closeInviteModal();
      renderStaffList();
      alert(`Invite created for ${name}.\n\nShare this PIN with them to sign in: ${newPin}`);
    });
  });

  document.getElementById('save-owner-pin-btn').addEventListener('click', async () => {
    const val = document.getElementById('owner-pin-input').value.trim() || DEFAULT_SETTINGS.ownerPin;
    let blocked = false;
    await withFreshSettings(fresh => {
      if((fresh.staffUsers||[]).some(u => u.pin === val)){ blocked = true; return; }
      fresh.ownerPin = val;
    });
    if(blocked){ alert('That PIN is used by a staff account. Pick another.'); return; }
    alert('Owner PIN updated.');
  });
}

function renderRatesSetup(){
  const body = document.getElementById('settings-body');
  const staffUrl = baseUrl() + '#' + INTERNAL_HASH;
  const customerUrl = state.settings.qrUrl || baseUrl();
  body.innerHTML = `
    <div class="settings-block">
      <h3>App Links</h3>
      <div class="url-box"><div><div class="tag-label">Staff / Owner sign-in</div><div class="u">${escapeHtml(staffUrl)}</div></div></div>
      <div class="url-box"><div><div class="tag-label">Customer QR (Sender / Receiver)</div><div class="u">${escapeHtml(customerUrl)}</div></div></div>
      <div class="note">Bookmark the staff link \u2014 it's the only way in for Owner and Boat Staff. Point the QR code customers scan at the customer link.</div>
    </div>

    <div class="settings-block">
      <h3>Item Rates</h3>
      <div id="rates-list"></div>
      <div style="display:flex;gap:8px;align-items:flex-end;margin-top:10px;">
        <div style="flex:1;"><label>New item name</label><input type="text" id="new-rate-name" style="margin-bottom:0;"></div>
        <div style="width:100px;"><label>Price</label><input type="text" id="new-rate-price" style="margin-bottom:0;"></div>
        <button class="btn btn-ghost" id="add-rate-btn" style="height:44px;">Add</button>
      </div>
    </div>

    <div class="settings-block">
      <h3>QR Link Override</h3>
      <label>Public URL customers should scan (once published/hosted)</label>
      <input type="text" id="qr-url-input" placeholder="https://yourdomain.com/cargo-log" value="${escapeHtml(state.settings.qrUrl)}">
      <button class="btn btn-primary" id="save-qr-btn">Save Link</button>
      <div class="note">Leave blank to just use this page's own address for the customer link shown above.</div>
    </div>
  `;

  const renderRatesList = () => {
    document.getElementById('rates-list').innerHTML = state.rates.map((r,idx) => `
      <div class="rate-edit-row">
        <input type="text" data-rate-name="${idx}" value="${escapeHtml(r.name)}">
        <input type="text" class="price-input" data-rate-price="${idx}" value="${r.price}">
        <button class="btn btn-danger" data-rate-del="${idx}" style="padding:9px 12px;">Remove</button>
      </div>
    `).join('');
    document.querySelectorAll('[data-rate-name]').forEach(inp => inp.addEventListener('change', async () => { state.rates[inp.dataset.rateName].name = inp.value; await saveRates(state.rates); }));
    document.querySelectorAll('[data-rate-price]').forEach(inp => inp.addEventListener('change', async () => { state.rates[inp.dataset.ratePrice].price = parseFloat(inp.value) || 0; await saveRates(state.rates); }));
    document.querySelectorAll('[data-rate-del]').forEach(b => b.addEventListener('click', async () => { state.rates.splice(b.dataset.rateDel,1); await saveRates(state.rates); renderRatesList(); }));
  };
  renderRatesList();

  document.getElementById('add-rate-btn').addEventListener('click', async () => {
    const name = document.getElementById('new-rate-name').value.trim();
    const price = parseFloat(document.getElementById('new-rate-price').value) || 0;
    if(!name) return;
    state.rates.push({id:'rate-'+Date.now(), name, price});
    await saveRates(state.rates);
    document.getElementById('new-rate-name').value=''; document.getElementById('new-rate-price').value='';
    renderRatesList();
  });

  document.getElementById('save-qr-btn').addEventListener('click', async () => {
    state.settings.qrUrl = document.getElementById('qr-url-input').value.trim();
    await saveSettings(state.settings);
    renderSettings();
  });
}

/* ---------------- Main render dispatch ---------------- */
function render(){
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    renderGate();
    return;
  }
  document.getElementById('gate-area').innerHTML = '';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('panel').style.display = 'block';

  if(state.entryMode === 'customer'){ renderModeToggle(); }
  else { document.getElementById('mode-toggle').style.display = 'none'; }

  renderTabs();

  const allowed = ROLE_TABS[state.role].map(t => t.id);
  if(!allowed.includes(state.tab)) state.tab = DEFAULT_TAB[state.role];

  if(state.tab === 'dashboard'){ renderDashboard(); wireLoadFormEvents(); }
  else if(state.tab === 'checkin'){ renderCheckin(); }
  else if(state.tab === 'track'){ renderTrack(); }
  else if(state.tab === 'reports'){ renderReports(); }
  else if(state.tab === 'invoices'){ renderInvoices(); }
  else if(state.tab === 'trips'){ renderTrips(); }
  else if(state.tab === 'settings'){ renderSettings(); }
}

const _origRenderDashboard = renderDashboard;
renderDashboard = function(){ _origRenderDashboard(); wireLoadFormEvents(); };

/* ---------------- Routing ---------------- */
function handleHash(){
  const h = (location.hash || '').replace('#','');

  if(h === OWNER_HASH){
    if(!(state.role === 'owner')){
      state.entryMode = 'internal'; state.gateRole = 'owner'; state.role = null; state.gateStage = 'pick';
    }
    render();
    return;
  }
  if(h === INTERNAL_HASH){
    if(!(state.role === 'staff')){
      state.entryMode = 'internal'; state.gateRole = 'staff'; state.role = null; state.gateStage = 'pick'; state.gateMode = 'signin';
    }
    render();
    return;
  }

  if(state.entryMode === 'internal' && INTERNAL_ROLES.includes(state.role)){
    if(ROLE_TABS[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    render();
    return;
  }

  // customer mode
  state.entryMode = 'customer';
  if(!state.role){ state.role = 'sender'; state.tab = 'checkin'; }
  if(ROLE_TABS[state.role].some(t => t.id === h)) state.tab = h;
  render();
}

window.addEventListener('hashchange', handleHash);

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString(undefined,{weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

async function init(){
  await refreshData();
  handleHash();
  tickClock();
  setInterval(tickClock, 30000);
  setInterval(async () => {
    const fresh = await loadShipments();
    if(JSON.stringify(fresh) !== JSON.stringify(state.shipments)){
      state.shipments = fresh;
      if(state.role && (state.tab === 'dashboard' || state.tab === 'track' || state.tab === 'reports')){ render(); }
      else if(state.role){ renderTabs(); }
    }
  }, 5000);
}
init();
</script>
