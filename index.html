        `}
        <label>Destinations (one per line)</label>
        <textarea id="trip-dests" rows="3" placeholder="Fills in automatically once you pick an origin \u2014 edit if needed"></textarea>
        <label>Trip date</label>
        <input type="date" id="trip-date">
        <label>Loading time</label>
        <input type="time" id="trip-loading">
        <label>Estimated departure time</label>
        <input type="time" id="trip-departure">
        <label>Loading location / jetty</label>
        <input type="text" id="trip-location" placeholder="Fills in automatically once you pick an origin">
        ${hasDefaults ? `
          <div class="note">Boat contacts, tracking link, and Viber link are fixed and pulled in automatically from Owner Settings \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">edit them there</a> if they ever change.</div>
        ` : `
          <div class="note" style="border-color:var(--red);color:var(--red);">Boat contacts, tracking link, and Viber link aren't set yet \u2014 go to <a href="#settings" style="color:var(--red);font-weight:700;">Owner Settings</a> and add them first, or the announcement will show them blank.</div>
        `}
        <button class="btn btn-primary" id="create-trip-btn" style="margin-top:12px;">Create Trip &amp; Set Active</button>
      </div>
    `}
    <div id="trip-list" style="margin-top:20px;"></div>
  `;

  if(!ongoingTrip){
  if(boatRoutes.length > 0){
    document.getElementById('trip-origin').addEventListener('change', (e) => {
      const otherInput = document.getElementById('trip-origin-other');
      if(e.target.value === '__other'){
        otherInput.style.display = '';
        otherInput.focus();
        return;
      }
      otherInput.style.display = 'none';
      const route = boatRoutes.find(r => r.origin === e.target.value);
      if(!route) return;
      document.getElementById('trip-dests').value = (route.destinations||[]).join('\n');
      document.getElementById('trip-location').value = route.location || '';
    });
  }

  document.getElementById('create-trip-btn').addEventListener('click', async () => {
    const originSelect = document.getElementById('trip-origin');
    const origin = (originSelect && originSelect.value !== '__other' ? originSelect.value : document.getElementById('trip-origin-other').value).trim();
    const destinations = document.getElementById('trip-dests').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const date = document.getElementById('trip-date').value;
    const loadingTime = document.getElementById('trip-loading').value;
    const departureTime = document.getElementById('trip-departure').value;
    const location = document.getElementById('trip-location').value.trim();
    const fresh = state.settings.tripDefaults || {};
    const boatContacts = fresh.boatContacts || '';
    const trackingLink = fresh.trackingLink || '';
    const viberLink = fresh.viberLink || '';
    if(!origin || destinations.length === 0 || !date){ alert('Origin, at least one destination, and a date are required.'); return; }
    const trip = {id:'trip-'+Date.now(), origin, destinations, date, loadingTime, departureTime, location, boatContacts, trackingLink, viberLink, active:true, createdAt:new Date().toISOString()};
    await withFreshTrips(list => {
      list.forEach(t => t.active = false);
      list.push(trip);
    });
    renderTrips();
    createGoogleSheetForTrip(trip);
  });
  } // end ongoingTrip guard

  const list = panel.querySelector('#trip-list');
  if(trips.length === 0){ list.innerHTML = `<div class="empty">No trips planned yet.</div>`; return; }

  list.innerHTML = trips.map(t => {
    const loadedCount = state.shipments.filter(s => s.tripId === t.id && s.status === 'loaded').length;
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    const undelivered = tripShipments.filter(s => s.status !== 'delivered');
    const delivered = tripShipments.filter(s => s.status === 'delivered');
    const statusClass = t.finished ? 'status-delivered' : (t.departed ? 'status-in_transit' : (t.active?'status-delivered':'status-pending'));
    const statusLabel = t.finished ? 'Finished' : (t.departed ? 'In Transit' : (t.active?'Active':'Past'));
    const showFinish = state.finishDraft[t.id];
    return `
    <div class="tag">
      <div class="tag-top">
        <div>
          <div class="tag-code">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</div>
          <div class="tag-meta">${fmtDMY(t.date)} \u00b7 Load ${escapeHtml(t.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(t.departureTime||'--:--')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="status-pill ${statusClass}">${statusLabel}</span>
          ${t.arrivedIsland && !t.finished ? `<span class="status-pill status-arrived">Boat Arrived ${escapeHtml(t.arrivedIsland)}</span>` : ''}
        </div>
      </div>
      <div class="tag-meta">${escapeHtml(t.location||'')}</div>
      ${t.finished ? `<div class="tag-meta">${delivered.length} delivered \u00b7 ${undelivered.length} undelivered</div>` : ''}
      ${t.departed && !t.finished ? `
        <div style="margin-top:10px;">
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:4px;">Boat arrived at</label>
          <select data-arrived-select="${t.id}">
            <option value="" ${!t.arrivedIsland ? 'selected' : ''}>Not arrived yet</option>
            ${(t.destinations||[]).map(isl => `<option value="${escapeHtml(isl)}" ${t.arrivedIsland===isl ? 'selected' : ''}>${escapeHtml(isl)}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      <div class="tag-actions">
        ${!t.active && !t.finished ? `<button class="btn btn-amber" data-set-active="${t.id}">Set Active</button>` : ''}
        ${t.active && !t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-transit="${t.id}">Mark In Transit (${loadedCount} loaded)</button>` : ''}
        ${t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-finish="${t.id}">Mark Trip Finished</button>` : ''}
        ${!t.finished ? `<button class="btn btn-ghost" data-copy-ann="${t.id}">Copy Announcement</button>` : ''}
        <button class="btn btn-danger" data-del-trip="${t.id}">Delete</button>
      </div>
      ${showFinish ? `
        <div class="cash-box">
          <label style="margin-bottom:8px;">${undelivered.length === 0 ? 'Everything on this trip was delivered.' : `${undelivered.length} shipment(s) still not delivered:`}</label>
          ${undelivered.length ? `
            <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
              ${undelivered.map(s => `
                <div class="item-result-row" style="cursor:default;">
                  <span>${escapeHtml(s.id)} \u2014 ${escapeHtml(s.name)} \u2192 ${escapeHtml(s.island)}</span>
                  <span class="status-pill status-${s.status}" style="font-size:9px;padding:3px 8px;">${STATUS_LABELS[s.status]}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
          <div class="tag-actions">
            <button class="btn btn-primary" data-confirm-finish="${t.id}">Confirm \u2014 Finish Trip</button>
            <button class="btn btn-ghost" data-cancel-finish="${t.id}">Cancel</button>
          </div>
        </div>
      ` : ''}
      ${!t.finished ? `<textarea readonly rows="9" style="margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;">${escapeHtml(buildAnnouncement(t))}</textarea>` : ''}
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-mark-transit]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Mark this trip in transit? Every loaded shipment on this trip will move to "In Transit" together, and a manifest file will be saved to this device.')) return;
    const tripId = b.dataset.markTransit;
    const trip = (state.trips||[]).find(t => t.id === tripId);
    const tripShipments = state.shipments.filter(s => s.tripId === tripId);
    let moved;
    try{
      moved = await markTripInTransit(tripId);
    }catch(e){
      console.error('markTripInTransit failed', e);
      alert('Could not mark this trip in transit. Check your connection and try again.');
      return;
    }
    if(trip) downloadTripManifest(trip, tripShipments);
    alert(`Trip marked in transit. ${moved} shipment(s) updated.`);
    renderTrips();
  }));

  list.querySelectorAll('[data-mark-finish]').forEach(b => b.addEventListener('click', () => {
    state.finishDraft[b.dataset.markFinish] = true;
    renderTrips();
  }));
  list.querySelectorAll('[data-cancel-finish]').forEach(b => b.addEventListener('click', () => {
    delete state.finishDraft[b.dataset.cancelFinish];
    renderTrips();
  }));
  list.querySelectorAll('[data-confirm-finish]').forEach(b => b.addEventListener('click', async () => {
    await finishTrip(b.dataset.confirmFinish);
    delete state.finishDraft[b.dataset.confirmFinish];
    alert('Trip marked finished. Its shipments have moved off the Dashboard and into Reports.');
    renderTrips();
  }));

  list.querySelectorAll('[data-arrived-select]').forEach(sel => sel.addEventListener('change', async () => {
    const tripId = sel.dataset.arrivedSelect;
    const island = sel.value || null;
    await withFreshTrips(l => {
      const t = l.find(x => x.id === tripId);
      if(t){ t.arrivedIsland = island; t.arrivedAt = island ? new Date().toISOString() : null; }
    });
    // Carries the selection over to the Dashboard's Islands filter, so
    // switching tabs after marking an arrival already shows that island's
    // shipments without needing to tap the chip manually.
    state.dashIslandView = island;
    renderTrips();
  }));

  list.querySelectorAll('[data-set-active]').forEach(b => b.addEventListener('click', async () => {
    await withFreshTrips(l => { l.forEach(t => t.active = (t.id === b.dataset.setActive)); });
    renderTrips();
  }));
  list.querySelectorAll('[data-del-trip]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Delete this trip?')) return;
    await withFreshTrips(l => { const i = l.findIndex(t => t.id === b.dataset.delTrip); if(i>-1) l.splice(i,1); });
    renderTrips();
  }));
  list.querySelectorAll('[data-copy-ann]').forEach(b => b.addEventListener('click', () => {
    const t = trips.find(x => x.id === b.dataset.copyAnn);
    const text = buildAnnouncement(t);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => alert('Announcement copied.')).catch(() => alert('Could not copy \u2014 select the text box manually.'));
    } else { alert('Select the text in the box and copy manually.'); }
  }));
}

/* ---------------- Invoices (owner only) ---------------- */
async function renderInvoices(){
  const panel = document.getElementById('panel');

  // Backfill: older shipments may have items/total but never got an invoiceId
  // assigned (e.g. created before this feature existed) -- fix that once, here,
  // so nothing invoiced silently stays invisible on this page.
  let needsSave = false;
  state.shipments.forEach(s => {
    if(s.items && s.items.length && !s.invoiceId){ needsSave = true; }
  });
  if(needsSave){
    await withFreshShipments(list => {
      list.forEach(s => {
        if(s.items && s.items.length && !s.invoiceId){
          s.invoiceId = invoiceId();
          if(s.paid === undefined) s.paid = false;
        }
      });
    });
  }

  const invoices = state.shipments.filter(s => s.invoiceId && !s.voided && !isTripFinished(s.tripId));
  const total = invoices.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaid = invoices.filter(s => !s.paid);
  const paid = invoices.filter(s => s.paid);
  const sorted = state.shipments.filter(s => s.invoiceId && !isTripFinished(s.tripId)).sort((a,b) => new Date(b.loadedAt) - new Date(a.loadedAt));

  panel.innerHTML = `
    <h2>Invoices</h2>
    <p class="sub">Generated automatically when a shipment's items are logged. Invoices from finished trips move to Reports.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Invoiced</div><div class="sval">${fmtMoney(total)}</div></div>
      <div class="stat-card"><div class="slabel">Unpaid</div><div class="sval" style="color:var(--red);">${unpaid.length}</div></div>
      <div class="stat-card"><div class="slabel">Paid</div><div class="sval" style="color:var(--green);">${paid.length}</div></div>
    </div>
    <div id="invoice-list"></div>
  `;

  const list = panel.querySelector('#invoice-list');
  if(sorted.length === 0){ list.innerHTML = `<div class="empty">No invoices yet.</div>`; return; }

  list.innerHTML = sorted.map(s => {
    const cash = state.cashDraft[s.id];
    return `
    <div class="tag" style="${s.voided ? 'opacity:0.5;' : ''}">
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.voided ? 'status-pending' : (s.paid ? 'status-delivered' : 'status-in_transit')}">${s.voided ? 'Voided' : (s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid')}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      <div class="tag-actions">
        <button class="btn btn-ghost" data-inv-print="${s.id}">Share</button>
        ${!s.voided && !s.paid && !cash ? `
          <button class="btn btn-primary" data-cash-open="${s.id}">Collect \u2014 Cash</button>
          <button class="btn btn-primary" data-inv-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
        ` : ''}
        ${!s.voided && s.paid ? `<button class="btn btn-ghost" data-inv-unpay="${s.id}">Mark Unpaid</button>` : ''}
        ${!s.voided ? `<button class="btn btn-danger" data-inv-void="${s.id}">Void</button>` : ''}
      </div>
      ${cash ? renderCashForm(s) : ''}
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-inv-print]').forEach(b => b.addEventListener('click', () => { state.trackQuery = b.dataset.invPrint; location.hash = 'track'; }));
  list.querySelectorAll('[data-inv-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invPay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invPay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    state.cashDraft[b.dataset.cashOpen] = { received: '' };
    renderInvoices();
  }));
  list.querySelectorAll('[data-cash-cancel]').forEach(b => b.addEventListener('click', () => {
    delete state.cashDraft[b.dataset.cashCancel];
    renderInvoices();
  }));
  list.querySelectorAll('[id^="cash-input-"]').forEach(inp => inp.addEventListener('input', () => {
    const id = inp.id.replace('cash-input-','');
    if(!state.cashDraft[id]) return;
    state.cashDraft[id].received = inp.value;
    const s = state.shipments.find(x => x.id === id);
    const received = parseFloat(inp.value) || 0;
    const balance = received - (s.total || 0);
    const label = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
    const color = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
    const balEl = document.getElementById('cash-balance-'+id);
    if(balEl){ balEl.textContent = `${label}: ${fmtMoney(Math.abs(balance))}`; balEl.style.color = color; }
  }));
  list.querySelectorAll('[data-cash-confirm]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.cashConfirm;
    const received = parseFloat(state.cashDraft[id].received) || 0;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === id);
      if(s){
        s.paid = true; s.paymentMethod = 'cash'; s.paidAt = new Date().toISOString();
        s.cashReceived = received; s.cashChange = received - (s.total||0);
      }
    });
    delete state.cashDraft[id];
    syncShipmentToSheet(state.shipments.find(x => x.id === id));
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invUnpay);
      if(s){ s.paid = false; s.paymentMethod = null; s.paidAt = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invUnpay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-void]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Void this invoice? It will be excluded from totals.')) return;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invVoid);
      if(s) s.voided = true;
    });
    renderInvoices();
  }));
}

/* ---------------- Reports (owner only) ---------------- */
function renderReports(){
  if(state.reportTripView && state.reportIslandView) return renderReportIslandDetail();
  if(state.reportTripView) return renderReportTripIslands();

  const panel = document.getElementById('panel');
  const invoiced = state.shipments.filter(s => s.items && s.items.length && !s.voided && s.paid);
  const totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const todayStart = startOfToday(), weekStart = startOfWeek();
  const revToday = invoiced.filter(s => new Date(s.paidAt) >= todayStart).reduce((sum,s)=>sum+(s.total||0),0);
  const revWeek = invoiced.filter(s => new Date(s.paidAt) >= weekStart).reduce((sum,s)=>sum+(s.total||0),0);

  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);

  const finishedTrips = (state.trips||[]).filter(t => t.finished).sort((a,b) => new Date(b.finishedAt) - new Date(a.finishedAt));

  panel.innerHTML = `
    <h2>Revenue Reports</h2>
    <p class="sub">Owner-only view. Revenue reflects collected (paid) payments only.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
      <div class="stat-card"><div class="slabel">This Week</div><div class="sval">${fmtMoney(revWeek)}</div></div>
      <div class="stat-card"><div class="slabel">Today</div><div class="sval">${fmtMoney(revToday)}</div></div>
      <div class="stat-card"><div class="slabel">Shipments Logged</div><div class="sval">${state.shipments.length}</div></div>
    </div>
    <div class="settings-block">
      <h3>By Destination Island</h3>
      ${islandRows.length === 0 ? '<div class="empty">No invoiced shipments yet.</div>' : `
        <div class="invoice" style="padding:14px 18px;">
          <table>
            <thead><tr><th>Island</th><th class="num">Shipments</th><th class="num">Revenue</th></tr></thead>
            <tbody>
              ${islandRows.map(isl => `<tr><td>${escapeHtml(isl)}</td><td class="num">${byIsland[isl].count}</td><td class="num">${fmtMoney(byIsland[isl].revenue)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
    <div class="settings-block">
      <h3>Trip Reports</h3>
      <p class="sub" style="margin-bottom:12px;">Finished trips. Select one to see delivered/undelivered by destination island.</p>
      <div id="trip-report-list"></div>
    </div>
  `;

  const listEl = panel.querySelector('#trip-report-list');
  if(finishedTrips.length === 0){
    listEl.innerHTML = `<div class="empty">No finished trips yet.</div>`;
    return;
  }
  listEl.innerHTML = finishedTrips.map(t => {
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    const delivered = tripShipments.filter(s => s.status === 'delivered').length;
    const undelivered = tripShipments.length - delivered;
    const unpaid = tripShipments.filter(s => !s.paid).length;
    return `
      <div style="display:flex;gap:8px;align-items:stretch;margin-bottom:8px;">
        <button type="button" class="item-result-row" data-open-trip="${t.id}" style="flex:1;margin-bottom:0;">
          <span>${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} \u00b7 ${fmtDMY(t.date)}</span>
          <span class="rprice">${delivered} delivered \u00b7 ${undelivered} undelivered \u00b7 ${unpaid} unpaid</span>
        </button>
      </div>
    `;
  }).join('');
  listEl.querySelectorAll('[data-open-trip]').forEach(b => b.addEventListener('click', () => {
    state.reportTripView = b.dataset.openTrip;
    state.reportIslandView = null;
    renderReports();
  }));
}

function renderReportTripIslands(){
  const panel = document.getElementById('panel');
  const t = (state.trips||[]).find(x => x.id === state.reportTripView);
  if(!t){ state.reportTripView = null; renderReports(); return; }
  const tripShipments = state.shipments.filter(s => s.tripId === t.id);

  panel.innerHTML = `
    <button class="btn btn-ghost" id="back-to-reports-btn" style="margin-bottom:14px;">\u2190 Back to Reports</button>
    <h2>${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</h2>
    <p class="sub">${fmtDMY(t.date)} \u00b7 Finished ${t.finishedAt ? fmtDate(t.finishedAt) : ''}</p>
    <div id="island-list"></div>
  `;
  document.getElementById('back-to-reports-btn').addEventListener('click', () => { state.reportTripView = null; renderReports(); });

  const islands = (t.destinations && t.destinations.length) ? t.destinations : [...new Set(tripShipments.map(s => s.island))];
  const listEl = document.getElementById('island-list');
  if(islands.length === 0){ listEl.innerHTML = `<div class="empty">No destination islands on this trip.</div>`; return; }

  listEl.innerHTML = islands.map(isl => {
    const forIsland = tripShipments.filter(s => s.island === isl);
    const delivered = forIsland.filter(s => s.status === 'delivered').length;
    const undelivered = forIsland.length - delivered;
    const unpaid = forIsland.filter(s => !s.paid).length;
    return `
      <button type="button" class="item-result-row" data-open-island="${escapeHtml(isl)}" style="margin-bottom:8px;">
        <span>${escapeHtml(isl)}</span>
        <span class="rprice">${delivered} delivered \u00b7 ${undelivered} undelivered \u00b7 ${unpaid} unpaid</span>
      </button>
    `;
  }).join('');
  listEl.querySelectorAll('[data-open-island]').forEach(b => b.addEventListener('click', () => {
    state.reportIslandView = b.dataset.openIsland;
    renderReports();
  }));
}

function renderReportIslandDetail(){
  const panel = document.getElementById('panel');
  const t = (state.trips||[]).find(x => x.id === state.reportTripView);
  if(!t){ state.reportTripView = null; state.reportIslandView = null; renderReports(); return; }
  const island = state.reportIslandView;
  const shipments = state.shipments.filter(s => s.tripId === t.id && s.island === island);
  const delivered = shipments.filter(s => s.status === 'delivered');
  const undelivered = shipments.filter(s => s.status !== 'delivered');

  const daysSinceFinished = t.finishedAt ? (Date.now() - new Date(t.finishedAt).getTime()) / 86400000 : 0;
  const archiveEligible = daysSinceFinished >= 3;
  const toArchive = undelivered.filter(s => s.photo && !s.imageArchived);

  const renderUndeliveredRow = (s) => `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${STATUS_LABELS[s.status]}</span>
      </div>
      <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span><br>${telLink(s.mobile)}</div>
      ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span><br>${telLink(s.receiverMobile)}</div>` : ''}
      ${s.items && s.items.length ? `<div class="tag-items">Items: ${s.items.map(i=>`${i.qty}\u00d7 ${escapeHtml(i.name)}`).join(', ')}</div>` : ''}
      ${photoLinkHtml(s)}
      ${s.imageArchived ? `<div class="note" style="margin-top:8px;">Image downloaded to owner's phone.</div>` : ''}
    </div>
  `;

  const renderDeliveredRow = (s) => `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${STATUS_LABELS[s.status]}</span>
      </div>
      <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span></div>
      ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span></div>` : ''}
      ${s.items && s.items.length ? `<div class="tag-items">Items: ${s.items.map(i=>`${i.qty}\u00d7 ${escapeHtml(i.name)}`).join(', ')}</div>` : ''}
    </div>
  `;

  const invoiced = shipments.filter(s => s.invoiceId);
  const paidInvoices = invoiced.filter(s => s.paid);
  const unpaidInvoices = invoiced.filter(s => !s.paid);
  const isOwner = state.role === 'owner' || state.role === 'manager';

  const renderInvoiceRow = (s) => {
    const cash = state.cashDraft[s.id];
    return `
    <div class="tag">
      ${isOwner ? `<button class="corner-delete" data-report-inv-delete="${s.id}" title="Delete">\u00d7</button>` : ''}
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.paid ? 'status-delivered' : 'status-in_transit'}">${s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid'}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      ${isOwner ? `
        <div class="tag-actions">
          <button class="btn btn-ghost" data-report-inv-share="${s.id}">Share</button>
          ${!s.paid && !cash ? `
            <button class="btn btn-primary" data-report-cash-open="${s.id}">Collect \u2014 Cash</button>
            <button class="btn btn-primary" data-report-inv-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
          ` : ''}
          ${s.paid ? `<button class="btn btn-ghost" data-report-inv-unpay="${s.id}">Mark Unpaid</button>` : ''}
        </div>
        ${cash ? renderCashForm(s) : ''}
      ` : ''}
    </div>
  `;
  };

  const open = state.reportSectionsOpen;
  const section = (key, label, count, bodyHtml) => `
    <div class="settings-block" style="padding:0;overflow:hidden;">
      <button type="button" class="report-section-toggle" data-section-toggle="${key}" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:16px;cursor:pointer;text-align:left;">
        <h3 style="margin:0;">${label} (${count})</h3>
        <span style="font-size:14px;color:var(--ink-soft);transform:rotate(${open[key] ? '180deg' : '0deg'});transition:transform .15s;">\u25be</span>
      </button>
      ${open[key] ? `<div style="padding:0 16px 16px;">${bodyHtml}</div>` : ''}
    </div>
  `;

  panel.innerHTML = `
    <button class="btn btn-ghost" id="back-to-islands-btn" style="margin-bottom:14px;">\u2190 Back to Islands</button>
    <h2>${escapeHtml(island)}</h2>
    <p class="sub">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} \u00b7 ${fmtDMY(t.date)}</p>
    ${section('undelivered', 'Undelivered', undelivered.length, `
      ${(archiveEligible && toArchive.length) ? `
        <button class="btn btn-amber" id="archive-photos-btn" style="margin-bottom:14px;">Download &amp; Archive ${toArchive.length} Photo${toArchive.length===1?'':'s'} to This Phone</button>
      ` : ''}
      ${undelivered.length === 0 ? '<div class="empty">Nothing undelivered for this island.</div>' : undelivered.map(renderUndeliveredRow).join('')}
    `)}
    ${section('delivered', 'Delivered', delivered.length, `
      ${delivered.length === 0 ? '<div class="empty">Nothing delivered yet for this island.</div>' : delivered.map(renderDeliveredRow).join('')}
    `)}
    ${section('invoicesUnpaid', 'Invoices \u2014 Unpaid', unpaidInvoices.length, `
      ${!isOwner ? `<p class="sub" style="margin-bottom:12px;">Owner-only.</p>` : ''}
      ${unpaidInvoices.length === 0 ? '<div class="empty">No unpaid invoices for this island.</div>' : unpaidInvoices.map(renderInvoiceRow).join('')}
    `)}
    ${section('invoicesPaid', 'Invoices \u2014 Paid', paidInvoices.length, `
      ${!isOwner ? `<p class="sub" style="margin-bottom:12px;">Owner-only.</p>` : ''}
      ${paidInvoices.length === 0 ? '<div class="empty">No paid invoices for this island.</div>' : paidInvoices.map(renderInvoiceRow).join('')}
    `)}
  `;
  document.getElementById('back-to-islands-btn').addEventListener('click', () => { state.reportIslandView = null; renderReports(); });
  document.querySelectorAll('[data-section-toggle]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.sectionToggle;
    state.reportSectionsOpen[key] = !state.reportSectionsOpen[key];
    renderReportIslandDetail();
  }));

  document.getElementById('archive-photos-btn')?.addEventListener('click', async () => {
    for(const s of toArchive){ downloadPhoto(s); }
    const idsToArchive = new Set(toArchive.map(s => s.id));
    await withFreshShipments(list => {
      list.forEach(s => { if(idsToArchive.has(s.id)){ s.photo = null; s.imageArchived = true; } });
    });
    renderReportIslandDetail();
  });

  if(isOwner){
    panel.querySelectorAll('[data-report-inv-share]').forEach(b => b.addEventListener('click', () => { state.trackQuery = b.dataset.reportInvShare; location.hash = 'track'; }));
    panel.querySelectorAll('[data-report-inv-pay]').forEach(b => b.addEventListener('click', async () => {
      await withFreshShipments(list => {
        const s = list.find(x => x.id === b.dataset.reportInvPay);
        if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
      });
      syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.reportInvPay));
      renderReportIslandDetail();
    }));
    panel.querySelectorAll('[data-report-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
      await withFreshShipments(list => {
        const s = list.find(x => x.id === b.dataset.reportInvUnpay);
        if(s){ s.paid = false; s.paymentMethod = null; s.paidAt = null; }
      });
      syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.reportInvUnpay));
      renderReportIslandDetail();
    }));
    panel.querySelectorAll('[data-report-cash-open]').forEach(b => b.addEventListener('click', () => {
      state.cashDraft[b.dataset.reportCashOpen] = { received: '' };
      renderReportIslandDetail();
    }));
    panel.querySelectorAll('[data-cash-cancel]').forEach(b => b.addEventListener('click', () => {
      delete state.cashDraft[b.dataset.cashCancel];
      renderReportIslandDetail();
    }));
    panel.querySelectorAll('[id^="cash-input-"]').forEach(inp => inp.addEventListener('input', () => {
      const id = inp.id.replace('cash-input-','');
      if(!state.cashDraft[id]) return;
      state.cashDraft[id].received = inp.value;
      const s = state.shipments.find(x => x.id === id);
      const received = parseFloat(inp.value) || 0;
      const balance = received - (s.total || 0);
      const label = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
      const color = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
      const balEl = document.getElementById('cash-balance-'+id);
      if(balEl){ balEl.textContent = `${label}: ${fmtMoney(Math.abs(balance))}`; balEl.style.color = color; }
    }));
    panel.querySelectorAll('[data-cash-confirm]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.cashConfirm;
      const received = parseFloat(state.cashDraft[id].received) || 0;
      await withFreshShipments(list => {
        const s = list.find(x => x.id === id);
        if(s){
          s.paid = true; s.paymentMethod = 'cash'; s.paidAt = new Date().toISOString();
          s.cashReceived = received; s.cashChange = received - (s.total||0);
        }
      });
      delete state.cashDraft[id];
      syncShipmentToSheet(state.shipments.find(x => x.id === id));
      renderReportIslandDetail();
    }));
    panel.querySelectorAll('[data-report-inv-delete]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('Delete this invoice permanently? This cannot be undone.')) return;
      await withFreshShipments(list => {
        const idx = list.findIndex(x => x.id === b.dataset.reportInvDelete);
        if(idx > -1) list.splice(idx, 1);
      });
      renderReportIslandDetail();
    }));
  }
}

// Filenames use both parties' name + mobile, sanitized for the filesystem.
function safeFilenamePart(str){
  return (str||'').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'') || 'unknown';
}
function photoFilename(s){
  const senderPart = `${safeFilenamePart(s.name)}-${safeFilenamePart(s.mobile)}`;
  const receiverPart = `${safeFilenamePart(s.receiverName)}-${safeFilenamePart(s.receiverMobile)}`;
  return `${senderPart}_${receiverPart}.jpg`;
}
// Shows the photo as a tappable filename link rather than an inline image --
// nobody has to scroll past a photo they didn't ask to see; tapping expands
// it right here on the page instead of navigating away to a new tab.
function photoLinkHtml(s){
  if(!s.photo) return '';
  return `
    <details class="items-details" style="margin-top:8px;">
      <summary>\ud83d\udcf7 ${escapeHtml(photoFilename(s))}</summary>
      <div class="items-body">
        <img src="${s.photo}" alt="Loading photo" style="max-width:100%;border-radius:8px;margin-top:8px;display:block;">
      </div>
    </details>
  `;
}
function downloadPhoto(s){
  if(!s.photo) return;
  const a = document.createElement('a');
  a.href = s.photo;
  a.download = photoFilename(s);
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function downloadDataUrl(dataUrl, filename){
  if(!dataUrl) return;
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // iOS Safari often ignores the download attribute for data URLs and just
  // navigates instead -- opening it in a new tab too means there's always a
  // way to save it (long-press -> Save Image) even if the click above does
  // nothing visible.
  window.open(dataUrl, '_blank');
}

// Trip manifest export -- a self-contained HTML report of every cargo item
// on the trip, including each shipment's loading photo (a CSV can't embed
// images meaningfully, so HTML is used instead -- it opens in any browser
// or photo viewer and saves straight to the device). No external service
// involved, whoever marks the trip in transit (owner or manager) gets this
// on their own phone.
function buildTripManifestHTML(trip, shipments){
  const rows = shipments.map(s => {
    const items = (s.items||[]).map(i => `${i.qty}x ${escapeHtml(i.name)}`).join(', ');
    return `
      <tr>
        <td>${escapeHtml(s.id)}</td>
        <td>${escapeHtml(s.name)}<br><span class="muted">${escapeHtml(s.mobile||'')}</span></td>
        <td>${escapeHtml(s.receiverName||'\u2014')}<br><span class="muted">${escapeHtml(s.receiverMobile||'')}</span></td>
        <td>${escapeHtml(s.island||'')}</td>
        <td>${items}</td>
        <td>${fmtMoney(s.total||0)}</td>
        <td>${s.paid ? 'Paid' : 'Unpaid'}</td>
        <td>${s.photo ? `<img src="${s.photo}" alt="Loading photo for ${escapeHtml(s.id)}">` : '<span class="muted">No photo</span>'}</td>
      </tr>
    `;
  }).join('');
  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Trip Manifest</title>
<style>
  body{font-family:-apple-system,Helvetica,Arial,sans-serif;margin:16px;color:#1a2e22;}
  h1{font-size:20px;margin-bottom:2px;}
  p.sub{color:#6b7a70;margin-top:0;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;}
  th{background:#0f3d2e;color:#fff;}
  .muted{color:#888;font-size:12px;}
  img{max-width:140px;max-height:140px;border-radius:6px;display:block;}
</style></head>
<body>
  <h1>${escapeHtml(trip.origin)} \u2192 ${escapeHtml((trip.destinations||[]).join(', '))}</h1>
  <p class="sub">${escapeHtml(fmtDMY(trip.date))} \u00b7 ${shipments.length} shipment(s)</p>
  <table>
    <thead><tr><th>Tracking Code</th><th>Sender</th><th>Receiver</th><th>Island</th><th>Items</th><th>Total</th><th>Payment</th><th>Photo</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
</body></html>`;
}
function downloadTripManifest(trip, shipments){
  if(!shipments.length) return;
  const html = buildTripManifestHTML(trip, shipments);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const rawName = `${trip.origin}-to-${(trip.destinations||[]).join('-')}-${trip.date}-manifest.html`;
  const filename = rawName.replace(/[^a-zA-Z0-9.\-]+/g, '_');
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ---------------- Settings (owner only) ---------------- */
const SETTINGS_SUBTABS = [
  {id:'owner', label:'Owner Settings'},
  {id:'staff', label:'Staff Management'},
  {id:'trip', label:'Trip Settings'},
  {id:'rates', label:'Rates & Setup'},
  {id:'customers', label:'Customers'},
];
// Managers get full run of the boat except account details (Owner Settings
// -- payment info, links), the item list (Rates & Setup), and the customer
// directory, which stays owner-only.
const MANAGER_SETTINGS_SUBTABS = ['staff', 'trip'];

function renderSettings(){
  const panel = document.getElementById('panel');
  const isManager = state.role === 'manager';
  const visibleSubtabs = isManager ? SETTINGS_SUBTABS.filter(t => MANAGER_SETTINGS_SUBTABS.includes(t.id)) : SETTINGS_SUBTABS;
  if(!visibleSubtabs.some(t => t.id === state.settingsTab)) state.settingsTab = visibleSubtabs[0].id;
  const subtabs = visibleSubtabs.map(t =>
    `<button class="${t.id===state.settingsTab?'active':''}" data-subtab="${t.id}">${t.label}</button>`
  ).join('');
  panel.innerHTML = `
    <h2>Settings</h2>
    <p class="sub">${isManager ? 'Manager access. Staff and trip settings for this boat.' : 'Owner-only. Manage staff access, item prices, and app links.'}</p>
    <div class="sub-tabs">${subtabs}</div>
    <div id="settings-body"></div>
  `;
  panel.querySelectorAll('[data-subtab]').forEach(b => b.addEventListener('click', () => {
    state.settingsTab = b.dataset.subtab;
    renderSettings();
  }));

  if(state.settingsTab === 'owner' && !isManager) renderOwnerSettings();
  else if(state.settingsTab === 'staff') renderStaffManagement();
  else if(state.settingsTab === 'trip') renderTripSettings();
  else if(state.settingsTab === 'customers' && !isManager) renderCustomerDirectory();
  else if(!isManager) renderRatesSetup();
}

function staffShareMessage(name, pin, staffUrl, username){
  return `Hi ${name}, here's your GreenLine Cargo staff sign-in.${username ? `\nUsername: ${username}` : ''}\nPIN: ${pin}\nSign in here: ${staffUrl}`;
}

function openStaffSharePanel(name, pin, staffUrl, username){
  const msg = staffShareMessage(name, pin, staffUrl, username);
  const encoded = encodeURIComponent(msg);
  const wrap = document.createElement('div');
  wrap.style.position = 'fixed';
  wrap.style.inset = '0';
  wrap.style.background = 'rgba(0,0,0,0.45)';
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.justifyContent = 'center';
  wrap.style.zIndex = '9999';
  wrap.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:18px;max-width:320px;width:90%;">
      <h3 style="margin-bottom:8px;">Share PIN with ${escapeHtml(name)}</h3>
      <p class="sub" style="margin-bottom:14px;">Choose how to send the sign-in PIN and staff link.</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" id="share-whatsapp-btn" style="background:#25D366;border-color:#25D366;">Share via WhatsApp</button>
        <button class="btn btn-primary" id="share-viber-btn" style="background:#7360F2;border-color:#7360F2;">Share via Viber</button>
        <button class="btn btn-ghost" id="share-close-btn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('share-whatsapp-btn').addEventListener('click', () => {
    window.open(`https://wa.me/?text=${encoded}`, '_blank');
    wrap.remove();
  });
  document.getElementById('share-viber-btn').addEventListener('click', () => {
    window.open(`viber://forward?text=${encoded}`, '_blank');
    wrap.remove();
  });
  document.getElementById('share-close-btn').addEventListener('click', () => wrap.remove());
  wrap.addEventListener('click', (e) => { if(e.target === wrap) wrap.remove(); });
}

function renderStaffManagement(){
  const body = document.getElementById('settings-body');
  const staffUrl = baseUrl() + '#' + INTERNAL_HASH + '/' + CURRENT_BOAT_ID;
  const managerUrl = baseUrl() + '#' + MANAGER_HASH + '/' + CURRENT_BOAT_ID;
  const isManager = state.role === 'manager';

  body.innerHTML = `
    <div class="settings-block">
      <h3>Pending Access Requests</h3>
      <p class="sub" style="margin-bottom:14px;">Anyone with the staff link can request access on their own. They can't sign in until you approve them here and share the generated PIN.</p>
      <div id="pending-list"></div>
    </div>

    <div class="settings-block">
      <h3>Staff Management</h3>
      <p class="sub" style="margin-bottom:14px;">You can also add a staff member directly here without waiting for a request. No email is actually sent \u2014 a sign-in PIN is generated instantly for you to share with them.</p>
      <div id="staff-list"></div>
      <button class="btn btn-primary" id="open-invite-btn" style="margin-top:10px;">+ Invite Staff Member</button>
      <div id="invite-modal-wrap"></div>
    </div>

    <div class="settings-block">
      <h3>Staff Links</h3>
      <div class="url-box"><div><div class="tag-label">Staff sign-in / request-access link</div><div class="u">${escapeHtml(staffUrl)}</div></div></div>
      <div class="url-box"><div><div class="tag-label">Staff \u2014 for Add to Home Screen</div><div class="u">${escapeHtml(baseUrl() + 'staff/')}</div></div></div>
      <div class="note">Share the sign-in link with staff. Use the "Add to Home Screen" link specifically when saving an icon on a phone \u2014 iOS doesn't reliably remember the # link for that.</div>
    </div>

    ${!isManager ? `
    <div class="settings-block">
      <h3>Manager Access</h3>
      <p class="sub" style="margin-bottom:14px;">Give someone full run of this boat \u2014 Dashboard, Trips, Invoices, Reports, and Settings (Staff &amp; Trip Settings only) \u2014 without letting them see or edit your account details or item prices. Only you can add or remove managers.</p>
      <div id="manager-list"></div>
      <button class="btn btn-primary" id="open-manager-invite-btn" style="margin-top:10px;">+ Manager</button>
      <div id="manager-invite-modal-wrap"></div>
    </div>

    <div class="settings-block">
      <h3>Manager Links</h3>
      <div class="url-box"><div><div class="tag-label">Manager sign-in link</div><div class="u">${escapeHtml(managerUrl)}</div></div></div>
      <div class="note">Share this only with people you've personally added as a manager below \u2014 it's not a self-request link.</div>
    </div>
    ` : ''}
  `;

  const renderPendingList = () => {
    const list = state.settings.pendingStaff || [];
    const el = document.getElementById('pending-list');
    if(!list.length){ el.innerHTML = `<div class="staff-empty">No pending requests.</div>`; return; }
    el.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${list.map((r,idx) => `
          <div class="staff-row" style="flex-wrap:wrap;">
            <span class="sname">${escapeHtml(r.name)}</span>
            <span class="tag-meta" style="flex:1;min-width:140px;">${escapeHtml(r.email)}${r.mobile ? ' \u00b7 '+telLink(r.mobile) : ''}</span>
            <button class="btn btn-primary" data-approve="${idx}" style="padding:8px 12px;">Approve</button>
            <button class="btn btn-danger" data-decline="${idx}" style="padding:8px 12px;">Decline</button>
          </div>
        `).join('')}
      </div>
    `;
    el.querySelectorAll('[data-decline]').forEach(b => b.addEventListener('click', async () => {
      const idx = parseInt(b.dataset.decline,10);
      b.disabled = true;
      await withFreshSettings(fresh => {
        const list = fresh.pendingStaff || [];
        const target = (state.settings.pendingStaff||[])[idx];
        if(target){ const pos = list.findIndex(r => r.id === target.id); if(pos>-1) list.splice(pos,1); }
      });
      renderPendingList();
    }));
    el.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
      const idx = parseInt(b.dataset.approve,10);
      b.disabled = true;
      let newPin = '';
      let approvedName = '';
      let newUsername = '';
      await withFreshSettings(async fresh => {
        const pending = fresh.pendingStaff || [];
        const target = (state.settings.pendingStaff||[])[idx];
        if(!target) return;
        const pos = pending.findIndex(r => r.id === target.id);
        if(pos > -1) pending.splice(pos,1);
        const users = fresh.staffUsers || (fresh.staffUsers = []);
        const usedPins = new Set(users.map(u => u.pin).concat([fresh.ownerPin]));
        do { newPin = String(Math.floor(1000 + Math.random()*9000)); } while(usedPins.has(newPin));
        newUsername = await generateStaffUsername(target.name, users.map(u => u.username).filter(Boolean));
        users.push({id:'staff-'+Date.now(), name:target.name, email:target.email, mobile:target.mobile, pin:newPin, username:newUsername, status:'approved'});
        approvedName = target.name;
      });
      renderPendingList();
      renderStaffList();
      if(newPin) openStaffSharePanel(approvedName, newPin, staffUrl, newUsername);
    }));
  };
  renderPendingList();

async function loadGoogleSheetsStatus(){
  const el = document.getElementById('google-sheets-status');
  if(!el) return;
  try{
    const res = await fetch(`${API_BASE}/api/google/status?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
    const data = await res.json().catch(() => ({}));
    if(!document.getElementById('google-sheets-status')) return; // navigated away
    if(!data.configured){
      el.innerHTML = `<div class="empty">This feature isn't set up on the server yet. Ask your developer to add Google API credentials.</div>`;
      return;
    }
    if(data.connected){
      el.innerHTML = `
        <div class="view-field"><span class="vf-value" style="font-family:'Inter',sans-serif;">${escapeHtml(data.email)}</span></div>
        <button class="btn btn-ghost" id="google-disconnect-btn" style="width:100%;margin-top:8px;">Disconnect Google Account</button>
      `;
      document.getElementById('google-disconnect-btn').addEventListener('click', () => {
        if(!confirm('Disconnect this Google account? New trips will stop getting sheets until you reconnect.')) return;
        fetch(`${API_BASE}/api/google/disconnect`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ boatId: CURRENT_BOAT_ID })
        }).then(() => loadGoogleSheetsStatus());
      });
    } else {
      el.innerHTML = `<button class="btn btn-primary" id="google-connect-btn" style="width:100%;">Connect Google Account</button>`;
      document.getElementById('google-connect-btn').addEventListener('click', async () => {
        const r = await fetch(`${API_BASE}/api/google/auth-url?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
        const d = await r.json().catch(() => ({}));
        if(d.url) location.href = d.url;
        else alert('Could not start Google connection. Try again.');
      });
    }
  }catch(e){
    console.error('loadGoogleSheetsStatus failed', e);
    if(el) el.innerHTML = `<div class="empty">Could not check Google connection status.</div>`;
  }
}

// Customers aren't a separate saved list -- they're derived live from every
// shipment ever logged for this boat, deduplicated by mobile number (the
// true unique identifier, since two different senders can share a name).
// This keeps the directory always in sync with real activity with no extra
// data entry or storage needed.
function renderCustomerDirectory(){
  const body = document.getElementById('settings-body');
  const routes = state.settings.routes || [];
  const routeIslands = new Set();
  routes.forEach(r => (r.destinations||[]).forEach(d => routeIslands.add(d)));
  (state.shipments||[]).forEach(s => { if(s.island) routeIslands.add(s.island); });
  const islands = Array.from(routeIslands).sort();
  const selectedIsland = state.customerDirectoryIsland || '';

  const byMobile = new Map();
  (state.shipments||[]).forEach(s => {
    if(selectedIsland && s.island !== selectedIsland) return;
    if(s.mobile && s.name){
      const key = s.mobile;
      if(!byMobile.has(key)) byMobile.set(key, { name: s.name, mobile: s.mobile, islands: new Set() });
      if(s.island) byMobile.get(key).islands.add(s.island);
    }
  });
  const customers = Array.from(byMobile.values()).sort((a,b) => a.name.localeCompare(b.name));

  body.innerHTML = `
    <div class="settings-block">
      <h3>Customer Check-In Link</h3>
      <div class="url-box"><div><div class="tag-label">Put this on your QR code / share with customers</div><div class="u">${escapeHtml(baseUrl() + '#c/' + CURRENT_BOAT_ID)}</div></div></div>
      <div class="note">This is what your senders and receivers use to check in cargo and track shipments for THIS boat specifically.</div>
    </div>

    <div class="settings-block">
      <h3>Customers</h3>
      <p class="sub" style="margin-bottom:12px;">Everyone who has sent cargo on this boat, one entry per mobile number (in case two senders share a name).</p>
      <label>Filter by island</label>
      <select id="customer-island-filter">
        <option value="">All islands</option>
        ${islands.map(isl => `<option value="${escapeHtml(isl)}" ${selectedIsland===isl?'selected':''}>${escapeHtml(isl)}</option>`).join('')}
      </select>
      <div style="margin-top:14px;">
        ${customers.length === 0 ? '<div class="empty">No customers yet.</div>' : customers.map(c => `
          <div class="item-result-row" style="margin-bottom:6px;">
            <span>${escapeHtml(c.name)} \u2014 ${escapeHtml(c.mobile)}</span>
            <span class="rprice">${escapeHtml(Array.from(c.islands).join(', '))}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('customer-island-filter').addEventListener('change', (e) => {
    state.customerDirectoryIsland = e.target.value;
    renderCustomerDirectory();
  });
}

/* ---------------- Main render dispatch ---------------- */
let lastRenderedTab = null;
function render(){
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    renderGate();
    return;
  }
  document.getElementById('gate-area').innerHTML = '';
  document.getElementById('gate-area').style.display = 'none';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('panel').style.display = 'block';

  if(state.entryMode === 'customer'){ renderModeToggle(); }
  else { document.getElementById('mode-toggle').style.display = 'none'; }

  renderTabs();

  const allowed = ROLE_TABS[state.role].map(t => t.id);
  if(!allowed.includes(state.tab)) state.tab = DEFAULT_TAB[state.role];
  if(state.tab !== 'reports'){ state.reportTripView = null; state.reportIslandView = null; }

  // Every time the Dashboard is freshly opened (not on every re-render
  // while already there, e.g. from polling) it lands on whichever island
  // the boat has actually arrived at, per the Trips tab's "Boat arrived
  // at" selection -- staff don't have to re-tap the island chip each time
  // they switch back in.
  if(state.tab === 'dashboard' && lastRenderedTab !== 'dashboard'){
    const arrived = activeTripArrivedIsland();
    if(arrived) state.dashIslandView = arrived;
  }
  lastRenderedTab = state.tab;

  if(state.tab !== 'dashboard'){
    document.getElementById('load-modal-overlay')?.remove();
    document.getElementById('invoice-popup-overlay')?.remove();
  }

  if(state.tab === 'dashboard'){ renderDashboard(); wireLoadFormEvents(); }
  else if(state.tab === 'checkin'){ renderCheckin(); }
  else if(state.tab === 'track'){ renderTrack(); }
  else if(state.tab === 'reports'){ renderReports(); }
  else if(state.tab === 'invoices'){ renderInvoices(); }
  else if(state.tab === 'trips'){ renderTrips(); }
  else if(state.tab === 'settings'){ renderSettings(); }
}

  const scrollY = window.scrollY;
  _origRenderDashboard();
  wireLoadFormEvents();
  window.scrollTo(0, scrollY);
};

function openQrScanner(){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column;';
  overlay.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
      <span style="color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;">Scan Boat QR Code</span>
      <button id="qr-scan-close" style="background:none;border:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;">\u00d7</button>
    </div>
    <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <video id="qr-scan-video" autoplay playsinline muted style="max-width:100%;max-height:100%;"></video>
      <div style="position:absolute;width:70%;aspect-ratio:1;border:2px solid var(--teal-light);border-radius:12px;pointer-events:none;"></div>
    </div>
    <div id="qr-scan-status" style="color:rgba(255,255,255,0.75);text-align:center;padding:14px;font-size:13.5px;">Point your camera at the boat's QR code.</div>
  `;
  document.body.appendChild(overlay);

  const video = overlay.querySelector('#qr-scan-video');
  const statusEl = overlay.querySelector('#qr-scan-status');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let stream = null;
  let stopped = false;

  const cleanup = () => {
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    overlay.remove();
  };
  overlay.querySelector('#qr-scan-close').addEventListener('click', cleanup);

  const tick = () => {
    if(stopped) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = typeof jsQR === 'function' ? jsQR(imageData.data, imageData.width, imageData.height) : null;
      if(code && code.data){
        statusEl.textContent = 'Got it \u2014 opening...';
        try{
          const url = new URL(code.data, location.href);
          if(url.origin === location.origin){
            cleanup();
            location.hash = url.hash.replace('#','');
            return;
          }
        }catch(e){ /* not a valid URL, fall through */ }
        statusEl.textContent = "That doesn't look like a Ferry Cargo Log QR code. Try again.";
      }
    }
    requestAnimationFrame(tick);
  };

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(s => {
      stream = s;
      video.srcObject = s;
      requestAnimationFrame(tick);
    })
    .catch(() => {
      statusEl.textContent = "Couldn't access the camera. Check your browser's camera permission for this site.";
    });
}

async function adminFetch(path, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const creds = { username: state.adminUsername, passkey: state.adminPasskey };
  let url = `${API_BASE}${path}`;
  let body;
  if(method === 'GET'){
    url += (path.includes('?') ? '&' : '?') + `username=${encodeURIComponent(creds.username)}&passkey=${encodeURIComponent(creds.passkey)}`;
  } else {
    body = JSON.stringify(Object.assign({}, opts.body || {}, creds));
  }
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body });
  const data = await res.json().catch(() => ({}));
  if(res.status === 401){ state.adminAuthed = false; clearAdminSession(); state.adminError = 'Session expired. Log in again.'; renderAdmin(); throw new Error('unauthorized'); }
  return data;
}

function confirmAdminAction(label, onConfirm, withNote){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `

      <h3 style="margin-bottom:6px;">Confirm: ${escapeHtml(label)}</h3>
      ${withNote ? `
        <label>Reason (shown to the organization)</label>
        <textarea id="admin-confirm-note" rows="2" placeholder="e.g. Overdue payment for additional boat">${escapeHtml(DEFAULT_SUSPEND_NOTE)}</textarea>
      ` : ''}
      <p class="sub" style="margin-bottom:12px;">Re-enter your Super Admin password to continue.</p>
      <input type="password" id="admin-confirm-password" placeholder="Password">
      <div class="pin-error" id="admin-confirm-error"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-ghost" id="admin-confirm-cancel" style="flex:1;">Cancel</button>
        <button class="btn btn-danger" id="admin-confirm-go" style="flex:1;">Confirm</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  if(withNote){
    const noteEl = document.getElementById('admin-confirm-note');
    noteEl.addEventListener('focus', () => {
      if(noteEl.value === DEFAULT_SUSPEND_NOTE) noteEl.value = '';
    }, { once: true });
  }
  const input = document.getElementById('admin-confirm-password');
  input.focus();
  const close = () => overlay.remove();
  document.getElementById('admin-confirm-cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
  const go = async () => {
    const errorEl = document.getElementById('admin-confirm-error');
    if(input.value !== state.adminPasskey){
      errorEl.textContent = 'Incorrect password.';
      return;
    }
    const btn = document.getElementById('admin-confirm-go');
    btn.disabled = true; btn.textContent = 'Working\u2026';
    const note = withNote ? document.getElementById('admin-confirm-note').value.trim() : undefined;
    try{
      await onConfirm(note);
      close();
    }catch(e){
      errorEl.textContent = 'Something went wrong. Try again.';
      btn.disabled = false; btn.textContent = 'Confirm';
    }
  };
  document.getElementById('admin-confirm-go').addEventListener('click', go);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}

    (async () => {
      if(state.adminRequests === null) await loadAdminRequests();
      if(!document.getElementById('admin-body')) return;
      const reqs = state.adminRequests || [];
      body.innerHTML = reqs.length === 0 ? `<div class="empty">No boat requests yet.</div>` : reqs.map(r => `
        <div class="settings-block">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3 style="margin-bottom:4px;">${escapeHtml(r.requested_boat_name)}</h3>
              <p class="sub" style="margin-bottom:8px;">For ${escapeHtml(r.owner_name)} (${escapeHtml(r.org_boat_name)}) \u00b7 ${fmtDate(r.created_at)}</p>
            </div>
            <span class="status-pill ${r.status==='approved'?'status-delivered':r.status==='rejected'?'status-in_transit':''}">${escapeHtml(r.status)}</span>
          </div>
          ${r.payment_screenshot ? `<img src="${r.payment_screenshot}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;">` : `<p class="sub" style="margin-bottom:10px;">No payment screenshot attached.</p>`}
          ${r.status === 'pending' ? `
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" data-approve="${r.id}" ${state.adminBusyId===r.id?'disabled':''} style="flex:1;">Approve</button>
              <button class="btn btn-danger" data-reject="${r.id}" ${state.adminBusyId===r.id?'disabled':''} style="flex:1;">Reject</button>
            </div>
          ` : r.admin_note ? `<p class="sub">Note: ${escapeHtml(r.admin_note)}</p>` : ''}
        </div>
      `).join('');
      body.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
        const id = b.dataset.approve;
        const reqRow = (state.adminRequests||[]).find(r => r.id === id);
        if(reqRow && reqRow.payment_screenshot){
          const proceed = confirm('Approving will download the payment screenshot to this device, then permanently delete it from the database. Continue?');
          if(!proceed) return;
        }
        state.adminBusyId = id; renderAdminDashboard();
        try{
          const data = await adminFetch(`/api/admin/boat-requests/${id}/approve`, { method:'POST' });
          if(data && data.paymentScreenshot){
            downloadDataUrl(data.paymentScreenshot, `payment-slip-${(data.requestedBoatName||'boat').replace(/[^a-z0-9]+/gi,'-')}.jpg`);
          }
        }
        catch(e){ console.error(e); }
        state.adminBusyId = null; state.adminRequests = null; state.adminOrgs = null;
        renderAdminDashboard();
      }));
      body.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
        const note = prompt('Reason for rejecting (optional):') || '';
        state.adminBusyId = b.dataset.reject; renderAdminDashboard();
        try{ await adminFetch(`/api/admin/boat-requests/${b.dataset.reject}/reject`, { method:'POST', body:{ note } }); }
        catch(e){ console.error(e); }
        state.adminBusyId = null; state.adminRequests = null;
        renderAdminDashboard();
      }));
    })();
  }
}

const SIGNUP_FIELD_IDS = ['su-boat-name','su-owner-name','su-contact','su-mobile','su-gmail','su-bank-name','su-bank-number','su-routes','su-tracking','su-viber','su-social','su-passkey'];
function clearFieldErrors(ids){ ids.forEach(id => document.getElementById(id)?.classList.remove('field-error')); }
function markFieldError(id, clearValue){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('field-error');
  if(clearValue) el.value = '';
}

async function submitSignup(){
  const val = (id) => (document.getElementById(id).value || '').trim();
  const errorEl = document.getElementById('su-error');
  const btn = document.getElementById('su-submit-btn');
  clearFieldErrors(SIGNUP_FIELD_IDS);

  const body = {
    boatName: val('su-boat-name'),
    ownerName: val('su-owner-name'),
    contactNumber: val('su-contact'),
    mobile: val('su-mobile'),
    gmail: val('su-gmail'),
    bankAccountName: val('su-bank-name'),
    bankAccountNumber: val('su-bank-number'),
    routes: val('su-routes').split('\n').map(s=>s.trim()).filter(Boolean),
    trackingLink: val('su-tracking'),
    viberLink: val('su-viber'),
    socialLinks: val('su-social').split('\n').map(s=>s.trim()).filter(Boolean),
    passkey: val('su-passkey'),
  };

  const requiredMap = { boatName:'su-boat-name', ownerName:'su-owner-name', contactNumber:'su-contact', mobile:'su-mobile', passkey:'su-passkey' };
  const missing = Object.keys(requiredMap).filter(k => !body[k]);
  if(missing.length){
    missing.forEach(k => markFieldError(requiredMap[k], false));
    errorEl.textContent = 'Please fill in all fields marked *.';
    return;
  }
  if(body.passkey.length < 6){
    markFieldError('su-passkey', true);
    errorEl.textContent = 'PIN must be at least 6 characters.';
    return;
  }

  errorEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Creating\u2026';
  try{
    const res = await fetch(`${API_BASE}/api/signup`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    btn.disabled = false; btn.textContent = 'Create My Boat';
    if(res.ok && data.ok){
      state.orgSignupTotpSecret = data.totpSecret;
      state.orgAuthed = true;
      state.orgPasskey = body.passkey;
      state.orgData = {
        id: data.organizationId, boatName: body.boatName, ownerName: body.ownerName,
        contactNumber: body.contactNumber, gmail: body.gmail, mobile: body.mobile,
        bankAccountName: body.bankAccountName, bankAccountNumber: body.bankAccountNumber,
        trackingLink: body.trackingLink, viberLink: body.viberLink,
        socialLinks: body.socialLinks, routes: body.routes,
      };
      state.orgBoats = [{ id: data.boatId, name: body.boatName, is_primary: true, status: 'active' }];
      renderOrgArea();
    } else {
      const msg = (data && data.error) || 'Could not create your account.';
      errorEl.textContent = msg;
      if(/boat name/i.test(msg)) markFieldError('su-boat-name', true);
    }
  }catch(e){
    console.error('signup failed', e);
    btn.disabled = false; btn.textContent = 'Create My Boat';
    errorEl.textContent = 'Something went wrong. Try again.';
  }
}
