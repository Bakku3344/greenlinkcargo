<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferry Cargo Log</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy-deep:#0B3D2E;
    --navy-mid:#14503D;
    --teal:#29AB87;
    --teal-light:#3FC79A;
    --amber:#D98E04;
    --paper:#F6F1E7;
    --paper-dark:#EAE2D0;
    --ink:#1C1A17;
    --ink-soft:#5B5548;
    --red:#B23A2F;
    --green:#2F7A4F;
    --line:#D8CFB8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(255,255,255,0.04), transparent 40%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  .shell{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
  header.app-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 4px 22px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:6px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .brand-mark svg{width:22px;height:22px;stroke:var(--navy-deep);}
  .brand h1{font-size:20px;color:#F6F1E7;margin:0;font-weight:600;letter-spacing:0.06em;}
  .brand span{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#9FB3C8;letter-spacing:0.14em;text-transform:uppercase;margin-top:2px;}

  .role-pill{
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);
    padding:6px 6px 6px 14px;border-radius:24px;
  }
  .role-pill .rlabel{font-family:'JetBrains Mono',monospace;font-size:11px;color:#C7D3E0;letter-spacing:0.06em;text-transform:uppercase;}
  .role-pill button{
    background:var(--amber);color:var(--navy-deep);border:none;border-radius:18px;
    padding:6px 12px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.04em;
    text-transform:uppercase;cursor:pointer;font-weight:600;
  }

  .mode-toggle{
    display:flex;gap:6px;background:rgba(255,255,255,0.06);
    padding:5px;border-radius:10px;margin-bottom:12px;
  }
  .mode-toggle button{
    flex:1;background:transparent;border:none;color:#C7D3E0;
    font-family:'Oswald',sans-serif;letter-spacing:0.05em;text-transform:uppercase;
    font-size:13px;padding:12px 8px;border-radius:7px;cursor:pointer;font-weight:500;
  }
  .mode-toggle button.active{background:var(--amber);color:var(--navy-deep);font-weight:700;}
  .mode-toggle button:not(.active):hover{background:rgba(255,255,255,0.08);color:#fff;}

  nav.tabs{
    display:flex;gap:6px;background:rgba(255,255,255,0.06);
    padding:5px;border-radius:10px;margin-bottom:22px;flex-wrap:wrap;
  }
  nav.tabs button{
    flex:1;min-width:110px;
    background:transparent;border:none;color:#C7D3E0;
    font-family:'Oswald',sans-serif;letter-spacing:0.05em;text-transform:uppercase;
    font-size:12.5px;padding:10px 8px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background 0.15s, color 0.15s;
  }
  nav.tabs button.active{background:var(--amber);color:var(--navy-deep);font-weight:600;}
  nav.tabs button:not(.active):hover{background:rgba(255,255,255,0.08);color:#fff;}
  .badge{
    background:var(--red);color:#fff;font-size:10px;font-family:'JetBrains Mono',monospace;
    padding:1px 6px;border-radius:20px;min-width:16px;text-align:center;
  }
  nav.tabs button.active .badge{background:var(--navy-deep);color:var(--amber);}

  .panel{
    background:var(--paper);border-radius:12px;padding:26px;
    box-shadow:0 12px 34px rgba(0,0,0,0.28);
  }
  .panel h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:22px;margin:0 0 4px;color:var(--navy-deep);}
  .panel .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}

  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:5px;}
  input[type=text],input[type=tel],input[type=password],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:7px;
    font-family:'Inter',sans-serif;font-size:14.5px;background:#fff;color:var(--ink);
    margin-bottom:16px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:12px 20px;border-radius:8px;border:none;cursor:pointer;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:14px;font-weight:500;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-light);}
  .btn-amber{background:var(--amber);color:var(--navy-deep);}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--navy-deep);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy-deep);}
  .btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .tag{
    position:relative;background:#fff;border-radius:10px;border:1.5px dashed var(--line);
    padding:18px 18px 16px 26px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;
  }
  .tag::before{
    content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;border-radius:50%;background:var(--navy-deep);border:3px solid var(--paper);
  }
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .tag-code{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--navy-deep);letter-spacing:0.02em;}
  .tag-meta{font-size:13px;color:var(--ink-soft);}
  .status-pill{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;font-weight:700;white-space:nowrap;
  }
  .status-pending{background:#FBE7C6;color:#8A5A00;}
  .status-loaded{background:#D9F0E6;color:#1E7A5F;}
  .status-in_transit{background:#DCE4F5;color:#2C4A8C;}
  .status-delivered{background:#DCEBDD;color:#2F7A4F;}
  .tag-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .tag-items{font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;}
  .party-block{margin-bottom:4px;}
  .party-name{font-weight:700;font-size:14.5px;color:var(--navy-deep);}
  .party-role{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:700;margin-right:6px;}
  .party-phone{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal);text-decoration:none;}
  .party-phone:active{opacity:0.7;}
  .items-details{margin-top:4px;border-top:1px dashed var(--line);padding-top:8px;}
  .items-details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--teal);list-style:none;}
  .items-details summary::-webkit-details-marker{display:none;}
  .items-details summary::before{content:'\25B8 ';}
  .items-details[open] summary::before{content:'\25BE ';}
  .items-details .items-body{margin-top:8px;font-size:13px;color:var(--ink-soft);}
  .cash-box{border:1.5px solid var(--teal);border-radius:8px;padding:14px;margin-top:10px;background:#fff;}
  .cash-box .balance{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;margin:8px 0;}
  .share-box{border:1.5px solid var(--teal);border-radius:8px;padding:14px;margin-top:10px;background:#fff;display:flex;flex-direction:column;gap:8px;}
  .share-box .btn{width:100%;margin-bottom:8px;}
  .item-results{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
  .item-result-row{
    display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;
    font-size:14px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;
  }
  .item-result-row:active{background:var(--paper-dark);border-color:var(--teal);}
  .item-result-row .rprice{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:12.5px;}

  .rate-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;
  }
  .rate-row .name{font-weight:600;font-size:14px;}
  .rate-row .price{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);background:#fff;
    font-size:16px;cursor:pointer;line-height:1;
  }
  .stepper button:hover{border-color:var(--teal);color:var(--teal);}
  .stepper .qty{width:26px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;}

  .total-line{
    display:flex;justify-content:space-between;align-items:center;
    border-top:2px solid var(--navy-deep);padding-top:12px;margin-top:6px;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:16px;
  }
  .total-line .amt{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--navy-deep);}

  .empty{text-align:center;padding:36px 12px;color:var(--ink-soft);font-size:14px;}

  .qr-wrap{background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;margin-bottom:18px;}
  #qr-canvas{display:inline-block;}

  .confirm-code{text-align:center;padding:24px;background:var(--navy-deep);border-radius:10px;color:#fff;margin-bottom:16px;}
  .confirm-code .big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;letter-spacing:0.05em;color:var(--amber);margin:8px 0;}

  .timeline{display:flex;gap:0;margin:18px 0 4px;}
  .tl-step{flex:1;text-align:center;position:relative;}
  .tl-dot{width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1;}
  .tl-step.done .tl-dot{background:var(--teal);}
  .tl-step::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .tl-step:first-child::after{display:none;}
  .tl-step.done::after{background:var(--teal);}
  .tl-step.trip-ended .tl-dot{background:var(--red);}
  .tl-step.trip-ended::after{background:var(--red);}
  .tl-label{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);font-weight:600;}
  .tl-date{font-size:10.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-top:2px;}

  .invoice{border:1.5px solid var(--navy-deep);border-radius:10px;padding:20px;margin-top:16px;background:#fff;}
  .invoice table{width:100%;border-collapse:collapse;margin:14px 0;}
  .invoice th,.invoice td{text-align:left;padding:7px 4px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .invoice th{text-transform:uppercase;font-size:10.5px;letter-spacing:0.05em;color:var(--ink-soft);}
  .invoice td.num,.invoice th.num{text-align:right;font-family:'JetBrains Mono',monospace;}

  .sub-tabs{
    display:flex;gap:6px;background:var(--paper-dark);
    padding:5px;border-radius:9px;margin-bottom:22px;flex-wrap:wrap;
  }
  .sub-tabs button{
    flex:1;min-width:130px;background:transparent;border:none;color:var(--ink-soft);
    font-family:'Oswald',sans-serif;letter-spacing:0.04em;text-transform:uppercase;
    font-size:12.5px;padding:9px 8px;border-radius:6px;cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .sub-tabs button.active{background:var(--navy-deep);color:var(--paper);font-weight:600;}
  .sub-tabs button:not(.active):hover{background:rgba(0,0,0,0.06);color:var(--navy-deep);}
  .staff-row{
    display:flex;gap:8px;align-items:center;margin-bottom:8px;
    background:var(--paper-dark);border-radius:8px;padding:8px 10px;
  }
  .staff-row .sname{flex:1;font-weight:600;color:var(--navy-deep);}
  .staff-row .spin{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:0.12em;background:var(--paper);padding:4px 10px;border-radius:6px;}
  .staff-empty{font-size:12.5px;color:var(--ink-soft);padding:8px 2px 12px;}
  .settings-block{margin-bottom:26px;}
  .settings-block h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:0.04em;color:var(--navy-deep);margin:0 0 12px;}
  .view-field{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#fff;border:1.5px solid var(--line);border-radius:8px;
    padding:11px 12px;margin-bottom:14px;
  }
  .view-field .vf-value{font-family:'JetBrains Mono',monospace;font-size:14.5px;color:var(--navy-deep);word-break:break-all;}
  .view-field .vf-edit{
    background:transparent;border:1.5px solid var(--line);border-radius:6px;
    padding:5px 10px;font-size:11px;font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:0.04em;color:var(--navy-deep);cursor:pointer;flex-shrink:0;
  }
  .view-field .vf-edit:active{background:var(--paper-dark);}
  .view-field .vf-show{background:none;border:none;color:var(--teal);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;margin-right:8px;padding:0;}
  .corner-delete{
    position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
    background:#fff;border:1.5px solid var(--red);color:var(--red);font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .corner-delete:active{background:var(--red);color:#fff;}
  .rate-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .rate-edit-row input[type=text]{margin-bottom:0;}
  .rate-edit-row input.price-input{width:90px;}
  .search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .search-row input{margin-bottom:0;flex:1;min-width:180px;}
  .filter-chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
    border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .filter-chip.active{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff;}
  .note{font-size:12.5px;color:var(--ink-soft);background:var(--paper-dark);border-radius:7px;padding:10px 12px;margin-top:6px;line-height:1.5;}
  .url-box{
    display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;
    border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;flex-wrap:wrap;
  }
  .url-box .u{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--navy-deep);word-break:break-all;}
  .url-box .tag-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;}

  .gate-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  .gate-card{max-width:420px;width:100%;}
  .gate-title{text-align:center;color:#F6F1E7;margin-bottom:26px;}
  .gate-title h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:24px;margin:0 0 6px;}
  .gate-title p{color:#9FB3C8;font-size:13px;margin:0;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-card{
    background:var(--paper);border-radius:12px;padding:20px 16px;text-align:center;cursor:pointer;
    border:2px solid transparent;transition:border-color .15s, transform .1s;
  }
  .role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .role-card .ricon{
    width:44px;height:44px;border-radius:10px;background:var(--navy-deep);margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
  }
  .role-card .ricon svg{width:22px;height:22px;stroke:var(--amber);}
  .role-card .rname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:14.5px;color:var(--navy-deep);margin-bottom:3px;}
  .role-card .rdesc{font-size:11.5px;color:var(--ink-soft);}
  .pin-box{background:var(--paper);border-radius:12px;padding:26px;max-width:340px;margin:0 auto;text-align:center;}
  .pin-box .rname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:16px;color:var(--navy-deep);margin-bottom:14px;}
  .pin-box input{text-align:center;letter-spacing:0.4em;font-family:'JetBrains Mono',monospace;font-size:20px;}
  .pin-error{color:var(--red);font-size:12.5px;margin:-8px 0 12px;min-height:16px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:16px;}
  .stat-card .slabel{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;}
  .stat-card .sval{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--navy-deep);}

  @media print{
    body *{visibility:hidden;}
    .invoice, .invoice *{visibility:visible;}
    .invoice{position:absolute;top:0;left:0;width:100%;border:none;}
  }
  @media (max-width:560px){
    .brand h1{font-size:16px;}
    nav.tabs button{font-size:11px;min-width:80px;padding:9px 5px;}
    .role-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="app-head">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l1.5-6h15L21 17"/><path d="M5 17v2a1 1 0 001 1h12a1 1 0 001-1v-2"/><path d="M12 3v8"/><path d="M8 6l4-3 4 3"/></svg>
      </div>
      <div>
        <h1>Ferry Cargo Log</h1>
        <span id="clock">--</span>
      </div>
    </div>
    <div class="role-pill" id="role-pill" style="display:none;">
      <span class="rlabel" id="role-label"></span>
      <button id="switch-role-btn">Log out</button>
    </div>
  </header>

  <div class="mode-toggle" id="mode-toggle" style="display:none;"></div>
  <nav class="tabs" id="tabs" style="display:none;"></nav>
  <main class="panel" id="panel" style="display:none;"></main>
  <div id="gate-area"></div>
</div>

<script>
/* ---------------- Storage helpers ---------------- */
const DEFAULT_RATES = [
  {id:'small-box', name:'Small Box', price:50},
  {id:'big-bag', name:'Big Bag', price:120},
  {id:'cement-bag', name:'Cement Bag', price:80},
  {id:'steel-bar', name:'Steel Bar', price:20},
  {id:'item-a4-paper-rim', name:"A4 Paper Rim (box)", price:20},
  {id:'item-aggregate-50kg', name:"Aggregate - 50kg (bag)", price:75},
  {id:'item-air-compressor', name:"Air Compressor (pcs)", price:400},
  {id:'item-air-condition', name:"Air Condition (pcs)", price:200},
  {id:'item-air-condition-1800-btu', name:"Air Condition 1800 BTU (pcs)", price:180},

/* ---------------- API layer (Neon-backed, via your own serverless endpoint) ----------------
   EDIT THIS to your deployed API's base URL, e.g. "https://cargo-api.yourname.workers.dev"
   The API must implement:
     GET  /api/data/:key   -> { value: <any JSON> }   (404 or {value:null} if missing)
     PUT  /api/data/:key   body {value: <any JSON>}   -> upserts the row
   See neon-schema.sql and api-example/server.js for a ready-made reference implementation. */
const API_BASE = 'https://greenlinkcargo-trhl.onrender.com';

async function apiGet(key, fallback){
  try{
    const res = await fetch(`${API_BASE}/api/data/${key}`);
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data && data.value !== undefined && data.value !== null) ? data.value : fallback;
  }catch(e){ console.error('apiGet failed for', key, e); return fallback; }
}
async function apiSet(key, value){
  try{
    await fetch(`${API_BASE}/api/data/${key}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ value })
    });
  }catch(e){ console.error('apiSet failed for', key, e); }
}

function fmtMoney(n){ return '\u0783' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return '\u2014'; const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startOfWeek(){ const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day===0?-6:1); const s = new Date(d.setDate(diff)); s.setHours(0,0,0,0); return s; }
function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d; }

// while on any tab (which changes the URL hash away from #owner/#staff to
// e.g. #dashboard) has no way to know a session was active, and falls back
// to the public customer view. localStorage survives reloads; sessionStorage
// would also work but wouldn't survive closing the tab, which is worse UX
// for something like a staff member's phone left logged in.
const SESSION_KEY = 'cfl_session_v1';
function saveSession(gateRole, role, staffName){

function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);

}

}

// Maldivian mobile numbers are typically stored as 7-digit local numbers.
// wa.me/Viber deep links need a full international number with no leading
// "+" or "0" -- if what's on file already looks international (8+ digits),
// leave it as-is; otherwise assume Maldives (960) and prefix it.
function intlNumber(raw){
  const digits = String(raw||'').replace(/\D/g,'');
  if(!digits) return '';
  return digits.length > 7 ? digits : '960' + digits;
}
function buildInvoiceMessage(s){

    `Status: ${s.paid ? 'Paid' : 'Unpaid'}`,

  return lines.join('\n');
}
// Normalizes a locally-stored mobile number into a full international number
// for wa.me / viber:// links. Assumes Maldives (+960) when the number looks
// like a bare 7-digit local number and has no country code already.
function intlNumber(mobile){
  let digits = (mobile || '').replace(/\D/g, '');
  if(!digits) return '';
  if(digits.length === 7) digits = '960' + digits;
  return digits;
}

async function shareInvoiceImage(s){
  if(typeof html2canvas === 'undefined'){
    alert('Could not load the image generator \u2014 check your connection and try again.');
    return;
  }
  const node = buildInvoiceImageNode(s);
  let canvas;
  try{
    canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff' });
  } catch(e){
    node.remove();
    console.error(e);
    alert('Could not generate the invoice image. Try again.');
    return;
  }
  node.remove();

  canvas.toBlob(async (blob) => {
    if(!blob){ alert('Could not generate the invoice image.'); return; }
    const filename = `invoice-${(s.invoiceId||s.id).replace(/[^a-z0-9-]/gi,'')}.png`;
    const file = new File([blob], filename, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      const bankBits = [state.settings.bankAccountName, state.settings.bankAccountNumber].filter(Boolean);
      const caption = (!s.paid && bankBits.length) ? bankBits.join(' \u00b7 ') : '';
      try{
        await navigator.share(caption ? { files: [file], title: caption } : { files: [file] });
      } catch(e){
        // User cancelled the share sheet -- not an error, do nothing.
      }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      alert('Your browser can\'t open the share sheet directly, so the invoice image downloaded instead \u2014 attach it manually in WhatsApp or Viber.');
    }
  }, 'image/png');
}

function renderGate(){
  document.getElementById('mode-toggle').style.display='none';
  document.getElementById('tabs').style.display='none';
  document.getElementById('panel').style.display='none';
  document.getElementById('role-pill').style.display='none';

  if(state.gateStage === 'pin' && state.pinTargetRole){
    const r = ROLES[state.pinTargetRole];
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="pin-box">
          <div class="rname">${r.name} PIN</div>
          <input type="password" inputmode="numeric" id="pin-input" maxlength="6" placeholder="&bull;&bull;&bull;&bull;">
          <div class="pin-error">${state.pinError}</div>
          <button class="btn btn-primary" id="pin-submit" style="width:100%;margin-bottom:10px;">Enter</button>
          ${state.pinTargetRole === 'owner' ? `<button class="btn btn-ghost" id="forgot-pin-link" style="width:100%;margin-bottom:10px;">Forgot PIN?</button>` : ''}
          <button class="btn btn-ghost" id="pin-back" style="width:100%;">Back</button>
        </div>
      </div>
    `;
    const input = document.getElementById('pin-input');
    input.focus();
    if(state.pinTargetRole === 'owner'){
      document.getElementById('forgot-pin-link').addEventListener('click', () => {
        state.gateStage = 'forgot'; state.forgotError = ''; state.forgotMsg = '';
        renderGate();
      });
    }
    const grant = (staffName) => {
      state.role = state.pinTargetRole;
      state.staffName = staffName || null;
      state.gateStage = 'pick';
      state.pinError = '';
      state.tab = DEFAULT_TAB[state.role];
      saveSession(state.gateRole, state.role, state.staffName);
      location.hash = state.tab;
      render();
    };
    const fail = () => { state.pinError = 'Incorrect PIN. Try again.'; renderGate(); };
    const tryPin = () => {
      const entered = input.value;
      if(state.pinTargetRole === 'staff'){
        const users = state.settings.staffUsers || [];
        const match = users.find(u => u.pin === entered);
        if(match){ grant(match.name); return; }
        // Legacy fallback: single staff PIN, only while no staff accounts exist yet.
        if(users.length === 0 && entered === state.settings.staffPin){ grant(null); return; }
        fail();
        return;
      }
      // Owner (and any other pinField role)
      if(entered === state.settings[r.pinField]){ grant(null); }
      else fail();
    };
    document.getElementById('pin-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
    document.getElementById('pin-back').addEventListener('click', () => {
      if(state.gateRole){ state.gateStage='signin'; } else { state.gateStage='pick'; }
      state.pinError=''; renderGate();
    });
    return;
  }

  if(state.gateStage === 'forgot'){
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="pin-box">
          <div class="rname">Reset Owner PIN</div>
          <p class="note" style="margin-top:0;text-align:left;">Enter the Gmail address registered to the Owner account. If it matches, we'll email a link to set a new PIN.</p>

          <div class="pin-error">${state.forgotError || ''}</div>

        </div>
      </div>
    `;
    const emailInput = document.getElementById('forgot-email-input');
    emailInput.focus();
    document.getElementById('forgot-submit').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        state.forgotError = 'Enter a valid email address.'; renderGate(); return;
      }
      state.forgotError = ''; state.forgotMsg = 'Sending\u2026';
      renderGate();
      try{
        await fetch(`${API_BASE}/api/reset-pin/request`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email })

      }catch(e){ console.error('reset-pin request failed', e); }
      state.forgotMsg = 'If that address is registered to the Owner account, a reset link has been sent. Check your inbox (and spam folder) \u2014 the link expires in 30 minutes.';
      renderGate();
    });

      state.gateStage = 'pin'; state.pinTargetRole = 'owner'; state.forgotMsg = ''; state.forgotError = '';
      renderGate();
    });
    return;
  }

  if(state.gateStage === 'reset-confirm'){
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="pin-box">
          <div class="rname">Set New Owner PIN</div>
          <input type="password" inputmode="numeric" id="reset-pin-input" maxlength="6" placeholder="New PIN" ${state.resetMsg ? 'disabled' : ''}>

          <button class="btn btn-primary" id="reset-submit" style="width:100%;margin-top:10px;" ${state.resetMsg ? 'disabled' : ''}>Set New PIN</button>
        </div>
      </div>
    `;

        state.resetError = 'PIN must be 4\u20136 digits.'; renderGate(); return;
      }
      state.resetError = ''; state.resetMsg = 'Saving\u2026';
      renderGate();
      try{
        const res = await fetch(`${API_BASE}/api/reset-pin/confirm`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ token: state.resetToken, newPin })
        });
        const data = await res.json().catch(() => ({}));
        if(res.ok && data.ok){

          renderGate();
          setTimeout(() => {
            state.gateStage = 'pin'; state.pinTargetRole = 'owner';
            state.resetMsg = ''; state.resetError = ''; state.resetToken = null;
            location.hash = OWNER_HASH;
            renderGate();
          }, 1400);
        } else {
          state.resetError = data.error || 'That link is invalid or expired. Request a new one.';
          state.resetMsg = '';
          renderGate();
        }
      }catch(e){
        console.error('reset-pin confirm failed', e);
        state.resetError = 'Something went wrong. Try again.';
        state.resetMsg = '';
        renderGate();
      }
    });
    return;
  }

  // Owner-specific link: go straight to the Owner PIN box, no picker.
  if(state.gateRole === 'owner'){
    state.pinTargetRole = 'owner';
    state.gateStage = 'pin';
    renderGate();
    return;
  }

  // Staff-specific link: Sign In / Request Access toggle, no Owner card.
  if(state.gateRole === 'staff'){
    renderStaffGate();
    return;
  }

  // Fallback (shouldn't normally be reached, kept for safety): generic picker.
  area.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-title">
          <h1>Staff Sign-In</h1>
          <p>This link is for internal use only</p>
        </div>
        <div class="role-grid">
          ${INTERNAL_ROLES.map(key => {
            const r = ROLES[key];
            return `
              <div class="role-card" data-role="${key}">
                <div class="ricon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[r.icon]}</svg></div>
                <div class="rname">${r.name}</div>
                <div class="rdesc">${r.desc}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  area.querySelectorAll('.role-card').forEach(c => c.addEventListener('click', () => {
    state.pinTargetRole = c.dataset.role; state.gateStage = 'pin'; state.pinError=''; renderGate();
  }));
}

function renderStaffGate(){
  const area = document.getElementById('gate-area');
  const mode = state.gateMode || 'signin';

  if(mode === 'submitted'){
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="gate-card">
          <div class="gate-title">
            <h1>Request Sent</h1>
          </div>
          <div class="pin-box" style="text-align:center;">
            <div class="note" style="margin:0 0 16px;">Request sent. Wait for an owner or manager to approve you and share your PIN.</div>
            <button class="btn btn-ghost" id="back-to-signin-btn" style="width:100%;">Back to Sign In</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('back-to-signin-btn').addEventListener('click', () => {
      state.gateMode = 'signin'; renderStaffGate();
    });
    return;
  }

  area.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-title">
          <h1>Boat Staff</h1>
          <p>Sign in, or request access if you're new</p>
        </div>
        <div class="mode-toggle" style="display:flex;margin:0 auto 16px;max-width:340px;">
          <button class="${mode==='signin'?'active':''}" data-gm="signin" style="font-size:12px;">Sign In</button>
          <button class="${mode==='request'?'active':''}" data-gm="request" style="font-size:12px;">Request Access</button>
        </div>
        <div id="staff-gate-body"></div>
      </div>
    </div>
  `;
  area.querySelectorAll('[data-gm]').forEach(b => b.addEventListener('click', () => {
    state.gateMode = b.dataset.gm; renderStaffGate();
  }));

  const body = document.getElementById('staff-gate-body');
  if(mode === 'signin'){
    body.innerHTML = `
      <div class="pin-box" style="margin:0;">
        <div class="rname">Enter your PIN</div>
        <input type="password" inputmode="numeric" id="staffgate-pin" maxlength="6" placeholder="&bull;&bull;&bull;&bull;">
        <div class="pin-error" id="staffgate-error"></div>
        <button class="btn btn-primary" id="staffgate-submit" style="width:100%;">Enter</button>
      </div>
    `;
    const input = document.getElementById('staffgate-pin');
    input.focus();
    const tryPin = () => {
      const entered = input.value;
      const users = state.settings.staffUsers || [];
      const match = users.find(u => u.pin === entered);
      if(match || (users.length === 0 && entered === state.settings.staffPin)){
        state.role = 'staff';
        state.staffName = match ? match.name : null;
        state.tab = DEFAULT_TAB.staff;
        saveSession('staff', 'staff', state.staffName);
        location.hash = state.tab;
        render();
        return;
      }
      document.getElementById('staffgate-error').textContent = 'Incorrect PIN. Try again.';
    };
    document.getElementById('staffgate-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
  } else {
    body.innerHTML = `
      <label>Your name</label>
      <input type="text" id="req-name" placeholder="e.g. Ahmed">
      <label>Email address</label>
      <input type="text" id="req-email" placeholder="e.g. ahmed@example.com">
      <label>Mobile number</label>
      <input type="tel" id="req-mobile" placeholder="e.g. 771 2345">
      <button class="btn btn-primary" id="req-submit" style="width:100%;">Request Access</button>
      <div class="note" style="margin-top:12px;">An owner or manager will need to approve your request and share a sign-in PIN with you before you can get in.</div>
    `;
    document.getElementById('req-submit').addEventListener('click', async () => {
      const name = document.getElementById('req-name').value.trim();
      const email = document.getElementById('req-email').value.trim();
      const mobile = document.getElementById('req-mobile').value.trim();
      if(!name || !email){ alert('Enter your name and email address.'); return; }
      await withFreshSettings(fresh => {
        const list = fresh.pendingStaff || (fresh.pendingStaff = []);
        list.push({id:'req-'+Date.now(), name, email, mobile, requestedAt:new Date().toISOString()});
      });
      state.gateMode = 'submitted';
      renderStaffGate();
    });
  }
}

function logoutInternal(){
  const backHash = state.gateRole === 'owner' ? OWNER_HASH : INTERNAL_HASH;
  clearSession();
  state.role = null; state.gateStage='pick'; state.pinTargetRole=null; state.pinError=''; state.tab=null; state.staffName=null; state.gateMode='signin';
  history.replaceState(null,'','#'+backHash);
  render();
}

/* ---------------- Mode toggle (Sender / Receiver) ---------------- */
function renderModeToggle(){
  const el = document.getElementById('mode-toggle');
  el.style.display = 'flex';
  el.innerHTML = `
    <button class="${state.role==='sender'?'active':''}" data-mode="sender">I'm Sending Cargo</button>
    <button class="${state.role==='receiver'?'active':''}" data-mode="receiver">I'm Receiving Cargo</button>
  `;
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    state.role = b.dataset.mode;
    state.tab = DEFAULT_TAB[state.role];
    location.hash = state.tab;
    render();
  }));
}

/* ---------------- Nav ---------------- */
function renderTabs(){
  const pending = state.shipments.filter(s => s.status === 'pending' && !isTripFinished(s.tripId)).length;
  const pendingStaffCount = (state.settings.pendingStaff || []).length;
  const el = document.getElementById('tabs');
  el.style.display = 'flex';
  const tabs = ROLE_TABS[state.role] || [];
  el.innerHTML = tabs.map(t => {
    const active = t.id === state.tab ? 'active' : '';
    let badge = '';
    if(t.id === 'dashboard' && pending > 0) badge = `<span class="badge">${pending}</span>`;
    if(t.id === 'settings' && pendingStaffCount > 0) badge = `<span class="badge">${pendingStaffCount}</span>`;
    return `<button class="${active}" data-tab="${t.id}">${t.label}${badge}</button>`;
  }).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; }));

  const pill = document.getElementById('role-pill');
  if(state.entryMode === 'internal'){
    pill.style.display = 'flex';
    document.getElementById('role-label').textContent = ROLES[state.role].name + (state.staffName ? ' \u00b7 ' + state.staffName : '');
    document.getElementById('switch-role-btn').onclick = logoutInternal;
  } else {
    pill.style.display = 'none';
  }
}

/* ---------------- Dashboard (owner + staff) ---------------- */
function renderDashboard(){
  const panel = document.getElementById('panel');
  const active = state.shipments.filter(s => !isTripFinished(s.tripId));
  const filtered = active
    .filter(s => state.filter === 'all' ? true : s.status === state.filter)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const counts = {
    all: active.length,
    pending: active.filter(s=>s.status==='pending').length,
    loaded: active.filter(s=>s.status==='loaded').length,
    in_transit: active.filter(s=>s.status==='in_transit').length,
    delivered: active.filter(s=>s.status==='delivered').length,
  };

  // Every non-finished trip is a valid route to add a manual customer onto --
  // never guess which one; ask. A shipment silently auto-attached to
  // "whatever's active" can otherwise end up tied to a trip that finishes
  // before the item is ever loaded, and vanish into Reports with no way to
  // act on it. If no trip exists at all, there's no route to pick from, so
  // this is Owner-only and the route is described by hand instead.
  const availableTrips = (state.trips||[]).filter(t => !t.finished);
  const canAddCustomer = availableTrips.length > 0 || state.role === 'owner';

  let tripField = '';
  if(availableTrips.length > 0){
    tripField = `
      <label>Trip (which route is this for?)</label>
      <select id="ac-trip-select" required>
        ${availableTrips.map(t => `<option value="${t.id}">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} (${fmtDMY(t.date)})</option>`).join('')}
      </select>
      <label>Destination island</label>
      <select id="ac-island-select" required>
        <option value="" disabled selected>Select destination</option>
        <option value="__other">Other</option>
      </select>
      <input type="text" id="ac-island-other" placeholder="Type destination" style="display:none;">
    `;
  } else {
    tripField = `
      <div class="note" style="border-color:var(--red);color:var(--red);margin-bottom:12px;">No trip exists yet, so this customer won't be tied to one \u2014 describe the route by hand below. Once a trip is created, load their items onto it as normal.</div>
      <label>Origin</label>
      <input type="text" id="ac-origin" required placeholder="e.g. Male'">
      <label>Destination island</label>
      <input type="text" id="ac-island-other" required placeholder="e.g. Maafushi">
    `;
  }

  panel.innerHTML = `
    <h2>Dispatch Dashboard</h2>
    <p class="sub">Customer check-ins, loading log, and delivery status.</p>
    ${canAddCustomer ? `<button class="btn btn-amber" id="toggle-add-customer-btn" style="margin-bottom:16px;">${state.addCustomerOpen ? 'Cancel' : '+ Add Customer'}</button>` : ''}
    ${state.addCustomerOpen && canAddCustomer ? `
      <div class="settings-block" style="border:1.5px solid var(--line);border-radius:10px;padding:16px;background:#fff;margin-bottom:16px;">
        <h3>Add Customer</h3>
        <label>Sender name</label>
        <input type="text" id="ac-name" required>
        <label>Sender mobile number</label>
        <input type="tel" id="ac-mobile" required>
        ${tripField}
        <label>Receiver's name</label>
        <input type="text" id="ac-rname" required>
        <label>Receiver's mobile number</label>
        <input type="tel" id="ac-rmobile" required>
        <label>Cargo note (optional)</label>
        <textarea id="ac-note" rows="2" placeholder="e.g. 3 sacks of rice, fragile"></textarea>
        <button class="btn btn-primary" id="ac-submit-btn">Add Customer</button>
      </div>
    ` : ''}
    <div class="search-row">
      <span class="filter-chip ${state.filter==='all'?'active':''}" data-f="all">All (${counts.all})</span>
      <span class="filter-chip ${state.filter==='pending'?'active':''}" data-f="pending">Awaiting load (${counts.pending})</span>
      <span class="filter-chip ${state.filter==='loaded'?'active':''}" data-f="loaded">Loaded (${counts.loaded})</span>
      <span class="filter-chip ${state.filter==='in_transit'?'active':''}" data-f="in_transit">In Transit (${counts.in_transit})</span>
      <span class="filter-chip ${state.filter==='delivered'?'active':''}" data-f="delivered">Delivered (${counts.delivered})</span>
    </div>
    <div id="list"></div>
  `;
  panel.querySelectorAll('.filter-chip').forEach(c => c.addEventListener('click', () => { state.filter = c.dataset.f; renderDashboard(); }));

  document.getElementById('toggle-add-customer-btn')?.addEventListener('click', () => {
    state.addCustomerOpen = !state.addCustomerOpen;
    renderDashboard();
  });

  if(state.addCustomerOpen && canAddCustomer){
    const acTripSelect = document.getElementById('ac-trip-select');
    const acSelect = document.getElementById('ac-island-select');
    const acOther = document.getElementById('ac-island-other');

    const populateIslands = () => {
      if(!acSelect || !acTripSelect) return;
      const t = availableTrips.find(x => x.id === acTripSelect.value);
      const dests = t ? (t.destinations||[]) : [];
      acSelect.innerHTML = `
        <option value="" disabled selected>Select destination</option>
        ${dests.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}
        <option value="__other">Other</option>
      `;
      acOther.style.display = 'none'; acOther.required = false; acOther.value = '';
    };
    if(acTripSelect){ populateIslands(); acTripSelect.addEventListener('change', populateIslands); }

    if(acSelect){
      acSelect.addEventListener('change', () => {
        if(acSelect.value === '__other'){ acOther.style.display = 'block'; acOther.required = true; }
        else { acOther.style.display = 'none'; acOther.required = false; acOther.value=''; }
      });
    }
    document.getElementById('ac-submit-btn').addEventListener('click', async () => {
      try{
        const name = document.getElementById('ac-name').value.trim();
        const mobile = document.getElementById('ac-mobile').value.trim();
        const island = acSelect && acSelect.value && acSelect.value !== '__other' ? acSelect.value : (acOther.value||'').trim();
        const receiverName = document.getElementById('ac-rname').value.trim();
        const receiverMobile = document.getElementById('ac-rmobile').value.trim();
        const note = document.getElementById('ac-note').value.trim();
        const selectedTrip = acTripSelect ? availableTrips.find(x => x.id === acTripSelect.value) : null;
        const originInput = document.getElementById('ac-origin');
        if(!name || !mobile || !island || !receiverName || !receiverMobile){ alert('Fill in sender, receiver, and destination island.'); return; }
        if(availableTrips.length > 0 && !selectedTrip){ alert('Pick which trip this customer is for.'); return; }
        if(availableTrips.length === 0 && !(originInput && originInput.value.trim())){ alert('Enter the origin.'); return; }
        const code = trackingCode();
        const shipment = { id: code, name, mobile, island, receiverName, receiverMobile, note, status:'pending', items:[], total:0, tripId: selectedTrip ? selectedTrip.id : null, createdAt: new Date().toISOString() };
        await withFreshShipments(list => { list.push(shipment); });
        state.addCustomerOpen = false;
        renderDashboard();
      }catch(err){
        console.error('Add Customer failed', err);
        alert('Something went wrong adding this customer. Please try again.');
      }
    });
  }

  const list = panel.querySelector('#list');
  if(filtered.length === 0){ list.innerHTML = `<div class="empty">No shipments here yet.</div>`; return; }
  list.innerHTML = filtered.map(s => renderTagCard(s)).join('');

  list.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => openLoadForm(b.dataset.load)));
  list.querySelectorAll('[data-deliver]').forEach(b => b.addEventListener('click', () => markDelivered(b.dataset.deliver)));
  list.querySelectorAll('[data-invoice]').forEach(b => b.addEventListener('click', () => { state.trackQuery=b.dataset.invoice; location.hash='track'; }));
  list.querySelectorAll('[data-delete-shipment]').forEach(b => b.addEventListener('click', async () => {
    const target = state.shipments.find(x => x.id === b.dataset.deleteShipment);
    if(target && target.items && target.items.length && state.role !== 'owner'){
      alert('Only the Owner can delete a shipment once items have been logged.');
      return;
    }
    if(!confirm('Delete this customer entry? This cannot be undone.')) return;
    await withFreshShipments(list => {
      const idx = list.findIndex(x => x.id === b.dataset.deleteShipment);
      if(idx > -1) list.splice(idx, 1);
    });
    renderDashboard();
  }));
  list.querySelectorAll('[data-take-photo]').forEach(b => b.addEventListener('click', () => {
    const input = document.querySelector(`[data-load-photo="${b.dataset.takePhoto}"]`);
    if(input) input.click();
  }));
  list.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.pay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    renderDashboard();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    state.cashDraft[b.dataset.cashOpen] = { received: '' };
    renderDashboard();
  }));
  list.querySelectorAll('[data-cash-cancel]').forEach(b => b.addEventListener('click', () => {
    delete state.cashDraft[b.dataset.cashCancel];
    renderDashboard();
  }));
  list.querySelectorAll('[id^="cash-input-"]').forEach(inp => inp.addEventListener('input', () => {
    const id = inp.id.replace('cash-input-','');
    if(!state.cashDraft[id]) return;
    state.cashDraft[id].received = inp.value;
    const s = state.shipments.find(x => x.id === id);
    const received = parseFloat(inp.value) || 0;
    const balance = received - (s.total || 0);
    const label = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
    const color = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
    const balEl = document.getElementById('cash-balance-'+id);
    if(balEl){ balEl.textContent = `${label}: ${fmtMoney(Math.abs(balance))}`; balEl.style.color = color; }
  }));
  list.querySelectorAll('[data-cash-confirm]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.cashConfirm;
    const received = parseFloat(state.cashDraft[id].received) || 0;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === id);
      if(s){
        s.paid = true; s.paymentMethod = 'cash'; s.paidAt = new Date().toISOString();
        s.cashReceived = received; s.cashChange = received - (s.total||0);
      }
    });
    delete state.cashDraft[id];
    renderDashboard();
  }));
}

function renderTagCard(s){
  const statusClass = 'status-' + s.status;
  const statusLabel = STATUS_LABELS[s.status] || s.status;
  const draft = state.loadingDraft[s.id];
  const cash = state.cashDraft[s.id];
  let actions = '';
  if(s.status === 'pending'){
    if(!draft){
      actions = `<button class="btn btn-amber" data-load="${s.id}">Log Items Loaded</button>`;
    } else if(draft.open){
      actions = `<button class="btn btn-ghost" data-load="${s.id}">Hide Items Log</button>`;
    } else {
      const pendingCount = draft.items.reduce((n,i)=>n+i.qty,0);
      actions = `<button class="btn btn-amber" data-load="${s.id}">Continue \u2014 ${pendingCount} item${pendingCount===1?'':'s'} pending</button>`;
    }
  } else if(s.status === 'loaded'){
    actions = `<button class="btn btn-ghost" data-invoice="${s.id}">View Invoice</button>`;
  } else if(s.status === 'in_transit'){
    actions = `<button class="btn btn-primary" data-deliver="${s.id}">Mark Delivered</button>
               <button class="btn btn-ghost" data-invoice="${s.id}">View Invoice</button>`;
  } else {
    actions = `<button class="btn btn-ghost" data-invoice="${s.id}">View Invoice</button>`;
  }

  const photoControls = (s.status === 'loaded' || s.status === 'in_transit') ? `
    <button class="btn btn-ghost" data-take-photo="${s.id}">${s.photo ? 'Retake Photo' : 'Add Photo'}</button>
    <input type="file" accept="image/*" data-load-photo="${s.id}" style="display:none;">
  ` : '';
  const photoThumb = photoLinkHtml(s);

  const itemsSummary = (s.items && s.items.length) ? `
    <details class="items-details">
      <summary>Items (${s.items.reduce((n,i)=>n+i.qty,0)})</summary>
      <div class="items-body">
        ${s.items.map(i => `${i.qty}\u00d7 ${escapeHtml(i.name)}`).join('<br>')}
        <div style="margin-top:6px;font-weight:700;color:var(--navy-deep);">Total ${fmtMoney(s.total)}</div>
      </div>
    </details>
  ` : '';
  const invoiceLine = s.invoiceId ? `<div class="tag-meta">Invoice ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#2F7A4F':'#B23A2F'}">${s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid'}</strong></div>` : '';
  const paymentActions = (s.invoiceId && !s.voided && !s.paid && !cash) ? `
    <button class="btn btn-primary" data-cash-open="${s.id}">Collect \u2014 Cash</button>
    <button class="btn btn-primary" data-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
  ` : '';

  const tel = (num) => num ? `<a class="party-phone" href="tel:${escapeHtml(num.replace(/[^\d+]/g,''))}">${escapeHtml(num)}</a>` : '';
  const hasItems = s.items && s.items.length > 0;
  const canDelete = !hasItems || state.role === 'owner';
  const deleteBtn = canDelete ? `<button class="btn btn-danger" data-delete-shipment="${s.id}">Delete</button>` : '';

  return `
    <div class="tag">
      <div class="tag-top">
        <div style="flex:1;">
          <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span><br>${tel(s.mobile)}</div>
          ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span><br>${tel(s.receiverMobile)}</div>` : ''}
          <div class="tag-meta">${s.id} \u00b7 to <strong>${escapeHtml(s.island)}</strong></div>
        </div>
        <span class="status-pill ${statusClass}">${statusLabel}</span>
      </div>
      ${s.note ? `<div class="tag-meta">Note: ${escapeHtml(s.note)}</div>` : ''}
      ${itemsSummary}
      ${invoiceLine}
      ${photoThumb}
      <div class="tag-actions">${actions}${paymentActions}${photoControls}${deleteBtn}</div>
      ${cash ? renderCashForm(s) : ''}
      ${draft && draft.open ? renderLoadForm(s) : ''}
    </div>
  `;
}

function renderCashForm(s){
  const cash = state.cashDraft[s.id];
  const received = parseFloat(cash.received) || 0;
  const balance = received - (s.total || 0);
  const balanceLabel = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
  const balanceColor = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
  return `
    <div class="cash-box">
      <label style="margin-bottom:6px;">Amount received (\u0783)</label>
      <input type="text" inputmode="decimal" id="cash-input-${s.id}" value="${escapeHtml(cash.received)}" placeholder="0.00" style="margin-bottom:8px;">
      <div class="tag-meta">Total due: ${fmtMoney(s.total)}</div>
      <div class="balance" id="cash-balance-${s.id}" style="color:${balanceColor};">${balanceLabel}: ${fmtMoney(Math.abs(balance))}</div>
      <div class="tag-actions">
        <button class="btn btn-primary" data-cash-confirm="${s.id}">Confirm Cash Payment</button>
        <button class="btn btn-ghost" data-cash-cancel="${s.id}">Cancel</button>
      </div>
    </div>
  `;
}

function openLoadForm(id){
  const existing = state.loadingDraft[id];
  if(!existing){
    state.loadingDraft[id] = { items: [], customName:'', customPrice:'', itemSearch:'', open: true };
  } else if(existing.open){
    // Collapsing: if nothing was actually added yet, just discard the empty draft
    // so the card goes back to a plain "Log Items Loaded" button. If items were
    // added, keep everything -- just hide the form, don't lose the work.
    if(existing.items.length === 0){ delete state.loadingDraft[id]; }
    else { existing.open = false; }
  } else {
    existing.open = true;
  }
  renderDashboard();
}

function pickItem(sid, rateId){
  const d = state.loadingDraft[sid];
  const rate = state.rates.find(r => r.id === rateId);
  if(!d || !rate) return;
  const existing = d.items.find(i => i.id === rate.id);
  if(existing){ existing.qty += 1; }
  else { d.items.push({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }
  d.itemSearch = '';
  renderDashboard();
}

function wireLoadFormEvents(){
  document.querySelectorAll('[data-item-search]').forEach(inp => inp.addEventListener('input', () => {
    const sid = inp.dataset.itemSearch;
    const d = state.loadingDraft[sid];
    if(!d) return;
    d.itemSearch = inp.value;
    const query = inp.value.trim().toLowerCase();
    const sortedRates = state.rates.slice().sort((a,b) => a.name.localeCompare(b.name));
    const matches = query ? sortedRates.filter(r => r.name.toLowerCase().includes(query)) : sortedRates;
    const box = document.querySelector(`[data-item-results="${sid}"]`);
    if(!box) return;
    box.innerHTML = matches.length ? matches.map(r => `
      <button type="button" class="item-result-row" data-pick-item="${sid}" data-rate-id="${r.id}">
        <span>${escapeHtml(r.name)}</span><span class="rprice">${fmtMoney(r.price)}</span>
      </button>
    `).join('') : `<div class="empty" style="padding:10px 0;font-size:13px;">No matching items.</div>`;
    box.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
  }));
  document.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
  document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items[b.dataset.inc].qty++; renderDashboard();
  }));
  document.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid];
    const idx = b.dataset.dec;
    d.items[idx].qty = Math.max(0, d.items[idx].qty - 1);
    if(d.items[idx].qty === 0) d.items.splice(idx,1);
    renderDashboard();
  }));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items.splice(b.dataset.remove,1); renderDashboard();
  }));
  document.querySelectorAll('[data-custom-name]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customName].customName = inp.value; }));
  document.querySelectorAll('[data-custom-price]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customPrice].customPrice = inp.value; }));
  document.querySelectorAll('[data-add-custom]').forEach(b => b.addEventListener('click', async () => {
    const d = state.loadingDraft[b.dataset.addCustom];
    const name = (d.customName||'').trim();
    const price = parseFloat(d.customPrice) || 0;
    if(!name) return;

    // Reuse an existing rate if one with this name already exists (case-insensitive),
    // otherwise persist it as a new rate so it shows up in the dropdown for every
    // future shipment entry, not just this one.
    let rate = state.rates.find(r => r.name.trim().toLowerCase() === name.toLowerCase());
    if(!rate){
      rate = { id: 'custom-'+Date.now(), name, price };
      state.rates.push(rate);
      await saveRates(state.rates);
    }

    const existing = d.items.find(i => i.id === rate.id);
    if(existing){ existing.qty++; }
    else { d.items.push({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }

    d.customName=''; d.customPrice='';
    renderDashboard();
  }));
  document.querySelectorAll('[data-cancel-load]').forEach(b => b.addEventListener('click', () => { delete state.loadingDraft[b.dataset.cancelLoad]; renderDashboard(); }));

  document.querySelectorAll('[data-confirm-load]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.confirmLoad;
    const draft = state.loadingDraft[id];
    const items = draft.items.filter(i => i.qty > 0);
    if(items.length === 0){ alert('Add at least one item before confirming.'); return; }
    // Save first, camera second. If the camera step gets interrupted (iOS can
    // reload the whole page while the camera app is open, wiping in-memory
    // state), the shipment is already safely marked Loaded with its invoice --
    // only the photo attempt is lost, and that can just be retried afterward.
    await completeLoadConfirm(id);
    const photoInput = document.querySelector(`[data-load-photo="${id}"]`);
    if(photoInput) photoInput.click();
  }));

  document.querySelectorAll('[data-load-photo]').forEach(inp => inp.addEventListener('change', async () => {
    const id = inp.dataset.loadPhoto;
    const file = inp.files && inp.files[0];
    if(!file) return;
    let photo = null;
    try{ photo = await compressImageToDataUrl(file, 900, 0.6); }
    catch(e){ console.error('Photo compression failed', e); }
    if(photo) await attachPhoto(id, photo);
  }));
}

// Resizes and re-compresses a captured photo before it ever touches the
// database -- raw camera photos are several MB each, and this data is stored
// inside one shared JSON blob for every shipment, so uncompressed photos
// would make the whole app slow to load for everyone, not just this record.
function compressImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function completeLoadConfirm(id){
  const draft = state.loadingDraft[id];
  if(!draft) return;
  const items = draft.items.filter(i => i.qty > 0).map(i => ({name:i.name, qty:i.qty, price:i.price}));
  if(items.length === 0) return;
  const total = items.reduce((sum,i) => sum + i.qty*i.price, 0);
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'loaded'; s.items = items; s.total = total; s.loadedAt = new Date().toISOString();
    s.invoiceId = s.invoiceId || invoiceId();
    s.paid = s.paid || false;
  });
  delete state.loadingDraft[id];
  renderDashboard();
}

async function attachPhoto(id, photo){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(s){ s.photo = photo; s.imageArchived = false; }
  });
  renderDashboard();
}

// Called from the Trips tab: moves every 'loaded' shipment tied to this trip
// into 'in_transit' together, since the boat either has departed or hasn't --
// individual shipments don't depart separately.
async function markTripInTransit(tripId){
  let moved = 0;
  const now = new Date().toISOString();
  await withFreshShipments(list => {
    list.forEach(s => {
      if(s.tripId === tripId && s.status === 'loaded'){ s.status = 'in_transit'; s.inTransitAt = now; moved++; }
    });
  });
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t) t.departed = true;
  });
  return moved;
}

function isTripFinished(tripId){
  if(!tripId) return false;
  const t = (state.trips||[]).find(x => x.id === tripId);
  return !!(t && t.finished);
}

async function finishTrip(tripId){
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t){ t.finished = true; t.finishedAt = new Date().toISOString(); }
  });
}

async function markDelivered(id){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
    delete s.photo; s.imageArchived = false;
  });
  renderDashboard();
}

    const island = selectEl && selectEl.value && selectEl.value !== '__other' ? selectEl.value : (document.getElementById('f-island-other').value||'').trim();

    const receiverMobile = document.getElementById('f-rmobile').value.trim();

    const shipment = { id: code, name, mobile, island, receiverName, receiverMobile, note, status:'pending', items:[], total:0, tripId: trip ? trip.id : null, createdAt: new Date().toISOString() };
    await withFreshShipments(list => { list.push(shipment); });

    document.getElementById('checkin-result').innerHTML = `

function renderTrackResult(s){
  const steps = STATUS_STEPS;
  const idx = steps.indexOf(s.status);
  const dates = { pending: s.createdAt, loaded: s.loadedAt, in_transit: s.inTransitAt, delivered: s.deliveredAt };
  const labels = { pending:'Checked In', loaded:'Loaded', in_transit:'In Transit', delivered:'Delivered' };
  const tripEnded = isTripFinished(s.tripId) && s.status !== 'delivered';

  const timeline = steps.map((step,i) => {
    let label = labels[step];
    let redLabel = false;
    if(tripEnded && step === s.status){ label = 'Trip Ended'; redLabel = true; }
    if(tripEnded && step === 'delivered'){ label = 'Not Delivered'; redLabel = true; }
    const endedClass = (tripEnded && i <= idx) ? ' trip-ended' : '';
    return `
    <div class="tl-step ${i<=idx?'done':''}${endedClass}">
      <div class="tl-dot"></div>
      <div class="tl-label"${redLabel ? ' style="color:var(--red);"' : ''}>${label}</div>
      <div class="tl-date">${dates[step] ? fmtDate(dates[step]) : ''}</div>
    </div>
  `;
  }).join('');

  const isCustomer = state.role === 'sender' || state.role === 'receiver';

  const invoice = (!isCustomer && s.items && s.items.length) ? `
    <div class="invoice">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="display" style="font-size:15px;color:var(--navy-deep);">Invoice \u2014 ${s.id}</div>
        <button class="btn btn-ghost" data-share-image="${s.id}" style="padding:6px 12px;font-size:11px;">Share as Image</button>
      </div>
      <div class="tag-meta" style="margin-top:6px;">Sender: ${escapeHtml(s.name)} \u00b7 ${escapeHtml(s.mobile)} \u2192 ${escapeHtml(s.island)}</div>
      ${s.receiverName ? `<div class="tag-meta">Receiver: ${escapeHtml(s.receiverName)} \u00b7 ${escapeHtml(s.receiverMobile||'')}</div>` : ''}
      ${s.invoiceId ? `<div class="tag-meta">Invoice ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#2F7A4F':'#B23A2F'}">${s.paid?'Paid':'Unpaid'}</strong></div>` : ''}
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td><td class="num">${fmtMoney(i.price)}</td><td class="num">${fmtMoney(i.qty*i.price)}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="total-line"><span>Total Due</span><span class="amt">${fmtMoney(s.total)}</span></div>
    </div>
  ` : '';

  const itemsOnly = (isCustomer && s.items && s.items.length) ? `
    <div class="invoice">
      <div class="display" style="font-size:15px;color:var(--navy-deep);">Items Loaded</div>
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  ` : '';

  return `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${labels[s.status]}</span>
      </div>
      <div class="tag-meta">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.island)} ${s.receiverName ? '(for '+escapeHtml(s.receiverName)+')' : ''}</div>
      <div class="timeline">${timeline}</div>
      ${invoice}
      ${itemsOnly}
    </div>
  `;
}
