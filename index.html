function renderTrackResult(s){
  const steps = STATUS_STEPS;
  const idx = steps.indexOf(s.status);
  const dates = { pending: s.createdAt, loaded: s.loadedAt, in_transit: s.inTransitAt, delivered: s.deliveredAt };
  const labels = { pending:'Checked In', loaded:'Loaded', in_transit:'In Transit', delivered:'Delivered' };
  const tripEnded = isTripFinished(s.tripId) && s.status !== 'delivered';

  const timeline = steps.map((step,i) => {
    let label = labels[step];
    let redLabel = false;
    if(tripEnded && step === s.status){ label = 'Trip Ended'; redLabel = true; }
    if(tripEnded && step === 'delivered'){ label = 'Not Delivered'; redLabel = true; }
    const endedClass = (tripEnded && i <= idx) ? ' trip-ended' : '';
    return `
    <div class="tl-step ${i<=idx?'done':''}${endedClass}">
      <div class="tl-dot"></div>
      <div class="tl-label"${redLabel ? ' style="color:var(--red);"' : ''}>${label}</div>
      <div class="tl-date">${dates[step] ? fmtDate(dates[step]) : ''}</div>
    </div>
  `;
  }).join('');

  const isCustomer = state.role === 'sender' || state.role === 'receiver';

  const invoice = (!isCustomer && s.items && s.items.length) ? `
    <div class="invoice">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="display" style="font-size:15px;color:var(--navy-deep);">Invoice \u2014 ${s.id}</div>
        <button class="btn btn-ghost" data-share-image="${s.id}" style="padding:6px 12px;font-size:11px;">Share as Image</button>
      </div>
      <div class="tag-meta" style="margin-top:6px;">Sender: ${escapeHtml(s.name)} \u00b7 ${telLink(s.mobile)} \u2192 ${escapeHtml(s.island)}</div>
      ${s.receiverName ? `<div class="tag-meta">Receiver: ${escapeHtml(s.receiverName)} \u00b7 ${telLink(s.receiverMobile)}</div>` : ''}
      ${s.invoiceId ? `<div class="tag-meta">Invoice ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#2F7A4F':'#B23A2F'}">${s.paid?'Paid':'Unpaid'}</strong></div>` : ''}
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td><td class="num">${fmtMoney(i.price)}</td><td class="num">${fmtMoney(i.qty*i.price)}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="total-line"><span>Total Due</span><span class="amt">${fmtMoney(s.total)}</span></div>
    </div>
  ` : '';

  const itemsOnly = (isCustomer && s.items && s.items.length) ? `
    <div class="invoice">
      <div class="display" style="font-size:15px;color:var(--navy-deep);">Items Loaded</div>
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  ` : '';

  return `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${labels[s.status]}</span>
      </div>
      <div class="tag-meta">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.island)} ${s.receiverName ? '(for '+escapeHtml(s.receiverName)+')' : ''}</div>
      <div class="timeline">${timeline}</div>
      ${invoice}
      ${itemsOnly}
    </div>
  `;
}

/* ---------------- Trips (owner only) ---------------- */
function renderTrips(){
  const panel = document.getElementById('panel');
  const trips = (state.trips||[]).filter(t => !t.finished).slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const d = state.settings.tripDefaults || {};
  const hasDefaults = !!(d.boatContacts || d.trackingLink || d.viberLink);
  const ongoingTrip = trips.find(t => t.active && !t.finished);
  const boatRoutes = state.settings.routes || [];

  panel.innerHTML = `
    <h2>Trips</h2>
    <p class="sub">Plan the next trip. The active trip's destinations show up on the customer check-in form automatically.</p>
    ${ongoingTrip ? `
      <div class="note" style="margin-bottom:16px;">A trip is currently in progress (${escapeHtml(ongoingTrip.origin)} \u2192 ${escapeHtml((ongoingTrip.destinations||[]).join(', '))}). Mark it finished before planning the next one.</div>
    ` : `

          <select id="trip-origin">
            <option value="" disabled selected>Select origin</option>
            ${boatRoutes.map(r => `<option value="${escapeHtml(r.origin)}">${escapeHtml(r.origin)}</option>`).join('')}

          </select>
          <input type="text" id="trip-origin-other" placeholder="Origin" style="display:none;">
        ` : `

          <div class="note">No routes set up for this boat yet \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">add them in Trip Settings</a> to have destinations fill in automatically next time.</div>
        `}
        <label>Destinations (one per line)</label>
        <textarea id="trip-dests" rows="3" placeholder="Fills in automatically once you pick an origin \u2014 edit if needed"></textarea>
        <label>Trip date</label>
        <input type="date" id="trip-date">
        <label>Loading time</label>
        <input type="time" id="trip-loading">
        <label>Estimated departure time</label>
        <input type="time" id="trip-departure">
        <label>Loading location / jetty</label>
        <input type="text" id="trip-location" placeholder="Fills in automatically once you pick an origin">
        ${hasDefaults ? `
          <div class="note">Boat contacts, tracking link, and Viber link are fixed and pulled in automatically from Owner Settings \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">edit them there</a> if they ever change.</div>
        ` : `
          <div class="note" style="border-color:var(--red);color:var(--red);">Boat contacts, tracking link, and Viber link aren't set yet \u2014 go to <a href="#settings" style="color:var(--red);font-weight:700;">Owner Settings</a> and add them first, or the announcement will show them blank.</div>
        `}
        <button class="btn btn-primary" id="create-trip-btn" style="margin-top:12px;">Create Trip &amp; Set Active</button>
      </div>
    `}
    <div id="trip-list" style="margin-top:20px;"></div>

  if(!ongoingTrip){
  if(boatRoutes.length > 0){
    document.getElementById('trip-origin').addEventListener('change', (e) => {
      const otherInput = document.getElementById('trip-origin-other');
      if(e.target.value === '__other'){
        otherInput.style.display = '';
        otherInput.focus();
        return;
      }
      otherInput.style.display = 'none';
      const route = boatRoutes.find(r => r.origin === e.target.value);
      if(!route) return;
      document.getElementById('trip-dests').value = (route.destinations||[]).join('\n');
      document.getElementById('trip-location').value = route.location || '';
    });
  }

  document.getElementById('create-trip-btn').addEventListener('click', async () => {
    const originSelect = document.getElementById('trip-origin');
    const origin = (originSelect && originSelect.value !== '__other' ? originSelect.value : document.getElementById('trip-origin-other').value).trim();
    const destinations = document.getElementById('trip-dests').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const date = document.getElementById('trip-date').value;
    const loadingTime = document.getElementById('trip-loading').value;
    const departureTime = document.getElementById('trip-departure').value;
    const location = document.getElementById('trip-location').value.trim();
    const fresh = state.settings.tripDefaults || {};
    const boatContacts = fresh.boatContacts || '';
    const trackingLink = fresh.trackingLink || '';
    const viberLink = fresh.viberLink || '';
    if(!origin || destinations.length === 0 || !date){ alert('Origin, at least one destination, and a date are required.'); return; }
    const trip = {id:'trip-'+Date.now(), origin, destinations, date, loadingTime, departureTime, location, boatContacts, trackingLink, viberLink, active:true, createdAt:new Date().toISOString()};
    await withFreshTrips(list => {
      list.forEach(t => t.active = false);
      list.push(trip);
    });
    renderTrips();
    createGoogleSheetForTrip(trip);
  });
  } // end ongoingTrip guard

  const list = panel.querySelector('#trip-list');
  if(trips.length === 0){ list.innerHTML = `<div class="empty">No trips planned yet.</div>`; return; }

  list.innerHTML = trips.map(t => {
    const loadedCount = state.shipments.filter(s => s.tripId === t.id && s.status === 'loaded').length;
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    const undelivered = tripShipments.filter(s => s.status !== 'delivered');
    const delivered = tripShipments.filter(s => s.status === 'delivered');
    const statusClass = t.finished ? 'status-delivered' : (t.departed ? 'status-in_transit' : (t.active?'status-delivered':'status-pending'));
    const statusLabel = t.finished ? 'Finished' : (t.departed ? 'In Transit' : (t.active?'Active':'Past'));
    const showFinish = state.finishDraft[t.id];
    return `
    <div class="tag">
      <div class="tag-top">
        <div>
          <div class="tag-code">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</div>
          <div class="tag-meta">${fmtDMY(t.date)} \u00b7 Load ${escapeHtml(t.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(t.departureTime||'--:--')}</div>
        </div>
        <span class="status-pill ${statusClass}">${statusLabel}</span>
      </div>
      <div class="tag-meta">${escapeHtml(t.location||'')}</div>
      ${t.finished ? `<div class="tag-meta">${delivered.length} delivered \u00b7 ${undelivered.length} undelivered</div>` : ''}
      <div class="tag-actions">
        ${!t.active && !t.finished ? `<button class="btn btn-amber" data-set-active="${t.id}">Set Active</button>` : ''}
        ${t.active && !t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-transit="${t.id}">Mark In Transit (${loadedCount} loaded)</button>` : ''}
        ${t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-finish="${t.id}">Mark Trip Finished</button>` : ''}
        ${!t.finished ? `<button class="btn btn-ghost" data-copy-ann="${t.id}">Copy Announcement</button>` : ''}
        <button class="btn btn-danger" data-del-trip="${t.id}">Delete</button>
      </div>
      ${showFinish ? `
        <div class="cash-box">
          <label style="margin-bottom:8px;">${undelivered.length === 0 ? 'Everything on this trip was delivered.' : `${undelivered.length} shipment(s) still not delivered:`}</label>
          ${undelivered.length ? `
            <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
              ${undelivered.map(s => `
                <div class="item-result-row" style="cursor:default;">
                  <span>${escapeHtml(s.id)} \u2014 ${escapeHtml(s.name)} \u2192 ${escapeHtml(s.island)}</span>
                  <span class="status-pill status-${s.status}" style="font-size:9px;padding:3px 8px;">${STATUS_LABELS[s.status]}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
          <div class="tag-actions">
            <button class="btn btn-primary" data-confirm-finish="${t.id}">Confirm \u2014 Finish Trip</button>
            <button class="btn btn-ghost" data-cancel-finish="${t.id}">Cancel</button>
          </div>
        </div>
      ` : ''}
      ${!t.finished ? `<textarea readonly rows="9" style="margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;">${escapeHtml(buildAnnouncement(t))}</textarea>` : ''}
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-mark-transit]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Mark this trip in transit? Every loaded shipment on this trip will move to "In Transit" together, and a manifest file will be saved to this device.')) return;
    const tripId = b.dataset.markTransit;
    const trip = (state.trips||[]).find(t => t.id === tripId);
    const tripShipments = state.shipments.filter(s => s.tripId === tripId);
    if(trip) downloadTripManifest(trip, tripShipments);
    const moved = await markTripInTransit(tripId);
    alert(`Trip marked in transit. ${moved} shipment(s) updated.`);
    renderTrips();
  }));

  list.querySelectorAll('[data-mark-finish]').forEach(b => b.addEventListener('click', () => {
    state.finishDraft[b.dataset.markFinish] = true;
    renderTrips();
  }));
  list.querySelectorAll('[data-cancel-finish]').forEach(b => b.addEventListener('click', () => {
    delete state.finishDraft[b.dataset.cancelFinish];
    renderTrips();
  }));
  list.querySelectorAll('[data-confirm-finish]').forEach(b => b.addEventListener('click', async () => {
    await finishTrip(b.dataset.confirmFinish);
    delete state.finishDraft[b.dataset.confirmFinish];
    alert('Trip marked finished. Its shipments have moved off the Dashboard and into Reports.');
    renderTrips();
  }));

  list.querySelectorAll('[data-set-active]').forEach(b => b.addEventListener('click', async () => {
    await withFreshTrips(l => { l.forEach(t => t.active = (t.id === b.dataset.setActive)); });
    renderTrips();
  }));
  list.querySelectorAll('[data-del-trip]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Delete this trip?')) return;
    await withFreshTrips(l => { const i = l.findIndex(t => t.id === b.dataset.delTrip); if(i>-1) l.splice(i,1); });
    renderTrips();
  }));
  list.querySelectorAll('[data-copy-ann]').forEach(b => b.addEventListener('click', () => {
    const t = trips.find(x => x.id === b.dataset.copyAnn);
    const text = buildAnnouncement(t);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => alert('Announcement copied.')).catch(() => alert('Could not copy \u2014 select the text box manually.'));
    } else { alert('Select the text in the box and copy manually.'); }
  }));
}

/* ---------------- Invoices (owner only) ---------------- */
async function renderInvoices(){
  const panel = document.getElementById('panel');

  // Backfill: older shipments may have items/total but never got an invoiceId
  // assigned (e.g. created before this feature existed) -- fix that once, here,
  // so nothing invoiced silently stays invisible on this page.
  let needsSave = false;
  state.shipments.forEach(s => {
    if(s.items && s.items.length && !s.invoiceId){ needsSave = true; }
  });
  if(needsSave){
    await withFreshShipments(list => {
      list.forEach(s => {
        if(s.items && s.items.length && !s.invoiceId){
          s.invoiceId = invoiceId();
          if(s.paid === undefined) s.paid = false;
        }
      });
    });
  }

  const invoices = state.shipments.filter(s => s.invoiceId && !s.voided && !isTripFinished(s.tripId));
  const total = invoices.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaid = invoices.filter(s => !s.paid);
  const paid = invoices.filter(s => s.paid);
  const sorted = state.shipments.filter(s => s.invoiceId && !isTripFinished(s.tripId)).sort((a,b) => new Date(b.loadedAt) - new Date(a.loadedAt));

  panel.innerHTML = `

    <p class="sub">Generated automatically when a shipment's items are logged. Invoices from finished trips move to Reports.</p>

      <div class="stat-card"><div class="slabel">Total Invoiced</div><div class="sval">${fmtMoney(total)}</div></div>
      <div class="stat-card"><div class="slabel">Unpaid</div><div class="sval" style="color:var(--red);">${unpaid.length}</div></div>
      <div class="stat-card"><div class="slabel">Paid</div><div class="sval" style="color:var(--green);">${paid.length}</div></div>
    </div>
    <div id="invoice-list"></div>
  `;

  const list = panel.querySelector('#invoice-list');
  if(sorted.length === 0){ list.innerHTML = `<div class="empty">No invoices yet.</div>`; return; }

  list.innerHTML = sorted.map(s => {
    const cash = state.cashDraft[s.id];
    return `
    <div class="tag" style="${s.voided ? 'opacity:0.5;' : ''}">
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.voided ? 'status-pending' : (s.paid ? 'status-delivered' : 'status-in_transit')}">${s.voided ? 'Voided' : (s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid')}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      <div class="tag-actions">
        <button class="btn btn-ghost" data-inv-print="${s.id}">Share</button>
        ${!s.voided && !s.paid && !cash ? `
          <button class="btn btn-primary" data-cash-open="${s.id}">Collect \u2014 Cash</button>
          <button class="btn btn-primary" data-inv-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
        ` : ''}
        ${!s.voided && s.paid ? `<button class="btn btn-ghost" data-inv-unpay="${s.id}">Mark Unpaid</button>` : ''}
        ${!s.voided ? `<button class="btn btn-danger" data-inv-void="${s.id}">Void</button>` : ''}
      </div>
      ${cash ? renderCashForm(s) : ''}
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-inv-print]').forEach(b => b.addEventListener('click', () => { state.trackQuery = b.dataset.invPrint; location.hash = 'track'; }));
  list.querySelectorAll('[data-inv-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invPay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invPay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    state.cashDraft[b.dataset.cashOpen] = { received: '' };
    renderInvoices();
  }));
  list.querySelectorAll('[data-cash-cancel]').forEach(b => b.addEventListener('click', () => {
    delete state.cashDraft[b.dataset.cashCancel];
    renderInvoices();
  }));
  list.querySelectorAll('[id^="cash-input-"]').forEach(inp => inp.addEventListener('input', () => {
    const id = inp.id.replace('cash-input-','');
    if(!state.cashDraft[id]) return;
    state.cashDraft[id].received = inp.value;
    const s = state.shipments.find(x => x.id === id);
    const received = parseFloat(inp.value) || 0;
    const balance = received - (s.total || 0);
    const label = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
    const color = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
    const balEl = document.getElementById('cash-balance-'+id);
    if(balEl){ balEl.textContent = `${label}: ${fmtMoney(Math.abs(balance))}`; balEl.style.color = color; }
  }));
  list.querySelectorAll('[data-cash-confirm]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.cashConfirm;
    const received = parseFloat(state.cashDraft[id].received) || 0;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === id);
      if(s){
        s.paid = true; s.paymentMethod = 'cash'; s.paidAt = new Date().toISOString();
        s.cashReceived = received; s.cashChange = received - (s.total||0);
      }
    });
    delete state.cashDraft[id];
    syncShipmentToSheet(state.shipments.find(x => x.id === id));
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invUnpay);
      if(s){ s.paid = false; s.paymentMethod = null; s.paidAt = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invUnpay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-void]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Void this invoice? It will be excluded from totals.')) return;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invVoid);
      if(s) s.voided = true;
    });
    renderInvoices();
  }));
}

/* ---------------- Reports (owner only) ---------------- */
function renderReports(){
  if(state.reportTripView && state.reportIslandView) return renderReportIslandDetail();
  if(state.reportTripView) return renderReportTripIslands();

  const panel = document.getElementById('panel');
  const invoiced = state.shipments.filter(s => s.items && s.items.length && !s.voided && s.paid);
  const totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const todayStart = startOfToday(), weekStart = startOfWeek();
  const revToday = invoiced.filter(s => new Date(s.paidAt) >= todayStart).reduce((sum,s)=>sum+(s.total||0),0);
  const revWeek = invoiced.filter(s => new Date(s.paidAt) >= weekStart).reduce((sum,s)=>sum+(s.total||0),0);

  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);

  const finishedTrips = (state.trips||[]).filter(t => t.finished).sort((a,b) => new Date(b.finishedAt) - new Date(a.finishedAt));

  panel.innerHTML = `
    <h2>Revenue Reports</h2>
    <p class="sub">Owner-only view. Revenue reflects collected (paid) payments only.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
      <div class="stat-card"><div class="slabel">This Week</div><div class="sval">${fmtMoney(revWeek)}</div></div>
      <div class="stat-card"><div class="slabel">Today</div><div class="sval">${fmtMoney(revToday)}</div></div>
      <div class="stat-card"><div class="slabel">Shipments Logged</div><div class="sval">${state.shipments.length}</div></div>
    </div>
    <div class="settings-block">
      <h3>By Destination Island</h3>
      ${islandRows.length === 0 ? '<div class="empty">No invoiced shipments yet.</div>' : `
        <div class="invoice" style="padding:14px 18px;">
          <table>
            <thead><tr><th>Island</th><th class="num">Shipments</th><th class="num">Revenue</th></tr></thead>
            <tbody>
              ${islandRows.map(isl => `<tr><td>${escapeHtml(isl)}</td><td class="num">${byIsland[isl].count}</td><td class="num">${fmtMoney(byIsland[isl].revenue)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
    <div class="settings-block">
      <h3>Trip Reports</h3>
      <p class="sub" style="margin-bottom:12px;">Finished trips. Select one to see delivered/undelivered by destination island.</p>
      <div id="trip-report-list"></div>
    </div>
  `;

  const listEl = panel.querySelector('#trip-report-list');
  if(finishedTrips.length === 0){
    listEl.innerHTML = `<div class="empty">No finished trips yet.</div>`;
    return;
  }
  listEl.innerHTML = finishedTrips.map(t => {
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    const delivered = tripShipments.filter(s => s.status === 'delivered').length;
    const undelivered = tripShipments.length - delivered;
    const unpaid = tripShipments.filter(s => !s.paid).length;
    return `
      <div style="display:flex;gap:8px;align-items:stretch;margin-bottom:8px;">
        <button type="button" class="item-result-row" data-open-trip="${t.id}" style="flex:1;margin-bottom:0;">
          <span>${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} \u00b7 ${fmtDMY(t.date)}</span>
          <span class="rprice">${delivered} delivered \u00b7 ${undelivered} undelivered \u00b7 ${unpaid} unpaid</span>
        </button>
      </div>
    `;
  }).join('');
  listEl.querySelectorAll('[data-open-trip]').forEach(b => b.addEventListener('click', () => {
    state.reportTripView = b.dataset.openTrip;
    state.reportIslandView = null;
    renderReports();
  }));
}

// Filenames use both parties' name + mobile, sanitized for the filesystem.
function safeFilenamePart(str){
  return (str||'').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'') || 'unknown';
}
function photoFilename(s){
  const senderPart = `${safeFilenamePart(s.name)}-${safeFilenamePart(s.mobile)}`;
  const receiverPart = `${safeFilenamePart(s.receiverName)}-${safeFilenamePart(s.receiverMobile)}`;
  return `${senderPart}_${receiverPart}.jpg`;
}
// Shows the photo as a tappable filename link rather than an inline image --
// nobody has to scroll past a photo they didn't ask to see; tapping opens it
// in a new tab to actually view/save it.
function photoLinkHtml(s){
  if(!s.photo) return '';
  return `<a href="${s.photo}" target="_blank" rel="noopener" class="party-phone" style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;">\ud83d\udcf7 ${escapeHtml(photoFilename(s))}</a>`;
}
function downloadPhoto(s){
  if(!s.photo) return;
  const a = document.createElement('a');
  a.href = s.photo;
  a.download = photoFilename(s);
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function downloadDataUrl(dataUrl, filename){
  if(!dataUrl) return;
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // iOS Safari often ignores the download attribute for data URLs and just
  // navigates instead -- opening it in a new tab too means there's always a
  // way to save it (long-press -> Save Image) even if the click above does
  // nothing visible.
  window.open(dataUrl, '_blank');
}

// Trip manifest export -- a plain CSV of every cargo item on the trip,
// saved straight to the device (owner or manager, whoever marks the trip
// in transit). No external service involved, just a browser download.
function csvEscape(val){
  const s = String(val == null ? '' : val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function buildTripManifestCSV(shipments){
  const header = ['Tracking Code','Sender Name','Sender Mobile','Receiver Name','Receiver Mobile','Destination Island','Items','Total','Payment Status','Delivery Status'];
  const rows = shipments.map(s => {
    const items = (s.items||[]).map(i => `${i.qty}x ${i.name}`).join('; ');
    return [s.id, s.name, s.mobile, s.receiverName||'', s.receiverMobile||'', s.island, items, s.total||0, s.paid?'Paid':'Unpaid', s.status];
  });
  return [header, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
}
function downloadTripManifest(trip, shipments){
  if(!shipments.length) return;
  const csv = buildTripManifestCSV(shipments);
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM so Excel opens it correctly
  const url = URL.createObjectURL(blob);
  const rawName = `${trip.origin}-to-${(trip.destinations||[]).join('-')}-${trip.date}-manifest.csv`;
  const filename = rawName.replace(/[^a-zA-Z0-9.\-]+/g, '_');
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ---------------- Settings (owner only) ---------------- */
const SETTINGS_SUBTABS = [
  {id:'owner', label:'Owner Settings'},
  {id:'staff', label:'Staff Management'},
  {id:'trip', label:'Trip Settings'},
  {id:'rates', label:'Rates & Setup'},
];
// Managers get full run of the boat except account details (Owner Settings
// -- payment info, links) and the item list (Rates & Setup).
const MANAGER_SETTINGS_SUBTABS = ['staff', 'trip'];

function renderSettings(){
  const panel = document.getElementById('panel');
  const isManager = state.role === 'manager';
  const visibleSubtabs = isManager ? SETTINGS_SUBTABS.filter(t => MANAGER_SETTINGS_SUBTABS.includes(t.id)) : SETTINGS_SUBTABS;
  if(!visibleSubtabs.some(t => t.id === state.settingsTab)) state.settingsTab = visibleSubtabs[0].id;
  const subtabs = visibleSubtabs.map(t =>
    `<button class="${t.id===state.settingsTab?'active':''}" data-subtab="${t.id}">${t.label}</button>`
  ).join('');
  panel.innerHTML = `
    <h2>Settings</h2>
    <p class="sub">${isManager ? 'Manager access. Staff and trip settings for this boat.' : 'Owner-only. Manage staff access, item prices, and app links.'}</p>
    <div class="sub-tabs">${subtabs}</div>
    <div id="settings-body"></div>
  `;
  panel.querySelectorAll('[data-subtab]').forEach(b => b.addEventListener('click', () => {
    state.settingsTab = b.dataset.subtab;
    renderSettings();
  }));

  if(state.settingsTab === 'owner' && !isManager) renderOwnerSettings();
  else if(state.settingsTab === 'staff') renderStaffManagement();
  else if(state.settingsTab === 'trip') renderTripSettings();
  else if(!isManager) renderRatesSetup();
}

function staffShareMessage(name, pin, staffUrl, username){
  return `Hi ${name}, here's your GreenLine Cargo staff sign-in.${username ? `\nUsername: ${username}` : ''}\nPIN: ${pin}\nSign in here: ${staffUrl}`;
}

function openStaffSharePanel(name, pin, staffUrl, username){
  const msg = staffShareMessage(name, pin, staffUrl, username);
  const encoded = encodeURIComponent(msg);
  const wrap = document.createElement('div');
  wrap.style.position = 'fixed';
  wrap.style.inset = '0';
  wrap.style.background = 'rgba(0,0,0,0.45)';
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.justifyContent = 'center';
  wrap.style.zIndex = '9999';
  wrap.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:18px;max-width:320px;width:90%;">
      <h3 style="margin-bottom:8px;">Share PIN with ${escapeHtml(name)}</h3>
      <p class="sub" style="margin-bottom:14px;">Choose how to send the sign-in PIN and staff link.</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" id="share-whatsapp-btn" style="background:#25D366;border-color:#25D366;">Share via WhatsApp</button>
        <button class="btn btn-primary" id="share-viber-btn" style="background:#7360F2;border-color:#7360F2;">Share via Viber</button>
        <button class="btn btn-ghost" id="share-close-btn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('share-whatsapp-btn').addEventListener('click', () => {
    window.open(`https://wa.me/?text=${encoded}`, '_blank');
    wrap.remove();
  });
  document.getElementById('share-viber-btn').addEventListener('click', () => {
    window.open(`viber://forward?text=${encoded}`, '_blank');
    wrap.remove();
  });
  document.getElementById('share-close-btn').addEventListener('click', () => wrap.remove());
  wrap.addEventListener('click', (e) => { if(e.target === wrap) wrap.remove(); });
}

async function loadGoogleSheetsStatus(){

    if(!document.getElementById('google-sheets-status')) return; // navigated away
    if(!data.configured){

        fetch(`${API_BASE}/api/google/disconnect`, {

function openQrScanner(){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column;';
  overlay.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
      <span style="color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;">Scan Boat QR Code</span>
      <button id="qr-scan-close" style="background:none;border:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;">\u00d7</button>
    </div>
    <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <video id="qr-scan-video" autoplay playsinline muted style="max-width:100%;max-height:100%;"></video>
      <div style="position:absolute;width:70%;aspect-ratio:1;border:2px solid var(--teal-light);border-radius:12px;pointer-events:none;"></div>
    </div>
    <div id="qr-scan-status" style="color:rgba(255,255,255,0.75);text-align:center;padding:14px;font-size:13.5px;">Point your camera at the boat's QR code.</div>
  `;
  document.body.appendChild(overlay);

  const video = overlay.querySelector('#qr-scan-video');
  const statusEl = overlay.querySelector('#qr-scan-status');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let stream = null;
  let stopped = false;

  const cleanup = () => {
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    overlay.remove();
  };
  overlay.querySelector('#qr-scan-close').addEventListener('click', cleanup);

  const tick = () => {
    if(stopped) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = typeof jsQR === 'function' ? jsQR(imageData.data, imageData.width, imageData.height) : null;
      if(code && code.data){
        statusEl.textContent = 'Got it \u2014 opening...';
        try{
          const url = new URL(code.data, location.href);
          if(url.origin === location.origin){
            cleanup();
            location.hash = url.hash.replace('#','');
            return;
          }
        }catch(e){ /* not a valid URL, fall through */ }
        statusEl.textContent = "That doesn't look like a Ferry Cargo Log QR code. Try again.";
      }
    }
    requestAnimationFrame(tick);
  };

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(s => {
      stream = s;
      video.srcObject = s;
      requestAnimationFrame(tick);
    })
    .catch(() => {
      statusEl.textContent = "Couldn't access the camera. Check your browser's camera permission for this site.";
    });
}

async function adminFetch(path, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const creds = { username: state.adminUsername, passkey: state.adminPasskey };
  let url = `${API_BASE}${path}`;
  let body;
  if(method === 'GET'){
    url += (path.includes('?') ? '&' : '?') + `username=${encodeURIComponent(creds.username)}&passkey=${encodeURIComponent(creds.passkey)}`;
  } else {
    body = JSON.stringify(Object.assign({}, opts.body || {}, creds));
  }
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body });
  const data = await res.json().catch(() => ({}));
  if(res.status === 401){ state.adminAuthed = false; clearAdminSession(); state.adminError = 'Session expired. Log in again.'; renderAdmin(); throw new Error('unauthorized'); }
  return data;
}

              ${(o.boats||[]).map(b => `
                <div class="item-result-row" style="margin-bottom:6px;flex-wrap:wrap;">
                  <span>${escapeHtml(b.name)}${b.is_primary ? ' (primary)' : ''}</span>

                    <button class="btn btn-ghost" style="flex:1;padding:7px 10px;font-size:12px;" data-boat-toggle-suspend="${b.id}" data-suspended="${b.status==='suspended'}">${b.status==='suspended' ? 'Unsuspend' : 'Suspend'}</button>
                    <button class="btn btn-danger" style="flex:1;padding:7px 10px;font-size:12px;" data-boat-delete="${b.id}">Delete</button>
                  </div>
                </div>
              `).join('') || '<div class="empty">No boats yet.</div>'}
            </div>

            <div style="display:flex;gap:8px;margin-top:14px;">
              <button class="btn btn-ghost" style="flex:1;" data-org-toggle-suspend="${o.id}" data-suspended="${o.status==='suspended'}">${o.status==='suspended' ? 'Unsuspend Organization' : 'Suspend Organization'}</button>
              <button class="btn btn-danger" style="flex:1;" data-org-delete="${o.id}">Delete Organization</button>
            </div>
          </div>
        `;

        document.getElementById('admin-org-back-btn').addEventListener('click', () => {
          state.adminOrgDetailId = null;
          state.adminRevealedTotp = null;
          renderAdminDashboard();
        });
        body.querySelectorAll('[data-admin-toggle-totp]').forEach(btn => btn.addEventListener('click', () => {
          const id = btn.dataset.adminToggleTotp;
          state.adminRevealedTotp = state.adminRevealedTotp === id ? null : id;
          renderAdminDashboard();
        }));
        body.querySelectorAll('[data-org-toggle-suspend]').forEach(btn => btn.addEventListener('click', () => {
          const id = btn.dataset.orgToggleSuspend;
          const isSuspended = btn.dataset.suspended === 'true';
          confirmAdminAction(isSuspended ? 'Unsuspend organization' : 'Suspend organization', async (note) => {
            await adminFetch(`/api/admin/organizations/${id}/${isSuspended ? 'unsuspend' : 'suspend'}`, { method:'POST', body:{ note } });
            state.adminOrgs = null;
            renderAdminDashboard();
          }, !isSuspended);
        }));
        body.querySelectorAll('[data-org-delete]').forEach(btn => btn.addEventListener('click', () => {
          const id = btn.dataset.orgDelete;
          confirmAdminAction('Permanently delete organization (cannot be undone)', async () => {
            await adminFetch(`/api/admin/organizations/${id}`, { method:'DELETE' });
            state.adminOrgs = null;
            state.adminOrgDetailId = null;
            renderAdminDashboard();
          });
        }));
        body.querySelectorAll('[data-boat-toggle-suspend]').forEach(btn => btn.addEventListener('click', () => {
          const id = btn.dataset.boatToggleSuspend;
          const isSuspended = btn.dataset.suspended === 'true';
          confirmAdminAction(isSuspended ? 'Unsuspend boat' : 'Suspend boat', async (note) => {
            await adminFetch(`/api/admin/boats/${id}/${isSuspended ? 'unsuspend' : 'suspend'}`, { method:'POST', body:{ note } });
            state.adminOrgs = null;
            renderAdminDashboard();
          }, !isSuspended);
        }));
        body.querySelectorAll('[data-boat-delete]').forEach(btn => btn.addEventListener('click', () => {
          const id = btn.dataset.boatDelete;
          confirmAdminAction('Permanently delete boat (cannot be undone)', async () => {
            await adminFetch(`/api/admin/boats/${id}`, { method:'DELETE' });
            state.adminOrgs = null;
            renderAdminDashboard();
          });
        }));
        return;
      }

      // Compact list -- tap an organization to drill into its details.
      body.innerHTML = orgs.length === 0 ? `<div class="empty">No organizations yet. This phase only manages data \u2014 owner self-signup comes in a later phase.</div>` : orgs.map(o => `
        <button type="button" class="settings-block" data-open-org="${o.id}" style="display:block;width:100%;text-align:left;cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div>
              <h3 style="margin-bottom:4px;">${escapeHtml(o.boat_name)} \u2192</h3>
              <p class="sub" style="margin-bottom:8px;">${escapeHtml(o.owner_name)}</p>
            </div>
            <span class="status-pill ${o.status==='suspended'?'status-in_transit':'status-delivered'}">${escapeHtml(o.status)}</span>
          </div>
          <div class="tag-label" style="font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;margin-bottom:4px;">Boats (${(o.boats||[]).length})</div>
          ${(o.boats||[]).length ? (o.boats||[]).map(b => `<div class="tag-meta" style="margin-bottom:2px;">\u2022 ${escapeHtml(b.name)}${b.is_primary?' (primary)':''} \u2014 ${escapeHtml(b.status)}</div>`).join('') : '<div class="tag-meta">No boats yet.</div>'}
        </button>
      `).join('');

      body.querySelectorAll('[data-open-org]').forEach(btn => btn.addEventListener('click', () => {
        state.adminOrgDetailId = btn.dataset.openOrg;
        renderAdminDashboard();
      }));
    })();
  } else {
    (async () => {
      if(state.adminRequests === null) await loadAdminRequests();
      if(!document.getElementById('admin-body')) return;
      const reqs = state.adminRequests || [];
      body.innerHTML = reqs.length === 0 ? `<div class="empty">No boat requests yet.</div>` : reqs.map(r => `
        <div class="settings-block">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3 style="margin-bottom:4px;">${escapeHtml(r.requested_boat_name)}</h3>
              <p class="sub" style="margin-bottom:8px;">For ${escapeHtml(r.owner_name)} (${escapeHtml(r.org_boat_name)}) \u00b7 ${fmtDate(r.created_at)}</p>
            </div>
            <span class="status-pill ${r.status==='approved'?'status-delivered':r.status==='rejected'?'status-in_transit':''}">${escapeHtml(r.status)}</span>
          </div>
          ${r.payment_screenshot ? `<img src="${r.payment_screenshot}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;">` : `<p class="sub" style="margin-bottom:10px;">No payment screenshot attached.</p>`}
          ${r.status === 'pending' ? `
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" data-approve="${r.id}" ${state.adminBusyId===r.id?'disabled':''} style="flex:1;">Approve</button>
              <button class="btn btn-danger" data-reject="${r.id}" ${state.adminBusyId===r.id?'disabled':''} style="flex:1;">Reject</button>
            </div>
          ` : r.admin_note ? `<p class="sub">Note: ${escapeHtml(r.admin_note)}</p>` : ''}
        </div>
      `).join('');
      body.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
        const id = b.dataset.approve;
        const reqRow = (state.adminRequests||[]).find(r => r.id === id);
        if(reqRow && reqRow.payment_screenshot){
          const proceed = confirm('Approving will download the payment screenshot to this device, then permanently delete it from the database. Continue?');
          if(!proceed) return;
        }
        state.adminBusyId = id; renderAdminDashboard();
        try{
          const data = await adminFetch(`/api/admin/boat-requests/${id}/approve`, { method:'POST' });
          if(data && data.paymentScreenshot){
            downloadDataUrl(data.paymentScreenshot, `payment-slip-${(data.requestedBoatName||'boat').replace(/[^a-z0-9]+/gi,'-')}.jpg`);
          }
        }
        catch(e){ console.error(e); }
        state.adminBusyId = null; state.adminRequests = null; state.adminOrgs = null;
        renderAdminDashboard();
      }));
      body.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
        const note = prompt('Reason for rejecting (optional):') || '';
        state.adminBusyId = b.dataset.reject; renderAdminDashboard();
        try{ await adminFetch(`/api/admin/boat-requests/${b.dataset.reject}/reject`, { method:'POST', body:{ note } }); }
        catch(e){ console.error(e); }
        state.adminBusyId = null; state.adminRequests = null;
        renderAdminDashboard();
      }));
    })();
  }
}

const SIGNUP_FIELD_IDS = ['su-boat-name','su-owner-name','su-contact','su-mobile','su-gmail','su-bank-name','su-bank-number','su-routes','su-tracking','su-viber','su-social','su-passkey'];
function clearFieldErrors(ids){ ids.forEach(id => document.getElementById(id)?.classList.remove('field-error')); }
function markFieldError(id, clearValue){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('field-error');
  if(clearValue) el.value = '';
}

async function submitSignup(){
  const val = (id) => (document.getElementById(id).value || '').trim();
  const errorEl = document.getElementById('su-error');
  const btn = document.getElementById('su-submit-btn');
  clearFieldErrors(SIGNUP_FIELD_IDS);

  const body = {
    boatName: val('su-boat-name'),
    ownerName: val('su-owner-name'),
    contactNumber: val('su-contact'),
    mobile: val('su-mobile'),
    gmail: val('su-gmail'),
    bankAccountName: val('su-bank-name'),
    bankAccountNumber: val('su-bank-number'),
    routes: val('su-routes').split('\n').map(s=>s.trim()).filter(Boolean),
    trackingLink: val('su-tracking'),
    viberLink: val('su-viber'),
    socialLinks: val('su-social').split('\n').map(s=>s.trim()).filter(Boolean),
    passkey: val('su-passkey'),
  };

  const requiredMap = { boatName:'su-boat-name', ownerName:'su-owner-name', contactNumber:'su-contact', mobile:'su-mobile', passkey:'su-passkey' };
  const missing = Object.keys(requiredMap).filter(k => !body[k]);
  if(missing.length){
    missing.forEach(k => markFieldError(requiredMap[k], false));
    errorEl.textContent = 'Please fill in all fields marked *.';
    return;
  }
  if(body.passkey.length < 6){
    markFieldError('su-passkey', true);
    errorEl.textContent = 'PIN must be at least 6 characters.';
    return;
  }

  errorEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Creating\u2026';
  try{
    const res = await fetch(`${API_BASE}/api/signup`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    btn.disabled = false; btn.textContent = 'Create My Boat';
    if(res.ok && data.ok){
      state.orgSignupTotpSecret = data.totpSecret;
      state.orgAuthed = true;
      state.orgPasskey = body.passkey;
      state.orgData = {
        id: data.organizationId, boatName: body.boatName, ownerName: body.ownerName,
        contactNumber: body.contactNumber, gmail: body.gmail, mobile: body.mobile,
        bankAccountName: body.bankAccountName, bankAccountNumber: body.bankAccountNumber,
        trackingLink: body.trackingLink, viberLink: body.viberLink,
        socialLinks: body.socialLinks, routes: body.routes,
      };
      state.orgBoats = [{ id: data.boatId, name: body.boatName, is_primary: true, status: 'active' }];
      renderOrgArea();
    } else {
      const msg = (data && data.error) || 'Could not create your account.';
      errorEl.textContent = msg;
      if(/boat name/i.test(msg)) markFieldError('su-boat-name', true);
    }
  }catch(e){
    console.error('signup failed', e);
    btn.disabled = false; btn.textContent = 'Create My Boat';
    errorEl.textContent = 'Something went wrong. Try again.';
  }
}

function renderOrgLogin(){
  const area = document.getElementById('gate-area');
  area.innerHTML = `
    <div class="gate-wrap">
      <div class="pin-box">
        <div class="rname">Owner Login</div>
        <label style="text-align:left;display:block;margin-bottom:4px;">Username (your first boat's name)</label>
        <input type="text" id="ol-boat-name" style="text-align:left;letter-spacing:normal;font-family:inherit;font-size:14px;">
        <label style="text-align:left;display:block;margin:10px 0 4px;">Password</label>
        <input type="password" id="ol-passkey" style="text-align:left;letter-spacing:normal;font-family:inherit;font-size:14px;">
        <div style="text-align:left;margin:-4px 0 4px;"><a href="javascript:void(0)" id="ol-forgot-link" style="text-decoration:underline;color:var(--navy-deep);font-size:13px;">Forgot password?</a></div>
        <div class="pin-error" id="ol-error">${escapeHtml(state.orgError || '')}</div>
        <button class="btn btn-primary" id="ol-submit-btn" style="width:100%;margin:10px 0;">Log In</button>
        <button class="btn btn-ghost" id="ol-signup-instead-btn" style="width:100%;margin-bottom:8px;">New here? Register your boat</button>
        <button class="btn btn-ghost" id="ol-back-btn" style="width:100%;">Back</button>
      </div>
    </div>
  `;
  document.getElementById('ol-boat-name').focus();
  document.getElementById('ol-forgot-link').addEventListener('click', () => {
    state.orgForgotBoatName = document.getElementById('ol-boat-name').value.trim();
    renderOrgForgotPassword();
  });
  const submit = async () => {
    const errorEl = document.getElementById('ol-error');
    const btn = document.getElementById('ol-submit-btn');
    clearFieldErrors(['ol-boat-name','ol-passkey']);
    const boatName = document.getElementById('ol-boat-name').value.trim();
    const passkey = document.getElementById('ol-passkey').value;
    if(!boatName) markFieldError('ol-boat-name', false);
    if(!passkey) markFieldError('ol-passkey', false);
    if(!boatName || !passkey){ errorEl.textContent = 'Enter your username and password.'; return; }
    errorEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Logging in\u2026';
    try{
      const res = await fetch(`${API_BASE}/api/org-login`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ boatName, passkey })
      });
      const data = await res.json().catch(() => ({}));
      btn.disabled = false; btn.textContent = 'Log In';
      if(res.ok && data.ok){
        state.orgAuthed = true; state.orgPasskey = passkey;
        state.orgData = data.organization; state.orgBoats = data.boats || [];
        renderOrgArea();
      } else {
        if(res.status === 403){
          errorEl.textContent = '';
          showMessageBox('Account Suspended', (data && data.note) ? `${data.error}\n\nReason given: "${data.note}"` : ((data && data.error) || 'This account has been suspended.'));
        } else {
          errorEl.textContent = (data && data.error) || 'Login failed.';
        }
        markFieldError('ol-boat-name', false);
        markFieldError('ol-passkey', true);
      }
    }catch(e){
      console.error('org login failed', e);
      btn.disabled = false; btn.textContent = 'Log In';
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  };
  document.getElementById('ol-submit-btn').addEventListener('click', submit);
  document.getElementById('ol-passkey').addEventListener('keydown', (e) => { if(e.key==='Enter') submit(); });
  document.getElementById('ol-signup-instead-btn').addEventListener('click', () => { state.orgScreen = 'signup'; state.orgError=''; renderOrgArea(); });
  document.getElementById('ol-back-btn').addEventListener('click', orgBackToStart);
}

function renderOrgForgotPassword(){
  const area = document.getElementById('gate-area');
  area.innerHTML = `

        <p class="note" style="margin-top:0;text-align:left;">Enter your boat name and the 6-digit code currently shown in your authenticator app.</p>

    try{
      const res = await fetch(`${API_BASE}/api/org-reset/totp-verify`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ boatName, code })
      });
      const data = await res.json().catch(() => ({}));
      btn.disabled = false; btn.textContent = 'Verify Code';
      if(res.ok && data.ok && data.token){
        state.orgResetToken = data.token;
        state.orgForgotBoatName = '';

      } else {
        errorEl.textContent = (data && data.error) || 'That code is incorrect or expired.';
        markFieldError('ofp-code', true);
      }
    }catch(e){
      console.error('org-reset totp-verify failed', e);
      btn.disabled = false; btn.textContent = 'Verify Code';
      errorEl.textContent = 'Something went wrong. Try again.';

  document.getElementById('ofp-back-btn').addEventListener('click', () => {
    state.orgForgotBoatName = '';
    state.orgScreen = 'login';
    renderOrgArea();
  });
}

        state.orgScreen = 'login';
        state.orgError = 'Password updated. Log in with your new password.';
        renderOrgArea();
      } else {
        btn.disabled = false; btn.textContent = 'Save Password';
        errorEl.textContent = (data && data.error) || 'That link is invalid or expired. Request a new one.';
      }
    }catch(e){
      console.error('org-reset confirm failed', e);
      btn.disabled = false; btn.textContent = 'Save Password';
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  });
}

function renderOrgDashboard(){

  const org = state.orgData || {};
  const boats = state.orgBoats || [];
  const justSignedUp = !!state.orgSignupTotpSecret;

  area.innerHTML = `
    <div style="max-width:600px;margin:0 auto;padding:20px 16px 60px;">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="margin:0;">${escapeHtml(org.boatName || '')}</h2>
          <button class="btn btn-ghost" id="org-logout-btn">Log out</button>
        </div>

        ${justSignedUp ? `
          <div class="note" style="margin-bottom:16px;">
            <strong>Save this authenticator secret now \u2014 it won't be shown again:</strong><br>
            <span class="mono" style="word-break:break-all;">${escapeHtml(state.orgSignupTotpSecret)}</span><br>
            Add it to an authenticator app (OneAuth, Google Authenticator, Authy) via "Enter setup key manually."
          </div>
        ` : ''}

        <div class="settings-block">
          <h3>Your Boats (${boats.length})</h3>
          ${boats.map(b => `
            ${b.status==='suspended' ? `
              <button type="button" class="item-result-row" data-view-suspend-reason="${b.id}" style="margin-bottom:6px;width:100%;text-align:left;opacity:0.75;">
                <span>${escapeHtml(b.name)}${b.is_primary?' (primary, free)':''}</span>
                <span class="rprice" style="color:var(--red);">Inactive</span>
              </button>
            ` : `
              <button type="button" class="item-result-row" data-open-dispatch="${b.id}" style="margin-bottom:6px;width:100%;text-align:left;">
                <span>${escapeHtml(b.name)}${b.is_primary?' (primary, free)':''}</span>
                <span class="rprice">${escapeHtml(b.status)} \u2192 Open App</span>
              </button>
            `}
          `).join('')}
          ${boats.length === 0 ? `
            <p class="sub" style="margin-bottom:10px;">You don't have a boat yet \u2014 your first one is free, no approval needed.</p>
            <label>Boat name</label>
            <input type="text" id="first-boat-name">
            <div class="pin-error" id="first-boat-error"></div>
            <button class="btn btn-primary" id="first-boat-submit-btn" style="width:100%;">+ Add Your Free Boat</button>
          ` : `
            <button class="btn btn-amber" id="request-boat-toggle-btn" style="margin-top:10px;">${state.boatRequestOpen ? 'Cancel' : '+ Request Additional Boat'}</button>
            ${state.boatRequestOpen ? `
              <div style="margin-top:14px;">
                <p class="sub">Additional boats require approval after payment. Enter a name for the new boat and attach a screenshot of your transfer.</p>
                <label>New boat name</label>
                <input type="text" id="req-boat-name">
                <label>Payment screenshot</label>
                <input type="file" id="req-boat-screenshot" accept="image/*">
                <div class="pin-error" id="req-boat-error">${escapeHtml(state.orgError || '')}</div>
                <button class="btn btn-primary" id="req-boat-submit-btn" style="width:100%;margin-top:8px;">Submit Request</button>
              </div>
            ` : ''}
          `}
        </div>

        <div class="settings-block">
          <h3>Account Details</h3>
          <div class="tag-meta">Owner: ${escapeHtml(org.ownerName||'\u2014')}</div>
          <div class="tag-meta">Boat Contact: ${org.contactNumber ? telLink(org.contactNumber) : '\u2014'}</div>
          <div class="tag-meta">Owner Mobile: ${org.mobile ? telLink(org.mobile) : '\u2014'}</div>
          <div class="tag-meta">Gmail: ${escapeHtml(org.gmail||'\u2014')}</div>
          <div class="tag-meta">Bank: ${escapeHtml(org.bankAccountName||'\u2014')} ${org.bankAccountNumber ? '\u00b7 '+escapeHtml(org.bankAccountNumber) : ''}</div>
          <div class="tag-meta">Tracking link: ${renderTruncatableLink('acct-tracking-link', org.trackingLink)}</div>
          <div class="tag-meta">Viber: ${renderTruncatableLink('acct-viber-link', org.viberLink)}</div>
        </div>

        <div class="note">Tap a boat above to open its full dispatch app \u2014 Dashboard, Trips, Invoices, Reports, and Settings, private to that boat.</div>
      </div>
    </div>
  `;

  wireTruncatableLinks(['acct-tracking-link', 'acct-viber-link']);
  document.getElementById('org-logout-btn').addEventListener('click', () => {
    state.orgAuthed = false; state.orgData = null; state.orgBoats = null; state.orgPasskey = '';
    state.orgSignupTotpSecret = null; state.boatRequestOpen = false; state.orgScreen = 'login';
    renderOrgArea();
  });
  document.querySelectorAll('[data-open-dispatch]').forEach(b => b.addEventListener('click', async () => {
    const boatId = b.dataset.openDispatch;
    CURRENT_BOAT_ID = boatId;
    await refreshData();
    state.entryMode = 'internal';
    state.gateRole = 'owner';
    state.role = 'owner';
    state.staffName = null;
    state.tab = DEFAULT_TAB.owner;
    saveSession('owner', 'owner', null, boatId);
    history.replaceState(null, '', '#' + OWNER_HASH + '/' + boatId);
    render();
  }));
  document.querySelectorAll('[data-view-suspend-reason]').forEach(b => b.addEventListener('click', () => {
    const boat = boats.find(x => x.id === b.dataset.viewSuspendReason);
    if(boat) renderBoatSuspendedPage(boat);
  }));
  document.getElementById('request-boat-toggle-btn')?.addEventListener('click', () => {
    state.boatRequestOpen = !state.boatRequestOpen; state.orgError = '';
    renderOrgDashboard();
  });
  document.getElementById('first-boat-submit-btn')?.addEventListener('click', async () => {
    const errorEl = document.getElementById('first-boat-error');
    const btn = document.getElementById('first-boat-submit-btn');
    clearFieldErrors(['first-boat-name']);
    const boatName = document.getElementById('first-boat-name').value.trim();
    if(!boatName){ markFieldError('first-boat-name', false); errorEl.textContent = 'Enter a name for your boat.'; return; }
    errorEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Adding\u2026';
    try{
      const res = await fetch(`${API_BASE}/api/boats/first-free`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ organizationId: org.id, passkey: state.orgPasskey, boatName })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok && data.ok){
        const refreshed = await fetch(`${API_BASE}/api/org-login`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ boatName: org.boatName, passkey: state.orgPasskey })
        }).then(r => r.json()).catch(() => null);
        if(refreshed && refreshed.ok) state.orgBoats = refreshed.boats || [];
        renderOrgDashboard();
      } else {
        btn.disabled = false; btn.textContent = '+ Add Your Free Boat';
        errorEl.textContent = (data && data.error) || 'Could not add your boat.';
        markFieldError('first-boat-name', false);
      }
    }catch(e){
      console.error('first-free boat failed', e);
      btn.disabled = false; btn.textContent = '+ Add Your Free Boat';
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  });
  document.getElementById('req-boat-submit-btn')?.addEventListener('click', async () => {
    const errorEl = document.getElementById('req-boat-error');
    const btn = document.getElementById('req-boat-submit-btn');
    clearFieldErrors(['req-boat-name']);
    const name = document.getElementById('req-boat-name').value.trim();
    const file = document.getElementById('req-boat-screenshot').files[0];
    if(!name){ markFieldError('req-boat-name', false); errorEl.textContent = 'Enter a name for the new boat.'; return; }
    errorEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Submitting\u2026';
    try{
      let screenshot = null;
      if(file) screenshot = await compressImageToDataUrl(file, 1000, 0.7);
      const res = await fetch(`${API_BASE}/api/boat-requests`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ organizationId: org.id, passkey: state.orgPasskey, requestedBoatName: name, paymentScreenshot: screenshot })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok && data.ok){
        state.boatRequestOpen = false;
        alert('Request submitted. It will be reviewed once your payment is confirmed.');
        renderOrgDashboard();
      } else {
        btn.disabled = false; btn.textContent = 'Submit Request';
        errorEl.textContent = (data && data.error) || 'Could not submit your request.';
        markFieldError('req-boat-name', false);
      }
    }catch(e){
      console.error('boat request failed', e);
      btn.disabled = false; btn.textContent = 'Submit Request';
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  });
}

/* ---------------- Routing ---------------- */
function handleHash(){
  const h = (location.hash || '').replace('#','');

  if(h === 'admin' || h.startsWith('admin/')){
    state.entryMode = 'admin';
    renderAdmin();
    return;
  }

  if(h === 'signup'){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'signup';
    renderOrgArea();
    return;
  }
  if(h === 'org' || h.startsWith('org/')){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'login';
    renderOrgArea();
    return;
  }

  if(h.startsWith('reset-pin/')){
    const token = decodeURIComponent(h.slice('reset-pin/'.length));
    state.entryMode = 'internal'; state.gateRole = 'owner'; state.role = null;
    state.gateStage = 'reset-confirm'; state.resetToken = token;
    state.resetMsg = ''; state.resetError = '';
    render();
    return;
  }

  if(h === OWNER_HASH || h.startsWith(OWNER_HASH + '/')){
    // The numeric Owner PIN gate is retired -- Owners authenticate
    // exclusively through #org (boat name + passkey) now, which is real
    // authentication rather than a light PIN gate. Any #owner link just
    // sends them to the real login screen.
    location.hash = 'org';
    return;
  }
  if(h === INTERNAL_HASH || h.startsWith(INTERNAL_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This staff link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'staff')){
      state.entryMode = 'internal'; state.gateRole = 'staff'; state.role = null; state.gateStage = 'pick'; state.gateMode = 'signin';
      if(switchingBoat) clearSession();
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }
  if(h === MANAGER_HASH || h.startsWith(MANAGER_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This manager link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'manager')){
      state.entryMode = 'internal'; state.gateRole = 'manager'; state.role = null; state.gateStage = 'pick';
      if(switchingBoat) clearSession();
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  // Customer entry (senders/receivers) is boat-scoped via #c/<boatId>, same
  // as owner/staff links -- each boat needs its own QR code / shared link
  // now that this is a multi-boat platform.
  if(h === 'c' || h.startsWith('c/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This link is missing a boat reference. Ask the boat owner for the correct customer check-in link.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    state.entryMode = 'customer';
    if(!state.role || switchingBoat){ state.role = 'sender'; state.tab = 'checkin'; }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  if(state.entryMode === 'internal' && INTERNAL_ROLES.includes(state.role)){
    if(ROLE_TABS[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    render();
    return;
  }

  // Continuing navigation within an already-active customer session (tab
  // clicks, mode toggle, etc all just set location.hash to a plain tab id).
  if(state.entryMode === 'customer' && state.role){
    if(ROLE_TABS[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }

  // Anything else unrecognized -- including the bare URL -- shows the
  // landing page rather than guessing at a boat to drop the visitor into.
  renderLandingPage();
}

window.addEventListener('hashchange', handleHash);

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString(undefined,{weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

async function init(){
  const session = loadSession();
  const rawHash = (location.hash || '').replace('#','');

  // Figure out which boat's data to load BEFORE fetching anything -- from
  // the URL if it names one (#owner/<boatId> or #staff/<boatId>), else from
  // a saved session, else the default fallback set above.
  let boatIdFromHash = null;
  if(rawHash.startsWith(OWNER_HASH + '/')) boatIdFromHash = rawHash.slice(OWNER_HASH.length + 1);
  else if(rawHash.startsWith(INTERNAL_HASH + '/')) boatIdFromHash = rawHash.slice(INTERNAL_HASH.length + 1);
  else if(rawHash.startsWith(MANAGER_HASH + '/')) boatIdFromHash = rawHash.slice(MANAGER_HASH.length + 1);
  else if(rawHash.startsWith('c/')) boatIdFromHash = rawHash.slice(2);
  if(boatIdFromHash) CURRENT_BOAT_ID = boatIdFromHash;
  else if(session && session.boatId) CURRENT_BOAT_ID = session.boatId;

  await refreshData();

  const initialHash = rawHash;
  if(initialHash === 'admin' || initialHash.startsWith('admin/')){
    state.entryMode = 'admin';
    const adminSession = loadAdminSession();
    if(adminSession && adminSession.username && adminSession.passkey){
      state.adminAuthed = true;
      state.adminUsername = adminSession.username;
      state.adminPasskey = adminSession.passkey;
    }
    renderAdmin();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  // A refresh should never log someone out. If we're about to show the
  // org login/landing screen but a valid owner session already exists for
  // a specific boat, resume straight into that boat's app instead.
  if((initialHash === 'org' || initialHash === '') && session && session.role === 'owner' && session.boatId){
    state.entryMode = 'internal';
    state.gateRole = 'owner';
    state.role = 'owner';
    state.staffName = null;
    state.tab = DEFAULT_TAB.owner;
    history.replaceState(null,'','#'+OWNER_HASH+'/'+session.boatId);
    render();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  if(initialHash === 'signup' || initialHash === 'org' || initialHash.startsWith('org/')){
    state.entryMode = 'org';
    state.orgScreen = initialHash === 'signup' ? 'signup' : 'login';
    renderOrgArea();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  const isResetLink = rawHash.startsWith('reset-pin/');
  // A stored session must only auto-log-in if it's for the SAME boat being
  // requested -- otherwise clicking someone else's #owner/<boatId> link
  // while already signed into a different boat would silently grant owner
  // access to that other boat without ever checking its PIN.
  const sessionMatchesRequestedBoat = !boatIdFromHash || (session && session.boatId === boatIdFromHash);
  if(!isResetLink && session && (session.role === 'owner' || session.role === 'staff' || session.role === 'manager') && sessionMatchesRequestedBoat){
    // Re-check the session still makes sense (e.g. a staff/manager PIN
    // could have been removed from another device while this one stayed
    // logged in).
    const stillValid = session.role === 'owner'
      ? true
      : session.role === 'manager'
        ? !session.staffName || (state.settings.managerUsers||[]).some(u => u.name === session.staffName)
        : !session.staffName || (state.settings.staffUsers||[]).some(u => u.name === session.staffName);
    if(stillValid){
      state.entryMode = 'internal';
      state.gateRole = session.gateRole || session.role;
      state.role = session.role;
      state.staffName = session.staffName;
      const h = rawHash;
      const tabs = ROLE_TABS[state.role].map(t => t.id);
      state.tab = tabs.includes(h) ? h : DEFAULT_TAB[state.role];
      if(('#'+state.tab) !== location.hash) history.replaceState(null,'','#'+state.tab);
      render();
    } else {
      clearSession();
      handleHash();
    }
  } else {
    if(!sessionMatchesRequestedBoat) clearSession();
    handleHash();
  }

  tickClock();
  setInterval(tickClock, 30000);
  setInterval(async () => {
    const [freshShipments, freshSettings] = await Promise.all([loadShipments(), loadSettings()]);
    const shipmentsChanged = JSON.stringify(freshShipments) !== JSON.stringify(state.shipments);
    const settingsChanged = JSON.stringify(freshSettings) !== JSON.stringify(state.settings);
    if(shipmentsChanged) state.shipments = freshShipments;
    if(settingsChanged) state.settings = freshSettings;
    if(shipmentsChanged || settingsChanged){
      const typingInField = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.getElementById('panel').contains(document.activeElement);
      const hasOpenForm = typingInField || state.addCustomerOpen;
      if(state.role && !hasOpenForm && (state.tab === 'dashboard' || state.tab === 'track' || state.tab === 'reports' || state.tab === 'settings')){ render(); }
      else if(state.role){ renderTabs(); }
    }
  }, 5000);
}
init();
</script>
