/* ---------------- Nav ---------------- */
function renderTabs(){
  const pending = state.shipments.filter(s => s.status === 'pending' && !isTripFinished(s.tripId)).length;
  const pendingStaffCount = (state.settings.pendingStaff || []).length;
  const el = document.getElementById('tabs');
  el.style.display = 'flex';
  const tabs = (ROLE_TABS[state.role] || []).filter(tb => tb.id !== 'settings');
  el.innerHTML = tabs.map(tb => {
    const active = tb.id === state.tab ? 'active' : '';
    let badge = '';
    if(tb.id === 'dashboard' && pending > 0) badge = `<span class="badge">${pending}</span>`;
    return `<button class="${active}" data-tab="${tb.id}">${tb.label}${badge}</button>`;
  }).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; }));

  const settingsBtn = document.getElementById('header-settings-btn');
  const hasSettingsTab = (ROLE_TABS[state.role] || []).some(tb => tb.id === 'settings');
  if(hasSettingsTab){
    settingsBtn.style.display = 'flex';
    settingsBtn.style.background = state.tab === 'settings' ? 'var(--amber)' : 'rgba(255,255,255,0.08)';
    const svgStroke = settingsBtn.querySelector('svg');
    if(svgStroke) svgStroke.setAttribute('stroke', state.tab === 'settings' ? 'var(--navy-deep)' : '#F6F1E7');
    if(pendingStaffCount > 0 && !settingsBtn.querySelector('.badge')){
      settingsBtn.style.position = 'relative';
      settingsBtn.insertAdjacentHTML('beforeend', `<span class="badge" style="position:absolute;top:-2px;right:-2px;">${pendingStaffCount}</span>`);
    } else if(pendingStaffCount === 0){
      settingsBtn.querySelector('.badge')?.remove();
    }
    settingsBtn.onclick = () => { location.hash = 'settings'; };
  } else {
    settingsBtn.style.display = 'none';
  }

  const pill = document.getElementById('role-pill');
  if(state.entryMode === 'internal'){
    pill.style.display = 'flex';
    const roleLabelEl = document.getElementById('role-label');
    const roleText = ROLES[state.role].name + (state.staffName ? ' \u00b7 ' + state.staffName : '');
    if(_boatNameCache[CURRENT_BOAT_ID]){
      roleLabelEl.textContent = `${_boatNameCache[CURRENT_BOAT_ID]} ${roleText}`;
    } else {
      roleLabelEl.textContent = roleText;
      getCurrentBoatName().then(name => {
        const el = document.getElementById('role-label');
        if(el) el.textContent = `${name} ${roleText}`;
      });
    }
        document.getElementById('switch-role-btn').onclick = logoutInternal;
  } else {
    pill.style.display = 'none';
  }
}

/* ---------------- Dashboard (owner + staff) ---------------- */
function renderDashboard(){
  const panel = document.getElementById('panel');
  const trips = state.trips || [];
  const hasOpenTrip = trips.some(t => !t.finished);
  // If every trip is finished (no new one started yet), the most recently
  // finished trip's still-undelivered shipments stay visible here for
  // everyone -- including staff, who only have Dashboard to work from --
  // instead of disappearing the moment the trip ends. As soon as the next
  // trip is created, this carry-over stops and Reports > Undelivered is
  // the place to find them.
  let carryOverTripId = null;
  if(!hasOpenTrip){
    const finishedTrips = trips.filter(t => t.finished).sort((a,b) => new Date(b.finishedAt||0) - new Date(a.finishedAt||0));
    if(finishedTrips.length > 0) carryOverTripId = finishedTrips[0].id;
  }
  const active = state.shipments.filter(s => {
    if(!isTripFinished(s.tripId)) return true;
    return s.tripId === carryOverTripId && s.status !== 'delivered';
  });
  const carryOverCount = carryOverTripId ? active.filter(s => s.tripId === carryOverTripId).length : 0;
  // Effective filter category per shipment -- a carried-over shipment (its
  // trip already ended, still not delivered) is its own "undelivered"
  // bucket, separate from in_transit, so it doesn't get lost among items
  // still genuinely moving on an active trip.
  const filterCategory = (s) => (carryOverTripId && s.tripId === carryOverTripId && s.status !== 'delivered') ? 'undelivered' : s.status;
  const filtered = state.dashSearchOpenId
    ? state.shipments.filter(s => s.id === state.dashSearchOpenId)
    : active
        .filter(s => state.dashIslandView ? s.island === state.dashIslandView : (state.filter === 'all' ? true : filterCategory(s) === state.filter))
        .sort((a,b) => lastActivityTime(b) - lastActivityTime(a));

  const counts = {
    all: active.length,
    pending: active.filter(s=>filterCategory(s)==='pending').length,
    loaded: active.filter(s=>filterCategory(s)==='loaded').length,
    in_transit: active.filter(s=>filterCategory(s)==='in_transit').length,
    delivered: active.filter(s=>filterCategory(s)==='delivered').length,
    undelivered: active.filter(s=>filterCategory(s)==='undelivered').length,
  };

  // Only trips that haven't departed yet are open for adding a customer --
  // once a trip is marked In Transit, its manifest is locked and new
  // customers can no longer be attached to it. Every non-finished,
  // non-departed trip is a valid route to add a manual customer onto --
  // never guess which one; ask. A shipment silently auto-attached to
  // "whatever's active" can otherwise end up tied to a trip that finishes
  // before the item is ever loaded, and vanish into Reports with no way to
  // act on it. If no trip exists at all, there's no route to pick from, so
  // this is Owner-only and the route is described by hand instead.
  const availableTrips = (state.trips||[]).filter(t => !t.finished && !t.departed);
  const hasAnyOpenTrip = (state.trips||[]).some(t => !t.finished);
  const canAddCustomer = availableTrips.length > 0 || ((state.role === 'owner' || state.role === 'manager') && !hasAnyOpenTrip);

  let tripField = '';
  if(availableTrips.length > 0){
    tripField = `
      <label>Trip (which route is this for?)</label>
      <select id="ac-trip-select" required>
        ${availableTrips.map(t => `<option value="${t.id}">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} (${fmtDMY(t.date)})</option>`).join('')}
      </select>
      <label>Destination island</label>
      <select id="ac-island-select" required>
        <option value="" disabled selected>Select destination</option>
        <option value="__other">Other</option>
      </select>
      <input type="text" id="ac-island-other" placeholder="Type destination" style="display:none;">
    `;
  } else {
    tripField = `
      <div class="note" style="border-color:var(--red);color:var(--red);margin-bottom:12px;">No trip exists yet, so this customer won't be tied to one \u2014 describe the route by hand below. Once a trip is created, load their items onto it as normal.</div>
      <label>Origin</label>
      <input type="text" id="ac-origin" required placeholder="e.g. Male'">
      <label>Destination island</label>
      <input type="text" id="ac-island-other" required placeholder="e.g. Maafushi">
    `;
  }

  panel.innerHTML = `
    <h2>Dispatch Dashboard</h2>
    <p class="sub">Customer check-ins, loading log, and delivery status.</p>
    ${carryOverCount > 0 ? `<div class="note" style="margin-bottom:16px;">${carryOverCount} shipment(s) from the last trip are still undelivered \u2014 shown here until the next trip is created.</div>` : ''}
    ${canAddCustomer ? `<button class="btn btn-amber" id="toggle-add-customer-btn" style="margin-bottom:16px;">${state.addCustomerOpen ? 'Cancel' : '+ Add Customer'}</button>` : ''}
    ${state.addCustomerOpen && canAddCustomer ? `
      <div class="settings-block" style="border:1.5px solid var(--line);border-radius:10px;padding:16px;background:#fff;margin-bottom:16px;">
        <h3>Add Customer</h3>
        <label>Sender name</label>
        <input type="text" id="ac-name" required>
        <label>Sender mobile number</label>
        <input type="tel" id="ac-mobile" required>
        ${tripField}
        <label>Receiver's name</label>
        <input type="text" id="ac-rname" required>
        <div id="ac-rname-suggestions"></div>
        <label>Receiver's mobile number</label>
        <input type="tel" id="ac-rmobile" required>
        <label>Cargo note (optional)</label>
        <textarea id="ac-note" rows="2" placeholder="e.g. 3 sacks of rice, fragile"></textarea>
        <button class="btn btn-primary" id="ac-submit-btn">Add Customer</button>
      </div>
    ` : ''}
    <div class="filter-scroll-row">
      <span class="filter-chip ${state.filter==='all'?'active':''}" data-f="all">All (${counts.all})</span>
      <span class="filter-chip ${state.filter==='pending'?'active':''}" data-f="pending">Awaiting load (${counts.pending})</span>
      <span class="filter-chip ${state.filter==='loaded'?'active':''}" data-f="loaded">Loaded (${counts.loaded})</span>
      <span class="filter-chip ${state.filter==='in_transit'?'active':''}" data-f="in_transit">In Transit (${counts.in_transit})</span>
      <span class="filter-chip ${state.filter==='delivered'?'active':''}" data-f="delivered">Delivered (${counts.delivered})</span>
      ${counts.undelivered > 0 ? `<span class="filter-chip ${state.filter==='undelivered'?'active':''}" data-f="undelivered" style="border-color:var(--red);color:var(--red);">Undelivered (${counts.undelivered})</span>` : ''}
    </div>

    ${!state.dashSearchOpenId ? `
      <div class="settings-block" style="margin-bottom:16px;">
        <label>Search all shipments \u2014 name, mobile, or tracking code</label>
        <input type="text" id="dash-search-input" placeholder="e.g. Ahmed, 7712345, CF-260801-91H9" value="${escapeHtml(state.dashSearchQuery||'')}">
        <div id="dash-search-results"></div>
      </div>
    ` : ''}

    ${(!state.dashSearchQuery && !state.dashSearchOpenId) ? (() => {
      const islandCounts = {};
      active.forEach(s => { if(s.island){ islandCounts[s.island] = (islandCounts[s.island]||0) + 1; } });
      const islands = Object.keys(islandCounts).sort();
      return islands.length === 0 ? '' : `
        <div class="settings-block" style="margin-bottom:16px;">
          <h3>Islands</h3>
          <div class="filter-scroll-row">
            ${islands.map(isl => `<span class="filter-chip ${state.dashIslandView===isl?'active':''}" data-island="${escapeHtml(isl)}">${escapeHtml(isl)} (${islandCounts[isl]})</span>`).join('')}
          </div>
        </div>
      `;
    })() : ''}
    ${state.dashIslandView ? `<button class="btn btn-ghost" id="dash-island-back-btn" style="margin-bottom:12px;">\u2190 Back to all shipments</button>` : ''}
    ${state.dashSearchOpenId ? `<button class="btn btn-ghost" id="dash-search-back-btn" style="margin-bottom:12px;">\u2190 Back to search results</button>` : ''}

    <div id="list"></div>
  `;

  const openLoadId = Object.keys(state.loadingDraft).find(id => state.loadingDraft[id].open);
  const openLoadShipment = openLoadId ? state.shipments.find(x => x.id === openLoadId) : null;
  let modalHost = document.getElementById('load-modal-overlay');
  if(openLoadShipment){
    if(!modalHost){
      modalHost = document.createElement('div');
      modalHost.id = 'load-modal-overlay';
      modalHost.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:flex-end;justify-content:center;';
      document.body.appendChild(modalHost);
    }
    modalHost.innerHTML = `<div class="panel" style="max-height:92vh;overflow-y:auto;width:100%;max-width:600px;border-radius:16px 16px 0 0;margin:0;">${renderLoadForm(openLoadShipment)}</div>`;
    modalHost.onclick = (e) => { if(e.target === modalHost){ delete state.loadingDraft[openLoadId]; renderDashboard(); } };
  } else if(modalHost){
    modalHost.remove();
  }

  panel.querySelectorAll('.filter-chip[data-f]').forEach(c => c.addEventListener('click', () => { state.filter = c.dataset.f; state.dashIslandView = null; renderDashboard(); }));
  panel.querySelectorAll('[data-island]').forEach(c => c.addEventListener('click', () => {
    state.dashIslandView = state.dashIslandView === c.dataset.island ? null : c.dataset.island;
    renderDashboard();
  }));
  document.getElementById('dash-island-back-btn')?.addEventListener('click', () => { state.dashIslandView = null; renderDashboard(); });
  document.getElementById('dash-search-back-btn')?.addEventListener('click', () => { state.dashSearchOpenId = null; renderDashboard(); });

  const searchInput = document.getElementById('dash-search-input');
  const renderSearchResults = () => {
    const resultsEl = document.getElementById('dash-search-results');
    if(!resultsEl) return;
    const q = (state.dashSearchQuery||'').trim().toLowerCase();
    if(!q || state.dashSearchOpenId){ resultsEl.innerHTML = ''; return; }
    const matches = state.shipments.filter(s =>
      (s.name||'').toLowerCase().includes(q) ||
      (s.mobile||'').toLowerCase().includes(q) ||
      (s.receiverName||'').toLowerCase().includes(q) ||
      (s.receiverMobile||'').toLowerCase().includes(q) ||
      (s.id||'').toLowerCase().includes(q)
    ).slice(0, 30);
    resultsEl.innerHTML = matches.length === 0 ? `<div class="empty" style="margin-top:10px;">No matches.</div>` : `
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
        ${matches.map(s => `
          <button type="button" class="item-result-row" data-search-open="${s.id}" style="width:100%;text-align:left;">
            <span>${escapeHtml(s.name)} \u2192 ${escapeHtml(s.receiverName||'')}</span>
            <span class="rprice">${escapeHtml(s.island||'')}</span>
          </button>
        `).join('')}
      </div>
    `;
    resultsEl.querySelectorAll('[data-search-open]').forEach(b => b.addEventListener('click', () => {
      state.dashSearchOpenId = b.dataset.searchOpen;
      state.dashSearchQuery = '';
      renderDashboard();
    }));
  };
  searchInput?.addEventListener('input', () => {
    state.dashSearchQuery = searchInput.value;
    if(!state.dashSearchQuery){
      // Cleared -- back to the normal dashboard view (islands row, status
      // filters) instead of leaving a stale empty search state showing.
      renderDashboard();
    } else {
      renderSearchResults();
    }
  });
  renderSearchResults();
  

  document.getElementById('toggle-add-customer-btn')?.addEventListener('click', () => {
    state.addCustomerOpen = !state.addCustomerOpen;
    renderDashboard();
  });

  if(state.addCustomerOpen && canAddCustomer){
    const acTripSelect = document.getElementById('ac-trip-select');
    const acSelect = document.getElementById('ac-island-select');
    const acOther = document.getElementById('ac-island-other');

    document.getElementById('ac-mobile').addEventListener('blur', () => {
      runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
    });
    wireReceiverAutofill('ac-mobile', 'ac-rname', 'ac-rmobile', 'ac-rname-suggestions');

    const populateIslands = () => {
      if(!acSelect || !acTripSelect) return;
      const t = availableTrips.find(x => x.id === acTripSelect.value);
      const dests = t ? (t.destinations||[]) : [];
      const onlyOneDest = dests.length === 1;
      acSelect.innerHTML = `
        <option value="" disabled ${onlyOneDest ? '' : 'selected'}>Select destination</option>
        ${dests.map(d => `<option value="${escapeHtml(d)}" ${onlyOneDest ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('')}
        <option value="__other">Other</option>
      `;
      acOther.style.display = 'none'; acOther.required = false; acOther.value = '';
      runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
    };
    if(acTripSelect){ populateIslands(); acTripSelect.addEventListener('change', populateIslands); }

    if(acSelect){
      acSelect.addEventListener('change', () => {
        if(acSelect.value === '__other'){ acOther.style.display = 'block'; acOther.required = true; }
        else { acOther.style.display = 'none'; acOther.required = false; acOther.value=''; }
        runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
      });
    }
    if(acOther){
      acOther.addEventListener('blur', () => {
        runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
      });
    }
    document.getElementById('ac-submit-btn').addEventListener('click', async () => {
      try{
        const name = document.getElementById('ac-name').value.trim();
        const mobile = document.getElementById('ac-mobile').value.trim();
        const island = acSelect && acSelect.value && acSelect.value !== '__other' ? acSelect.value : (acOther.value||'').trim();
        const receiverName = document.getElementById('ac-rname').value.trim();
        const receiverMobile = document.getElementById('ac-rmobile').value.trim();
        const note = document.getElementById('ac-note').value.trim();
        const selectedTrip = acTripSelect ? availableTrips.find(x => x.id === acTripSelect.value) : null;
        const originInput = document.getElementById('ac-origin');
        if(!name || !mobile || !island || !receiverName || !receiverMobile){ alert('Fill in sender, receiver, and destination island.'); return; }
        if(availableTrips.length > 0 && !selectedTrip){ alert('Pick which trip this customer is for.'); return; }
        if(availableTrips.length === 0 && !(originInput && originInput.value.trim())){ alert('Enter the origin.'); return; }
        const code = trackingCode();
        const shipment = { id: code, name, mobile, island, receiverName, receiverMobile, note, status:'pending', items:[], total:0, tripId: selectedTrip ? selectedTrip.id : null, createdAt: new Date().toISOString() };
        await withFreshShipments(list => { list.push(shipment); });
        syncShipmentToSheet(shipment);
        state.addCustomerOpen = false;
        renderDashboard();
      }catch(err){
        console.error('Add Customer failed', err);
        alert('Something went wrong adding this customer. Please try again.');
      }
    });
  }

  const list = panel.querySelector('#list');
  if(filtered.length === 0){ list.innerHTML = `<div class="empty">No shipments here yet.</div>`; return; }
  list.innerHTML = filtered.map(s => renderTagCard(s, carryOverTripId && s.tripId === carryOverTripId && s.status !== 'delivered')).join('');

  list.querySelectorAll('[data-expand-shipment]').forEach(b => b.addEventListener('click', () => {
    state.expandedShipmentIds.add(b.dataset.expandShipment);
    renderDashboard();
  }));
  list.querySelectorAll('[data-collapse-shipment]').forEach(b => b.addEventListener('click', () => {
    state.expandedShipmentIds.delete(b.dataset.collapseShipment);
    renderDashboard();
  }));
  list.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => openLoadForm(b.dataset.load)));
  list.querySelectorAll('[data-deliver]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.deliver;
    const s = state.shipments.find(x => x.id === id);
    const arrived = activeTripArrivedIsland();
    // Only auto-detect a mismatch once the boat has actually been marked
    // arrived somewhere (Trips tab) -- otherwise every delivery would
    // trip the off-island popup before an arrival is even set.
    if(s && arrived && s.island !== arrived){
      openDeliverOtherPopup(id);
    } else {
      markDelivered(id);
    }
  }));
  list.querySelectorAll('[data-invoice]').forEach(b => b.addEventListener('click', () => {
    openInvoicePopup(b.dataset.invoice);
  }));
  list.querySelectorAll('[data-delete-shipment]').forEach(b => b.addEventListener('click', async () => {
    const target = state.shipments.find(x => x.id === b.dataset.deleteShipment);
    if(target && target.items && target.items.length && state.role !== 'owner' && state.role !== 'manager'){
      alert('Only the Owner or a Manager can delete a shipment once items have been logged.');
      return;
    }
    if(!confirm('Delete this customer entry? This cannot be undone.')) return;
    try{
      await withFreshShipments(list => {
        const idx = list.findIndex(x => x.id === b.dataset.deleteShipment);
        if(idx > -1) list.splice(idx, 1);
      });
    }catch(e){
      console.error('delete shipment failed', e);
      alert('Could not delete this entry. Check your connection and try again.');
      return;
    }
    renderDashboard();
  }));
  list.querySelectorAll('[data-take-photo]').forEach(b => b.addEventListener('click', () => {
    const input = document.querySelector(`[data-load-photo="${b.dataset.takePhoto}"]`);
    if(input) input.click();
  }));
  list.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.pay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    state.expandedShipmentIds.delete(b.dataset.pay);
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.pay));
    renderDashboard();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    state.cashDraft[b.dataset.cashOpen] = { received: '' };
    renderDashboard();
  }));
  list.querySelectorAll('[data-cash-cancel]').forEach(b => b.addEventListener('click', () => {
    delete state.cashDraft[b.dataset.cashCancel];
    renderDashboard();
  }));
  list.querySelectorAll('[id^="cash-input-"]').forEach(inp => inp.addEventListener('input', () => {
    const id = inp.id.replace('cash-input-','');
    if(!state.cashDraft[id]) return;
    state.cashDraft[id].received = inp.value;
    const s = state.shipments.find(x => x.id === id);
    const received = parseFloat(inp.value) || 0;
    const balance = received - (s.total || 0);
    const label = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
    const color = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
    const balEl = document.getElementById('cash-balance-'+id);
    if(balEl){ balEl.textContent = `${label}: ${fmtMoney(Math.abs(balance))}`; balEl.style.color = color; }
  }));
  list.querySelectorAll('[data-cash-confirm]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.cashConfirm;
    const received = parseFloat(state.cashDraft[id].received) || 0;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === id);
      if(s){
        s.paid = true; s.paymentMethod = 'cash'; s.paidAt = new Date().toISOString();
        s.cashReceived = received; s.cashChange = received - (s.total||0);
      }
    });
    delete state.cashDraft[id];
    state.expandedShipmentIds.delete(id);
    syncShipmentToSheet(state.shipments.find(x => x.id === id));
    renderDashboard();
  }));
}

function renderTagCard(s, isUndelivered){
  const statusClass = 'status-' + s.status;
  const statusLabel = STATUS_LABELS[s.status] || s.status;
  const pillHtml = isUndelivered
    ? `<span class="status-pill" style="background:var(--red);color:#fff;">Trip Ended \u2014 Undelivered</span>`
    : `<span class="status-pill ${statusClass}">${statusLabel}</span>`;
  const offIslandNote = (s.deliveredIsland && s.deliveredIsland !== s.island) ? `
    <div class="tag-meta" style="color:var(--amber);font-weight:600;">Delivered at ${escapeHtml(s.deliveredIsland)} (registered for ${escapeHtml(s.island)})</div>
    ${s.actualReceiverName ? `<div class="tag-meta">Received by ${escapeHtml(s.actualReceiverName)}${s.actualReceiverMobile ? ' \u00b7 '+telLink(s.actualReceiverMobile) : ''}</div>` : ''}
    ${s.deliveryNote ? `<div class="tag-meta">Reason: ${escapeHtml(s.deliveryNote)}</div>` : ''}
  ` : '';
  const headerHtml = `
    <div style="flex:1;">
      <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span><br>${telLink(s.mobile)}</div>
      ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span><br>${telLink(s.receiverMobile)}</div>` : ''}
      <div class="tag-meta">${s.id} \u00b7 to <strong>${escapeHtml(s.island)}</strong></div>
      ${offIslandNote}
    </div>
    ${pillHtml}
  `;

  const isExpanded = state.expandedShipmentIds.has(s.id);
  if(!isExpanded){
    const paidBadge = s.invoiceId ? `<div class="tag-meta" style="font-weight:700;color:${s.paid?'#2F7A4F':'#B23A2F'};">${s.paid ? 'Paid' : 'Unpaid'}</div>` : '';
    return `
      <button type="button" class="tag" data-expand-shipment="${s.id}" style="width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;">
        <div class="tag-top">
          <div style="flex:1;">
            <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span><br>${telLink(s.mobile)}</div>
            ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span><br>${telLink(s.receiverMobile)}</div>` : ''}
            <div class="tag-meta">${s.id} \u00b7 to <strong>${escapeHtml(s.island)}</strong></div>
            ${(s.deliveredIsland && s.deliveredIsland !== s.island) ? `<div class="tag-meta" style="color:var(--amber);font-weight:600;">Delivered at ${escapeHtml(s.deliveredIsland)}</div>` : ''}
          </div>
          <div style="text-align:right;">
            ${pillHtml}
            ${paidBadge}
          </div>
        </div>
      </button>
      <input type="file" accept="image/*" data-load-photo="${s.id}" style="display:none;">
    `;
  }

  const draft = state.loadingDraft[s.id];
  const cash = state.cashDraft[s.id];
  let actions = '';
  if(s.status === 'pending'){
    if(draft && draft.items.length){
      const pendingCount = draft.items.reduce((n,i)=>n+i.qty,0);
      actions = `<button class="btn btn-amber" data-load="${s.id}">Continue \u2014 ${pendingCount} item${pendingCount===1?'':'s'} pending</button>`;
    } else {
      actions = `<button class="btn btn-amber" data-load="${s.id}">Log Items Loaded</button>`;
    }
  } else if(s.status === 'in_transit'){
    actions = `<button class="btn btn-primary" data-deliver="${s.id}">Mark Delivered</button>`;
  }

  const photoControls = ((s.status === 'loaded' || s.status === 'in_transit') ? `<button class="btn btn-ghost" data-take-photo="${s.id}">${s.photo ? 'Retake Photo' : 'Add Photo'}</button>` : '')
    + `<input type="file" accept="image/*" data-load-photo="${s.id}" style="display:none;">`;
  const photoThumb = photoLinkHtml(s);

  const itemsSummary = (s.items && s.items.length) ? `
    <details class="items-details">
      <summary>Items (${s.items.reduce((n,i)=>n+i.qty,0)})</summary>
      <div class="items-body">
        ${s.items.map(i => `${i.qty}\u00d7 ${escapeHtml(i.name)}`).join('<br>')}
        <div style="margin-top:6px;font-weight:700;color:var(--navy-deep);">Total ${fmtMoney(s.total)}</div>
      </div>
    </details>
  ` : '';
  const invoiceLine = s.invoiceId ? `<button type="button" data-invoice="${s.id}" style="display:block;width:100%;text-align:left;background:none;border:none;padding:4px 0;cursor:pointer;font-size:13px;font-weight:600;color:var(--teal);">Invoice ${s.invoiceId} \u00b7 <span style="color:${s.paid?'#2F7A4F':'#B23A2F'};">${s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid'}</span></button>` : '';
  const paymentActions = (s.invoiceId && !s.voided && !s.paid && !cash) ? `
    <button class="btn btn-primary" data-cash-open="${s.id}">Collect \u2014 Cash</button>
    <button class="btn btn-primary" data-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
  ` : '';

  const hasItems = s.items && s.items.length > 0;
  const canDelete = !hasItems || state.role === 'owner' || state.role === 'manager';
  const deleteBtn = canDelete ? `<button class="btn btn-danger" data-delete-shipment="${s.id}">Delete</button>` : '';

  return `
    <div class="tag">
      <button type="button" data-collapse-shipment="${s.id}" style="width:100%;text-align:left;cursor:pointer;background:none;border:none;padding:0;">
        <div class="tag-top">${headerHtml}</div>
      </button>
      ${s.note ? `<div class="tag-meta">Note: ${escapeHtml(s.note)}</div>` : ''}
      ${itemsSummary}
      ${invoiceLine}
      ${photoThumb}
      <div class="tag-actions">${actions}${paymentActions}${photoControls}${deleteBtn}</div>
      ${cash ? renderCashForm(s) : ''}
    </div>
  `;
}

function renderCashForm(s){
  const cash = state.cashDraft[s.id];
  const received = parseFloat(cash.received) || 0;
  const balance = received - (s.total || 0);
  const balanceLabel = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
  const balanceColor = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
  return `
    <div class="cash-box">
      <label style="margin-bottom:6px;">Amount received (\u0783)</label>
      <input type="text" inputmode="decimal" id="cash-input-${s.id}" value="${escapeHtml(cash.received)}" placeholder="0.00" style="margin-bottom:8px;">
      <div class="tag-meta">Total due: ${fmtMoney(s.total)}</div>
      <div class="balance" id="cash-balance-${s.id}" style="color:${balanceColor};">${balanceLabel}: ${fmtMoney(Math.abs(balance))}</div>
      <div class="tag-actions">
        <button class="btn btn-primary" data-cash-confirm="${s.id}">Confirm Cash Payment</button>
        <button class="btn btn-ghost" data-cash-cancel="${s.id}">Cancel</button>
      </div>
    </div>
  `;
}

// Off-island delivery popup -- opens right over whatever screen you're on,
// same pop-in style as the invoice popup, and closes on tap-outside or the
// X. A shipment can be handed over at a different island than the one it
// was registered for (e.g. the receiver wasn't there, or arrangements
// changed en route). Requires picking the actual island, a note explaining
// why, and the actual receiver's name/mobile, since the originally
// registered receiver may not be who picked it up.
// Off-island delivery popup -- opens automatically from "Mark Delivered"
// when the boat's arrived island (set in Trips) doesn't match the
// shipment's registered island, instead of a separate button the person
// has to remember to tap. Same pop-in style as the invoice popup, closes
// on tap-outside or the X.
function openDeliverOtherPopup(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  closeDeliverOtherPopup();
  const trip = (state.trips||[]).find(t => t.id === s.tripId);
  const arrived = activeTripArrivedIsland();
  const routeIslands = ((trip && trip.destinations) || []).filter(isl => isl !== s.island);
  const overlay = document.createElement('div');
  overlay.id = 'deliver-other-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="deliver-other-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      ${renderDeliverOtherPopupContent(s, routeIslands, arrived)}
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeDeliverOtherPopup(); });
  document.body.appendChild(overlay);
  wireDeliverOtherPopup(s, routeIslands);
}
function closeDeliverOtherPopup(){
  document.getElementById('deliver-other-popup-overlay')?.remove();
}
function renderDeliverOtherPopupContent(s, routeIslands, arrived){
  const arrivedIsKnownStop = arrived && routeIslands.includes(arrived);
  const arrivedIsManual = arrived && !routeIslands.includes(arrived);
  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
      <div>
        <h3 style="margin-bottom:2px;">Wrong Island Detected</h3>
        <div class="tag-meta">${escapeHtml(s.id)} \u00b7 registered for ${escapeHtml(s.island)}</div>
      </div>
      <button type="button" class="btn btn-ghost" id="deliver-other-popup-close-btn" style="padding:8px 14px;">\u2715</button>
    </div>
    <div class="note" style="border-color:var(--amber);color:var(--ink-soft);margin-bottom:14px;">The boat has arrived at <strong>${escapeHtml(arrived || 'a different island')}</strong>, but this shipment was registered for <strong>${escapeHtml(s.island)}</strong>. Fill in the details below to deliver it here anyway.</div>
    <label>Delivered at island</label>
    ${routeIslands.length ? `
      <select id="deliver-other-island-select">
        <option value="" disabled ${arrived ? '' : 'selected'}>Select island</option>
        ${routeIslands.map(isl => `<option value="${escapeHtml(isl)}" ${isl===arrived ? 'selected' : ''}>${escapeHtml(isl)}</option>`).join('')}
        <option value="__other" ${arrivedIsManual ? 'selected' : ''}>Other (type manually)</option>
      </select>
      <input type="text" id="deliver-other-island-manual" placeholder="Island name" value="${arrivedIsManual ? escapeHtml(arrived) : ''}" style="display:${arrivedIsManual ? '' : 'none'};">
    ` : `
      <input type="text" id="deliver-other-island-manual" placeholder="e.g. Himandhoo" value="${escapeHtml(arrived||'')}">
    `}
    <label>Reason (required)</label>
    <textarea id="deliver-other-note" rows="2" placeholder="Why is this being delivered somewhere other than ${escapeHtml(s.island)}?"></textarea>
    <label>Receiver's name at this island (required)</label>
    <input type="text" id="deliver-other-rname">
    <label>Receiver's mobile number (required)</label>
    <input type="tel" id="deliver-other-rmobile">
    <button class="btn btn-primary" id="deliver-other-confirm-btn" style="width:100%;margin-top:16px;">Confirm Delivery</button>
  `;
}
function wireDeliverOtherPopup(s, routeIslands){
  document.getElementById('deliver-other-popup-close-btn').addEventListener('click', closeDeliverOtherPopup);
  const sel = document.getElementById('deliver-other-island-select');
  if(sel){
    sel.addEventListener('change', () => {
      const manual = document.getElementById('deliver-other-island-manual');
      if(manual) manual.style.display = sel.value === '__other' ? '' : 'none';
    });
  }
  document.getElementById('deliver-other-confirm-btn').addEventListener('click', async () => {
    const selEl = document.getElementById('deliver-other-island-select');
    const manualEl = document.getElementById('deliver-other-island-manual');
    const island = (selEl && selEl.value && selEl.value !== '__other') ? selEl.value : (manualEl ? manualEl.value.trim() : '');
    const note = document.getElementById('deliver-other-note').value.trim();
    const receiverName = document.getElementById('deliver-other-rname').value.trim();
    const receiverMobile = document.getElementById('deliver-other-rmobile').value.trim();
    if(!island || !note || !receiverName || !receiverMobile){
      alert('Island, reason, receiver name, and receiver mobile are all required for an off-island delivery.');
      return;
    }
    const btn = document.getElementById('deliver-other-confirm-btn');
    btn.disabled = true; btn.textContent = 'Saving\u2026';
    try{
      await markDeliveredOffIsland(s.id, { island, note, receiverName, receiverMobile });
    }catch(e){
      console.error('markDeliveredOffIsland failed', e);
      alert('Could not save this delivery. Check your connection and try again.');
      btn.disabled = false; btn.textContent = 'Confirm Delivery';
      return;
    }
    closeDeliverOtherPopup();
  });
}

function openLoadForm(id){
  if(!state.loadingDraft[id]){
    state.loadingDraft[id] = { items: [], customName:'', customPrice:'', itemSearch:'', open: true, itemDropdownOpen: false };
  } else {
    state.loadingDraft[id].open = true;
  }
  renderDashboard();
}

function renderLoadForm(s){
  const draft = state.loadingDraft[s.id];
  const total = draft.items.reduce((sum,i) => sum + i.qty*i.price, 0);
  const sortedRates = state.rates.slice().sort((a,b) => a.name.localeCompare(b.name));
  const query = (draft.itemSearch || '').trim().toLowerCase();
  const matches = query ? sortedRates.filter(r => r.name.toLowerCase().includes(query)) : sortedRates;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div>
        <h3 style="margin-bottom:2px;">Log Items Loaded</h3>
        <div class="tag-meta">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.receiverName||'')} \u00b7 ${s.id}</div>
      </div>
      <button type="button" class="btn btn-ghost" data-cancel-load="${s.id}" style="padding:8px 14px;">\u2715 Close</button>
    </div>

      <div style="margin-bottom:14px;">
        <label>Search &amp; tap an item to add it</label>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="text" data-item-search="${s.id}" placeholder="Search items\u2026" autocomplete="off" value="${escapeHtml(draft.itemSearch||'')}" style="margin-bottom:0;flex:1;">
          <button type="button" data-toggle-item-dropdown="${s.id}" style="flex-shrink:0;width:40px;height:40px;padding:0;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;color:var(--ink-soft);">${draft.itemDropdownOpen ? '\u25b2' : '\u25bc'}</button>
        </div>
        <div class="item-results" data-item-results="${s.id}" style="display:${draft.itemDropdownOpen ? 'block' : 'none'};margin-top:8px;">
          ${matches.length ? matches.map(r => `
            <button type="button" class="item-result-row" data-pick-item="${s.id}" data-rate-id="${r.id}">
              <span>${escapeHtml(r.name)}</span><span class="rprice">${fmtMoney(r.price)}</span>
            </button>
          `).join('') : `<div class="empty" style="padding:10px 0;font-size:13px;">No matching items.</div>`}
        </div>
      </div>

      ${draft.items.length ? draft.items.map((i,idx) => `
        <div class="rate-row" style="padding:8px 10px;">
          <div style="min-width:0;">
            <div class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(i.name)}</div>
            <div class="price">${fmtMoney(i.price)}/unit</div>
          </div>
          <div class="stepper">
            <button data-dec="${idx}" data-sid="${s.id}">\u2212</button>
            <span class="qty">${i.qty}</span>
            <button data-inc="${idx}" data-sid="${s.id}">+</button>
            <button data-remove="${idx}" data-sid="${s.id}" title="Remove" style="border-color:#e0b3b3;color:#a13a3a;">\u00d7</button>
          </div>
        </div>
      `).join('') : `<div class="empty" style="padding:16px 0;">No items added yet.</div>`}

          <input type="text" placeholder="0" data-custom-price="${s.id}" value="${escapeHtml(draft.customPrice)}" style="margin-bottom:0;">
        </div>
        <button class="btn btn-ghost" data-add-custom="${s.id}" style="height:44px;">Add</button>
      </div>

      </div>
      <div class="note" style="margin-top:8px;">Confirms immediately, then opens your camera for a photo. If the camera step ever gets interrupted, the item is still safely marked Loaded \u2014 just use "Add Photo" on the card afterward.</div>
  `;
}

function pickItem(sid, rateId){
  const d = state.loadingDraft[sid];
  const rate = state.rates.find(r => r.id === rateId);
  if(!d || !rate) return;
  const existing = d.items.find(i => i.id === rate.id);
  if(existing){ existing.qty += 1; }
  else { d.items.push({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }
  d.itemSearch = '';
  renderDashboard();
}

function wireLoadFormEvents(){
  document.querySelectorAll('[data-item-search]').forEach(inp => inp.addEventListener('input', () => {
    const sid = inp.dataset.itemSearch;
    const d = state.loadingDraft[sid];
    if(!d) return;
    d.itemSearch = inp.value;
    d.itemDropdownOpen = true;
    const query = inp.value.trim().toLowerCase();
    const sortedRates = state.rates.slice().sort((a,b) => a.name.localeCompare(b.name));
    const matches = query ? sortedRates.filter(r => r.name.toLowerCase().includes(query)) : sortedRates;
    const box = document.querySelector(`[data-item-results="${sid}"]`);
    if(!box) return;
    box.style.display = 'block';
    const toggleBtn = document.querySelector(`[data-toggle-item-dropdown="${sid}"]`);
    if(toggleBtn) toggleBtn.textContent = '\u25b2';
    box.innerHTML = matches.length ? matches.map(r => `
      <button type="button" class="item-result-row" data-pick-item="${sid}" data-rate-id="${r.id}">
        <span>${escapeHtml(r.name)}</span><span class="rprice">${fmtMoney(r.price)}</span>
      </button>
    `).join('') : `<div class="empty" style="padding:10px 0;font-size:13px;">No matching items.</div>`;
    box.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
  }));
  document.querySelectorAll('[data-toggle-item-dropdown]').forEach(b => b.addEventListener('click', () => {
    const sid = b.dataset.toggleItemDropdown;
    const d = state.loadingDraft[sid];
    if(!d) return;
    d.itemDropdownOpen = !d.itemDropdownOpen;
    renderDashboard();
  }));
  document.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
  document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items[b.dataset.inc].qty++; renderDashboard();
  }));
  document.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid];
    const idx = b.dataset.dec;
    d.items[idx].qty = Math.max(0, d.items[idx].qty - 1);
    if(d.items[idx].qty === 0) d.items.splice(idx,1);
    renderDashboard();
  }));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items.splice(b.dataset.remove,1); renderDashboard();
  }));
  document.querySelectorAll('[data-custom-name]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customName].customName = inp.value; }));
  document.querySelectorAll('[data-custom-price]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customPrice].customPrice = inp.value; }));
  document.querySelectorAll('[data-add-custom]').forEach(b => b.addEventListener('click', async () => {
    const d = state.loadingDraft[b.dataset.addCustom];
    const name = (d.customName||'').trim();
    const price = parseFloat(d.customPrice) || 0;
    if(!name) return;

    // Reuse an existing rate if one with this name already exists (case-insensitive),
    // otherwise persist it as a new rate so it shows up in the dropdown for every
    // future shipment entry, not just this one.
    let rate = state.rates.find(r => r.name.trim().toLowerCase() === name.toLowerCase());
    if(!rate){
      rate = { id: 'custom-'+Date.now(), name, price };
      state.rates.push(rate);
      await saveRates(state.rates);
    }

    const existing = d.items.find(i => i.id === rate.id);
    if(existing){ existing.qty++; }
    else { d.items.push({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }

    d.customName=''; d.customPrice='';
    renderDashboard();
  }));
  document.querySelectorAll('[data-cancel-load]').forEach(b => b.addEventListener('click', () => { delete state.loadingDraft[b.dataset.cancelLoad]; renderDashboard(); }));

  document.querySelectorAll('[data-confirm-load]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.confirmLoad;
    const draft = state.loadingDraft[id];
    const items = draft.items.filter(i => i.qty > 0);
    if(items.length === 0){ alert('Add at least one item before confirming.'); return; }
    // Camera first, synchronously, inside this click -- browsers require a
    // file-input click to happen within a trusted user gesture, so any
    // await (like a network save) before this point makes them silently
    // ignore it. The save then runs right behind it without blocking.
    const photoInput = document.querySelector(`[data-load-photo="${id}"]`);
    if(photoInput) photoInput.click();
    completeLoadConfirm(id);
  }));

  document.querySelectorAll('[data-load-photo]').forEach(inp => inp.addEventListener('change', async () => {
    const id = inp.dataset.loadPhoto;
    const file = inp.files && inp.files[0];
    if(!file) return;
    let photo = null;
    try{ photo = await compressImageToDataUrl(file, 900, 0.6); }
    catch(e){ console.error('Photo compression failed', e); }
    if(photo) await attachPhoto(id, photo);
  }));
}

// Resizes and re-compresses a captured photo before it ever touches the
// database -- raw camera photos are several MB each, and this data is stored
// inside one shared JSON blob for every shipment, so uncompressed photos
// would make the whole app slow to load for everyone, not just this record.
function compressImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function completeLoadConfirm(id){
  const draft = state.loadingDraft[id];
  if(!draft) return;
  const items = draft.items.filter(i => i.qty > 0).map(i => ({name:i.name, qty:i.qty, price:i.price}));
  if(items.length === 0) return;
  const total = items.reduce((sum,i) => sum + i.qty*i.price, 0);
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'loaded'; s.items = items; s.total = total; s.loadedAt = new Date().toISOString();
    s.invoiceId = s.invoiceId || invoiceId();
    s.paid = s.paid || false;
  });
  delete state.loadingDraft[id];
  state.expandedShipmentIds.delete(id);
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  renderDashboard();
}

async function attachPhoto(id, photo){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(s){ s.photo = photo; s.imageArchived = false; }
  });
  state.expandedShipmentIds.delete(id);
  renderDashboard();
}

// Called from the Trips tab: moves every 'loaded' shipment tied to this trip
// into 'in_transit' together, since the boat either has departed or hasn't --
// individual shipments don't depart separately.
async function markTripInTransit(tripId){
  let moved = 0;
  const now = new Date().toISOString();
  await withFreshShipments(list => {
    list.forEach(s => {
      if(s.tripId === tripId && s.status === 'loaded'){ s.status = 'in_transit'; s.inTransitAt = now; moved++; }
    });
  });
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t) t.departed = true;
  });
  return moved;
}

function isTripFinished(tripId){
  if(!tripId) return false;
  const t = (state.trips||[]).find(x => x.id === tripId);
  return !!(t && t.finished);
}

async function finishTrip(tripId){
  let trip;
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t){ t.finished = true; t.finishedAt = new Date().toISOString(); trip = t; }
  });
  // Now that the trip is fully done, clean up photos for shipments that
  // were actually delivered -- proof of delivery is no longer needed once
  // both the shipment is delivered AND the trip itself has ended. Anything
  // still undelivered keeps its photo, so it stays visible in Reports'
  // Undelivered section for follow-up.
  await withFreshShipments(list => {
    list.forEach(s => {
      if(s.tripId === tripId && s.status === 'delivered' && s.photo){
        delete s.photo; s.imageArchived = true;
      }
    });
  });
  if(trip) finalizeGoogleSheetForTrip(trip);
}

async function markDelivered(id){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
    // Photo is kept for now -- it's only cleaned up once the trip itself is
    // marked finished (see finishTrip), not the moment an individual
    // shipment is delivered mid-trip.
  });
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  renderDashboard();
}

// Off-island delivery -- keeps s.island as the originally registered
// destination (for accounting/records), but records where it actually got
// handed over, why, and to whom. The originally registered receiver's
// details are left untouched; the manually-entered name/mobile go in
// separate fields so both are preserved.
async function markDeliveredOffIsland(id, { island, note, receiverName, receiverMobile }){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
    s.deliveredIsland = island;
    s.deliveryNote = note;
    s.actualReceiverName = receiverName;
    s.actualReceiverMobile = receiverMobile;
  });
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  // Off-island deliveries are typically done by browsing away from the
  // pinned "arrived" island to find the shipment elsewhere -- once it's
  // handed over, snap the Dashboard back to the boat's actual arrived
  // island instead of leaving it stranded on the island just browsed to.
  const arrived = activeTripArrivedIsland();
  if(arrived) state.dashIslandView = arrived;
  renderDashboard();
}

function renderTrackResult(s){
  const steps = STATUS_STEPS;
  const idx = steps.indexOf(s.status);
  const dates = { pending: s.createdAt, loaded: s.loadedAt, in_transit: s.inTransitAt, delivered: s.deliveredAt };
  const labels = { pending:'Checked In', loaded:'Loaded', in_transit:'In Transit', delivered:'Delivered' };
  const tripEnded = isTripFinished(s.tripId) && s.status !== 'delivered';

  const timeline = steps.map((step,i) => {
    let label = labels[step];
    let redLabel = false;
    if(tripEnded && step === s.status){ label = 'Trip Ended'; redLabel = true; }
    if(tripEnded && step === 'delivered'){ label = 'Not Delivered'; redLabel = true; }
    const endedClass = (tripEnded && i <= idx) ? ' trip-ended' : '';
    return `
    <div class="tl-step ${i<=idx?'done':''}${endedClass}">
      <div class="tl-dot"></div>
      <div class="tl-label"${redLabel ? ' style="color:var(--red);"' : ''}>${label}</div>
      <div class="tl-date">${dates[step] ? fmtDate(dates[step]) : ''}</div>
    </div>
  `;
  }).join('');

  const isCustomer = state.role === 'sender' || state.role === 'receiver';

  const invoice = (!isCustomer && s.items && s.items.length) ? `
    <div class="invoice">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="display" style="font-size:15px;color:var(--navy-deep);">Invoice \u2014 ${s.id}</div>
        <button class="btn btn-ghost" data-share-image="${s.id}" style="padding:6px 12px;font-size:11px;">Share as Image</button>
      </div>
      <div class="tag-meta" style="margin-top:6px;">Sender: ${escapeHtml(s.name)} \u00b7 ${telLink(s.mobile)} \u2192 ${escapeHtml(s.island)}</div>
      ${s.receiverName ? `<div class="tag-meta">Receiver: ${escapeHtml(s.receiverName)} \u00b7 ${telLink(s.receiverMobile)}</div>` : ''}
      ${s.invoiceId ? `<div class="tag-meta">Invoice ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#2F7A4F':'#B23A2F'}">${s.paid?'Paid':'Unpaid'}</strong></div>` : ''}
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td><td class="num">${fmtMoney(i.price)}</td><td class="num">${fmtMoney(i.qty*i.price)}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="total-line"><span>Total Due</span><span class="amt">${fmtMoney(s.total)}</span></div>
    </div>
  ` : '';

  const itemsOnly = (isCustomer && s.items && s.items.length) ? `
    <div class="invoice">
      <div class="display" style="font-size:15px;color:var(--navy-deep);">Items Loaded</div>
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  ` : '';

  return `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${labels[s.status]}</span>
      </div>
      <div class="tag-meta">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.island)} ${s.receiverName ? '(for '+escapeHtml(s.receiverName)+')' : ''}</div>
      <div class="timeline">${timeline}</div>
      ${invoice}
      ${itemsOnly}
    </div>
  `;
}
