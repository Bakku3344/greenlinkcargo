<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ferry Cargo Log</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  :root{
    --navy-deep:#0B3D2E;
    --navy-mid:#14503D;
    --teal:#29AB87;
    --teal-light:#3FC79A;
    --amber:#D98E04;
    --paper:#F6F1E7;
    --paper-dark:#EAE2D0;
    --ink:#1C1A17;
    --ink-soft:#5B5548;
    --red:#B23A2F;
    --green:#2F7A4F;
    --line:#D8CFB8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    max-width:100vw;
    overflow-x:hidden;
    touch-action:pan-y;
    overscroll-behavior-x:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    background:var(--navy-deep);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(255,255,255,0.04), transparent 40%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  .shell{max-width:920px;margin:0 auto;padding:20px 16px 60px;touch-action:pan-y;}
  header.app-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 4px 22px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:6px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .brand-mark svg{width:22px;height:22px;stroke:var(--navy-deep); animation: brand-roll 2.4s linear infinite; transform-origin: 50% 50%;}
  @keyframes brand-roll{
    0%{ transform: rotate(0deg); }
    100%{ transform: rotate(360deg); }
  }
  @keyframes invoice-pop-in{
    0%{ transform: scale(0.9); opacity: 0; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .brand h1{font-size:20px;color:#F6F1E7;margin:0;font-weight:600;letter-spacing:0.06em;}
  .brand span{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#9FB3C8;letter-spacing:0.14em;text-transform:uppercase;margin-top:2px;}

  .role-pill{
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);
    padding:6px 6px 6px 14px;border-radius:24px;
  }
  .role-pill .rlabel{font-family:'JetBrains Mono',monospace;font-size:11px;color:#C7D3E0;letter-spacing:0.06em;text-transform:uppercase;}
  .role-pill button{
    background:var(--amber);color:var(--navy-deep);border:none;border-radius:18px;
    padding:6px 12px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.04em;
    text-transform:uppercase;cursor:pointer;font-weight:600;
  }

  .mode-toggle{
    display:flex;gap:6px;background:rgba(255,255,255,0.06);
    padding:5px;border-radius:10px;margin-bottom:12px;
  }
  .mode-toggle button{
    flex:1;background:transparent;border:none;color:#C7D3E0;
    font-family:'Oswald',sans-serif;letter-spacing:0.05em;text-transform:uppercase;
    font-size:13px;padding:12px 8px;border-radius:7px;cursor:pointer;font-weight:500;
  }
  .mode-toggle button.active{background:var(--amber);color:var(--navy-deep);font-weight:700;}
  .mode-toggle button:not(.active):hover{background:rgba(255,255,255,0.08);color:#fff;}

  nav.tabs{
    display:flex;gap:6px;background:rgba(255,255,255,0.06);
    padding:5px;border-radius:10px;margin-bottom:22px;flex-wrap:wrap;
  }
  nav.tabs button{
    flex:1;min-width:110px;
    background:transparent;border:none;color:#C7D3E0;
    font-family:'Oswald',sans-serif;letter-spacing:0.05em;text-transform:uppercase;
    font-size:12.5px;padding:10px 8px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background 0.15s, color 0.15s;
  }
  nav.tabs button.active{background:var(--amber);color:var(--navy-deep);font-weight:600;}
  nav.tabs button:not(.active):hover{background:rgba(255,255,255,0.08);color:#fff;}
  .badge{
    background:var(--red);color:#fff;font-size:10px;font-family:'JetBrains Mono',monospace;
    padding:1px 6px;border-radius:20px;min-width:16px;text-align:center;
  }
  nav.tabs button.active .badge{background:var(--navy-deep);color:var(--amber);}

  .panel{
    background:var(--paper);border-radius:12px;padding:26px;
    box-shadow:0 12px 34px rgba(0,0,0,0.28);
  }
  .panel h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:22px;margin:0 0 4px;color:var(--navy-deep);}
  .panel .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}

  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:5px;}
  input[type=text],input[type=tel],input[type=password],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:7px;
    font-family:'Inter',sans-serif;font-size:14.5px;background:#fff;color:var(--ink);
    margin-bottom:16px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .field-error{border-color:var(--red) !important;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:12px 20px;border-radius:8px;border:none;cursor:pointer;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:14px;font-weight:500;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-light);}
  .btn-amber{background:var(--amber);color:var(--navy-deep);}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--navy-deep);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy-deep);}
  .btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .tag{
    position:relative;background:#fff;border-radius:10px;border:1.5px dashed var(--line);
    padding:18px 18px 16px 26px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;
  }
  .tag::before{
    content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;border-radius:50%;background:var(--navy-deep);border:3px solid var(--paper);
  }
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .tag-code{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--navy-deep);letter-spacing:0.02em;}
  .tag-meta{font-size:13px;color:var(--ink-soft);}
  .truncate-link{cursor:pointer;word-break:break-all;}
  .truncate-dots{color:var(--teal);font-weight:700;letter-spacing:1px;}
  .status-pill{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;font-weight:700;white-space:nowrap;
  }
  .status-pending{background:#FBE7C6;color:#8A5A00;}
  .status-loaded{background:#D9F0E6;color:#1E7A5F;}
  .status-in_transit{background:#DCE4F5;color:#2C4A8C;}
  .status-arrived{background:#D6F0E4;color:#0F6B49;}
  .status-delivered{background:#DCEBDD;color:#2F7A4F;}
  .tag-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .tag-items{font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;}
  .party-block{margin-bottom:4px;}
  .party-name{font-weight:700;font-size:14.5px;color:var(--navy-deep);}
  .party-role{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:700;margin-right:6px;}
  .party-phone{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal);text-decoration:none;}
  .party-phone:active{opacity:0.7;}
  .items-details{margin-top:4px;border-top:1px dashed var(--line);padding-top:8px;}
  .items-details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--teal);list-style:none;}
  .items-details summary::-webkit-details-marker{display:none;}
  .items-details summary::before{content:'\25B8 ';}
  .items-details[open] summary::before{content:'\25BE ';}
  .items-details .items-body{margin-top:8px;font-size:13px;color:var(--ink-soft);}
  .cash-box{border:1.5px solid var(--teal);border-radius:8px;padding:14px;margin-top:10px;background:#fff;}
  .cash-box .balance{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;margin:8px 0;}
  .share-box{border:1.5px solid var(--teal);border-radius:8px;padding:14px;margin-top:10px;background:#fff;display:flex;flex-direction:column;gap:8px;}
  .share-box .btn{width:100%;margin-bottom:8px;}
  .item-results{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
  .item-result-row{
    display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;
    font-size:14px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;
  }
  .item-result-row:active{background:var(--paper-dark);border-color:var(--teal);}
  .item-result-row .rprice{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:12.5px;}

  .rate-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;
  }
  .rate-row .name{font-weight:600;font-size:14px;}
  .rate-row .price{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);background:#fff;
    font-size:16px;cursor:pointer;line-height:1;
  }
  .stepper button:hover{border-color:var(--teal);color:var(--teal);}
  .stepper .qty{width:26px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;}

  .total-line{
    display:flex;justify-content:space-between;align-items:center;
    border-top:2px solid var(--navy-deep);padding-top:12px;margin-top:6px;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:16px;
  }
  .total-line .amt{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--navy-deep);}

  .empty{text-align:center;padding:36px 12px;color:var(--ink-soft);font-size:14px;}

  .qr-wrap{background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;margin-bottom:18px;}
  #qr-canvas{display:inline-block;}

  .confirm-code{text-align:center;padding:24px;background:var(--navy-deep);border-radius:10px;color:#fff;margin-bottom:16px;}
  .confirm-code .big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;letter-spacing:0.05em;color:var(--amber);margin:8px 0;}

  .timeline{display:flex;gap:0;margin:18px 0 4px;}
  .tl-step{flex:1;text-align:center;position:relative;}
  .tl-dot{width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1;}
  .tl-step.done .tl-dot{background:var(--teal);}
  .tl-step::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .tl-step:first-child::after{display:none;}
  .tl-step.done::after{background:var(--teal);}
  .tl-step.trip-ended .tl-dot{background:var(--red);}
  .tl-step.trip-ended::after{background:var(--red);}
  .tl-label{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);font-weight:600;}
  .tl-date{font-size:10.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-top:2px;}

  .invoice{border:1.5px solid var(--navy-deep);border-radius:10px;padding:20px;margin-top:16px;background:#fff;}
  .invoice table{width:100%;border-collapse:collapse;margin:14px 0;}
  .invoice th,.invoice td{text-align:left;padding:7px 4px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .invoice th{text-transform:uppercase;font-size:10.5px;letter-spacing:0.05em;color:var(--ink-soft);}
  .invoice td.num,.invoice th.num{text-align:right;font-family:'JetBrains Mono',monospace;}

  .sub-tabs{
    display:flex;gap:6px;background:var(--paper-dark);
    padding:5px;border-radius:9px;margin-bottom:22px;flex-wrap:wrap;
  }
  .sub-tabs button{
    flex:1;min-width:130px;background:transparent;border:none;color:var(--ink-soft);
    font-family:'Oswald',sans-serif;letter-spacing:0.04em;text-transform:uppercase;
    font-size:12.5px;padding:9px 8px;border-radius:6px;cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .sub-tabs button.active{background:var(--navy-deep);color:var(--paper);font-weight:600;}
  .sub-tabs button:not(.active):hover{background:rgba(0,0,0,0.06);color:var(--navy-deep);}
  .staff-row{
    display:flex;gap:8px;align-items:center;margin-bottom:8px;
    background:var(--paper-dark);border-radius:8px;padding:8px 10px;
  }
  .staff-row .sname{flex:1;font-weight:600;color:var(--navy-deep);}
  .staff-row .spin{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:0.12em;background:var(--paper);padding:4px 10px;border-radius:6px;}
  .staff-empty{font-size:12.5px;color:var(--ink-soft);padding:8px 2px 12px;}
  .settings-block{margin-bottom:26px;}
  .settings-block h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:0.04em;color:var(--navy-deep);margin:0 0 12px;}
  .view-field{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#fff;border:1.5px solid var(--line);border-radius:8px;
    padding:11px 12px;margin-bottom:14px;
  }
  .view-field .vf-value{font-family:'JetBrains Mono',monospace;font-size:14.5px;color:var(--navy-deep);word-break:break-all;}
  .view-field .vf-edit{
    background:transparent;border:1.5px solid var(--line);border-radius:6px;
    padding:5px 10px;font-size:11px;font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:0.04em;color:var(--navy-deep);cursor:pointer;flex-shrink:0;
  }
  .view-field .vf-edit:active{background:var(--paper-dark);}
  .view-field .vf-show{background:none;border:none;color:var(--teal);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;margin-right:8px;padding:0;}
  .corner-delete{
    position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
    background:#fff;border:1.5px solid var(--red);color:var(--red);font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .corner-delete:active{background:var(--red);color:#fff;}
  .rate-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .rate-edit-row input[type=text]{margin-bottom:0;}
  .rate-edit-row input.price-input{width:90px;}
  .search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .search-row input{margin-bottom:0;flex:1;min-width:180px;}
  .filter-chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
    border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .filter-chip.active{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff;}
  .filter-scroll-row{
    display:flex;gap:10px;margin-bottom:18px;flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;padding-bottom:4px;
  }
  .filter-scroll-row .filter-chip{flex-shrink:0;white-space:nowrap;}
  .note{font-size:12.5px;color:var(--ink-soft);background:var(--paper-dark);border-radius:7px;padding:10px 12px;margin-top:6px;line-height:1.5;}
  .url-box{
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;
    border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;flex-wrap:wrap;
  }
  .url-box .u{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--navy-deep);word-break:break-all;}
  .url-box .tag-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;}

  .gate-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  .landing-wrap{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;}
  .landing-title{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:30px;color:#fff;margin:18px 0 6px;}
  .landing-tag{color:rgba(255,255,255,0.75);font-size:14.5px;margin-bottom:34px;}
  .landing-scene{width:100%;max-width:340px;height:120px;position:relative;overflow:hidden;margin-bottom:8px;}
  .landing-waves{position:absolute;bottom:18px;left:0;width:200%;height:14px;background:repeating-linear-gradient(90deg, rgba(63,199,154,0.35) 0 24px, transparent 24px 48px);border-radius:8px;animation:landing-wave-scroll 3.2s linear infinite;}
  .landing-boat{position:absolute;bottom:22px;left:-60px;width:56px;height:auto;color:var(--amber);animation:landing-boat-move 6s ease-in-out infinite;}
  @keyframes landing-wave-scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @keyframes landing-boat-move{
    0%{ left:-60px; transform:translateY(0) rotate(0deg); }
    48%{ left:calc(100% - 20px); transform:translateY(-3px) rotate(-1deg); }
    50%{ left:calc(100% - 20px); transform:translateY(0) rotate(0deg); }
    98%{ left:-60px; transform:translateY(-3px) rotate(1deg); }
    100%{ left:-60px; transform:translateY(0) rotate(0deg); }
  }
  .landing-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:26px;}
  .gate-card{max-width:420px;width:100%;}
  .gate-title{text-align:center;color:#F6F1E7;margin-bottom:26px;}
  .gate-title h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:24px;margin:0 0 6px;}
  .gate-title p{color:#9FB3C8;font-size:13px;margin:0;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-card{
    background:var(--paper);border-radius:12px;padding:20px 16px;text-align:center;cursor:pointer;
    border:2px solid transparent;transition:border-color .15s, transform .1s;
  }
  .role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .role-card .ricon{
    width:44px;height:44px;border-radius:10px;background:var(--navy-deep);margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
  }
  .role-card .ricon svg{width:22px;height:22px;stroke:var(--amber);}
  .role-card .rname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:14.5px;color:var(--navy-deep);margin-bottom:3px;}
  .role-card .rdesc{font-size:11.5px;color:var(--ink-soft);}
  .pin-box{background:var(--paper);border-radius:12px;padding:26px;max-width:340px;margin:0 auto;text-align:center;}
  .pin-box .rname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:16px;color:var(--navy-deep);margin-bottom:14px;}
  .pin-box input{text-align:center;letter-spacing:0.4em;font-family:'JetBrains Mono',monospace;font-size:20px;}
  .pin-error{color:var(--red);font-size:12.5px;margin:-8px 0 12px;min-height:16px;}

<script>
/* ---------------- Storage helpers ---------------- */
const DEFAULT_RATES = [

const DEFAULT_SETTINGS = {qrUrl:'', ownerPin:'1234', staffPin:'0000', ownerEmail:'', ownerPhone:'', staffUsers:[], pendingStaff:[], managerUsers:[], tripDefaults:{boatContacts:'',trackingLink:'',viberLink:''}, bankAccountName:'', bankAccountNumber:'', routes:[]};
const INTERNAL_HASH = 'staff';
const OWNER_HASH = 'owner';
const MANAGER_HASH = 'manager';

/* ---------------- API layer (Neon-backed, via your own serverless endpoint) ----------------
   EDIT THIS to your deployed API's base URL, e.g. "https://cargo-api.yourname.workers.dev"
   The API must implement:
     GET  /api/data/:key   -> { value: <any JSON> }   (404 or {value:null} if missing)
     PUT  /api/data/:key   body {value: <any JSON>}   -> upserts the row
   See neon-schema.sql and api-example/server.js for a ready-made reference implementation. */
const API_BASE = 'https://greenlinkcargo-trhl.onrender.com';

// Phase 3: every shipments/rates/trips/settings read & write in this app
// (Dashboard, Trips, Invoices, Reports, Settings, Check-In, Track -- all of
// it) funnels through apiGet/apiSet below, so scoping just these two
// functions to a boat_id is enough to make the entire existing app
// boat-private without touching any of the dozens of screens that call them.
//
// !! REPLACE THIS after completing phase3-migration.sql Steps 1-2 !!
// This is the boat_id for GreenLine Cargo's migrated account.
// !! This is the default fallback (GreenLine Cargo's migrated boat), used
// when no boat is specified in the URL or session -- keeps old bookmarked
// #owner/#staff links working exactly as before. Owners of OTHER boats are
// routed in via #owner/<boatId> or #staff/<boatId> (see handleHash), which
// overrides this at runtime.
let CURRENT_BOAT_ID = '0385fa720a791a89';

async function apiGet(key, fallback, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 15000);
  try{
    const res = await fetch(`${API_BASE}/api/data/${CURRENT_BOAT_ID}/${key}`, { signal: controller.signal });
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data && data.value !== undefined && data.value !== null) ? data.value : fallback;
  }catch(e){ console.error('apiGet failed for', key, e); return fallback; }
  finally{ clearTimeout(timer); }
}
async function apiSet(key, value){
  const res = await fetch(`${API_BASE}/api/data/${CURRENT_BOAT_ID}/${key}`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ value })
  });
  if(!res.ok){
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Save failed (HTTP ${res.status})`);
  }
}

// Used by the new #org starter dashboard, which manages a boat chosen at
// login/runtime rather than the fixed CURRENT_BOAT_ID above.
async function orgApiGet(boatId, key, fallback){
  try{
    const res = await fetch(`${API_BASE}/api/data/${boatId}/${key}`);
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data && data.value !== undefined && data.value !== null) ? data.value : fallback;
  }catch(e){ console.error('orgApiGet failed for', key, e); return fallback; }
}
async function orgApiSet(boatId, key, value){
  try{
    await fetch(`${API_BASE}/api/data/${boatId}/${key}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ value })
    });
  }catch(e){ console.error('orgApiSet failed for', key, e); }
}

async function loadShipments(){ return await apiGet('shipments', []); }
async function saveShipments(list){ await apiSet('shipments', list); }
async function loadRates(){ return await apiGet('rates', DEFAULT_RATES.slice()); }
async function saveRates(list){ await apiSet('rates', list); }
async function loadTrips(){ return await apiGet('trips', []); }
async function saveTrips(list){ await apiSet('trips', list); }
async function loadSettings(){
  const s = await apiGet('settings', {});
  return Object.assign({}, DEFAULT_SETTINGS, s);
}
async function saveSettings(s){ await apiSet('settings', s); }

// Always re-fetch the current settings from the database right before changing
// them, so a stale in-memory copy (e.g. an old tab, or a page left open) can
// never overwrite changes someone else made in the meantime.
async function withFreshSettings(mutate){
  const fresh = await loadSettings();
  await mutate(fresh);
  await saveSettings(fresh);
  state.settings = fresh;
  return fresh;
}
// Same fix as withFreshSettings, applied to shipments: re-fetch the live list
// right before every change instead of trusting whatever's sitting in local
// memory. Without this, two quick actions (e.g. adding a photo to one
// shipment right after another) can race with each other or with the
// 5-second background poll, and whichever save lands last silently wipes out
// the other's change.
async function withFreshShipments(mutate){
  const fresh = await loadShipments();
  mutate(fresh);
  await saveShipments(fresh);
  state.shipments = fresh;
  return fresh;
}
async function withFreshTrips(mutate){
  const fresh = await loadTrips();
  mutate(fresh);
  await saveTrips(fresh);
  state.trips = fresh;
  return fresh;
}

/* ---------------- Google Sheets trip logging ---------------- */
// All three of these are fire-and-forget from the caller's perspective --
// a slow or failing Google API call must never block or break the actual
// dispatch app, which works fine with zero Google connection at all.
function tripSheetTitle(trip){
  return `${trip.origin} \u2192 ${(trip.destinations||[]).join(', ')} \u00b7 ${fmtDMY(trip.date)}`;
}
async function createGoogleSheetForTrip(trip){
  try{
    const res = await fetch(`${API_BASE}/api/google/sheets/create`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ boatId: CURRENT_BOAT_ID, title: tripSheetTitle(trip) })
    });
    const data = await res.json().catch(() => ({}));
    if(data.ok && data.sheetId){
      await withFreshTrips(list => {
        const t = list.find(x => x.id === trip.id);
        if(t){ t.googleSheetId = data.sheetId; t.googleSheetUrl = data.sheetUrl; }
      });
      if(state.tab === 'trips') renderTrips();
    }
  }catch(e){ console.error('createGoogleSheetForTrip failed', e); }
}
function syncShipmentToSheet(shipment){
  if(!shipment || !shipment.tripId) return;
  const trip = (state.trips||[]).find(t => t.id === shipment.tripId);
  if(!trip || !trip.googleSheetId) return;
  fetch(`${API_BASE}/api/google/sheets/sync-row`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ boatId: CURRENT_BOAT_ID, sheetId: trip.googleSheetId, shipment })
  }).catch(e => console.error('syncShipmentToSheet failed', e));
}
async function finalizeGoogleSheetForTrip(trip){
  if(!trip || !trip.googleSheetId) return;
  try{
    await fetch(`${API_BASE}/api/google/sheets/finalize`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ boatId: CURRENT_BOAT_ID, sheetId: trip.googleSheetId, tripTitle: tripSheetTitle(trip) })
    });
  }catch(e){ console.error('finalizeGoogleSheetForTrip failed', e); }
}

/* ---------------- Utilities ---------------- */
function trackingCode(){
  const d = new Date();
  const ymd = d.getFullYear().toString().slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `CF-${ymd}-${rand}`;
}
function fmtMoney(n){ return '\u0783' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return '\u2014'; const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// The most recent thing that happened to a shipment -- created, loaded,
// departed, delivered, or paid -- whichever is latest. Used to sort the
// Dashboard so anything just touched jumps back to the top, not just
// brand-new check-ins.
function lastActivityTime(s){
  const times = [s.createdAt, s.loadedAt, s.inTransitAt, s.deliveredAt, s.paidAt]
    .filter(Boolean).map(t => new Date(t).getTime()).filter(n => !isNaN(n));
  return times.length ? Math.max(...times) : 0;
}

// Used to auto-fill the receiver fields from whoever this sender last sent
// cargo to -- looked up by mobile number (the reliable unique identifier),
// most recent shipment first.
function findLatestShipmentBySenderMobile(mobile, island){
  if(!mobile) return null;
  let matches = (state.shipments||[]).filter(s => s.mobile === mobile && s.receiverName);
  if(island) matches = matches.filter(s => s.island === island);
  if(!matches.length) return null;
  return matches.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
}
// Re-runs the receiver auto-fill for whichever destination island is
// currently selected (dropdown or free-text "Other"), so switching the
// destination picks the sender's most recent receiver for THAT island
// specifically. Only overwrites fields that are empty or were themselves
// auto-filled -- never something the person actually typed in by hand.
function runReceiverAutofillForIsland(senderMobileId, islandSelectId, islandOtherId, rnameId, rmobileId){
  const rname = document.getElementById(rnameId);
  const rmobile = document.getElementById(rmobileId);
  if(!rname || !rmobile) return;
  if((rname.value.trim() || rmobile.value.trim()) && rname.dataset.autofilled !== '1') return;
  const senderMobile = (document.getElementById(senderMobileId)?.value || '').trim();
  const islandSelect = document.getElementById(islandSelectId);
  const islandOther = document.getElementById(islandOtherId);
  let island = '';
  if(islandSelect && islandSelect.value && islandSelect.value !== '__other') island = islandSelect.value;
  else if(islandOther) island = islandOther.value.trim();
  if(!senderMobile || !island) return;
  const last = findLatestShipmentBySenderMobile(senderMobile, island);
  if(last){
    rname.value = last.receiverName || ''; rmobile.value = last.receiverMobile || ''; rname.dataset.autofilled = '1';
  } else {
    rname.value = ''; rmobile.value = ''; rname.dataset.autofilled = '0';
  }
}
// Every distinct receiver this sender has sent to before, most recent first
// -- used for the "type a name, pick from past receivers" suggestions.
function getSenderReceiverHistory(mobile){
  if(!mobile) return [];
  const seen = new Map();
  (state.shipments||[]).filter(s => s.mobile === mobile && s.receiverName)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))
    .forEach(s => {
      const key = (s.receiverMobile || '') + '|' + s.receiverName;
      if(!seen.has(key)) seen.set(key, { name: s.receiverName, mobile: s.receiverMobile || '' });
    });
  return Array.from(seen.values());
}
// Wires up two things on a receiver-name field: (1) tapping an auto-filled
// value clears both receiver fields so it's obvious you can type a fresh
// one, and (2) as you type, past receivers for this same sender that match
// show up as tappable suggestions.
function wireReceiverAutofill(senderMobileInputId, rnameId, rmobileId, suggestionsId){
  const rname = document.getElementById(rnameId);
  const rmobile = document.getElementById(rmobileId);
  const suggestionsEl = document.getElementById(suggestionsId);
  if(!rname || !rmobile || !suggestionsEl) return;

  rname.addEventListener('focus', () => {
    if(rname.value.trim() || rmobile.value.trim()){
      rname.value = ''; rmobile.value = ''; rname.dataset.autofilled = '0';
    }
  }, { once: false });
  rname.addEventListener('input', () => {
    rname.dataset.autofilled = '0';
    const senderMobile = (document.getElementById(senderMobileInputId).value||'').trim();
    const q = rname.value.trim().toLowerCase();
    if(!q || !senderMobile){ suggestionsEl.innerHTML = ''; return; }
    const history = getSenderReceiverHistory(senderMobile).filter(h => h.name.toLowerCase().includes(q));
    if(!history.length){ suggestionsEl.innerHTML = ''; return; }
    suggestionsEl.innerHTML = `
      <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">
        ${history.map((h,i) => `<button type="button" class="item-result-row" data-pick-idx="${i}" style="width:100%;text-align:left;padding:8px 12px;">${escapeHtml(h.name)} \u2014 ${escapeHtml(h.mobile)}</button>`).join('')}
      </div>
    `;
    suggestionsEl.querySelectorAll('[data-pick-idx]').forEach(b => b.addEventListener('click', () => {
      const h = history[parseInt(b.dataset.pickIdx,10)];
      rname.value = h.name; rmobile.value = h.mobile; rname.dataset.autofilled = '0';
      suggestionsEl.innerHTML = '';
    }));
  });
  rname.addEventListener('blur', () => {
    setTimeout(() => { suggestionsEl.innerHTML = ''; }, 150); // let a suggestion click register first
  });
}

// Long links (Viber invites, tracking URLs, etc) render as ~1.5 lines with
// a "..." tail; tapping toggles the full text. Full text is kept in this
// map (not a data-attribute) to avoid any HTML-escaping edge cases.
const _truncateLinkText = {};
function renderTruncatableLink(id, text, maxLen){
  maxLen = maxLen || 60;
  if(!text) return '\u2014';
  if(text.length <= maxLen) return escapeHtml(text);
  _truncateLinkText[id] = text;
  return `<span class="truncate-link" id="${id}" data-expanded="0">${escapeHtml(text.slice(0, maxLen))}<span class="truncate-dots">\u2026</span></span>`;
}
function wireTruncatableLinks(ids){
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el || !_truncateLinkText[id]) return;
    el.addEventListener('click', () => {
      const full = _truncateLinkText[id];
      if(el.dataset.expanded === '1'){
        el.dataset.expanded = '0';
        el.innerHTML = `${escapeHtml(full.slice(0, 60))}<span class="truncate-dots">\u2026</span>`;
      } else {
        el.dataset.expanded = '1';
        el.textContent = full;
      }
    });
  });
}

function slugify(s){
  return String(s||'').toLowerCase().trim().split(/\s+/)[0].replace(/[^a-z0-9]/g, '') || 'user';
}
let _boatNameCache = {};
async function getCurrentBoatName(){
  if(_boatNameCache[CURRENT_BOAT_ID]) return _boatNameCache[CURRENT_BOAT_ID];
  try{
    const res = await fetch(`${API_BASE}/api/boats/${CURRENT_BOAT_ID}/name`);
    if(res.ok){
      const data = await res.json();
      _boatNameCache[CURRENT_BOAT_ID] = data.name || 'boat';
      return _boatNameCache[CURRENT_BOAT_ID];
    }
  }catch(e){ console.error('getCurrentBoatName failed', e); }
  return 'boat';
}
async function generateStaffUsername(fullName, existingUsernames){
  const boatName = await getCurrentBoatName();
  const base = `${slugify(fullName)}.${slugify(boatName)}`;
  if(!existingUsernames || !existingUsernames.includes(base)) return base;
  let n = 2;
  while(existingUsernames.includes(`${base}${n}`)) n++;
  return `${base}${n}`;
}
function telLink(num){ return num ? `<a class="party-phone" href="tel:${escapeHtml(String(num).replace(/[^\d+]/g,''))}">${escapeHtml(num)}</a>` : ''; }

function startOfWeek(){ const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day===0?-6:1); const s = new Date(d.setDate(diff)); s.setHours(0,0,0,0); return s; }
function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function baseUrl(){ return location.href.split('#')[0]; }

// Keeps Owner/Staff signed in across a page refresh. Without this, reloading
// while on any tab (which changes the URL hash away from #owner/#staff to
// e.g. #dashboard) has no way to know a session was active, and falls back
// to the public customer view. localStorage survives reloads; sessionStorage
// would also work but wouldn't survive closing the tab, which is worse UX
// for something like a staff member's phone left logged in.
const SESSION_KEY = 'cfl_session_v1';
function saveSession(gateRole, role, staffName, boatId){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ gateRole, role, staffName, boatId: boatId || CURRENT_BOAT_ID })); }
  catch(e){ /* localStorage unavailable (private mode etc) -- session just won't persist */ }
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

const ADMIN_SESSION_KEY = 'cfl_admin_session_v1';
function saveAdminSession(username, passkey){
  try{ localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ username, passkey })); }
  catch(e){ /* localStorage unavailable -- session just won't persist */ }
}
function loadAdminSession(){
  try{

// Maldivian mobile numbers are typically stored as 7-digit local numbers.
// wa.me/Viber deep links need a full international number with no leading
// "+" or "0" -- if what's on file already looks international (8+ digits),
// leave it as-is; otherwise assume Maldives (960) and prefix it.
function intlNumber(raw){
  const digits = String(raw||'').replace(/\D/g,'');
  if(!digits) return '';
  return digits.length > 7 ? digits : '960' + digits;
}

// Invoice popup -- opens right over whatever screen you're on (no

function openInvoicePopup(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  closeInvoicePopup();
  const overlay = document.createElement('div');
  overlay.id = 'invoice-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="invoice-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      ${renderInvoicePopupContent(s)}
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeInvoicePopup(); });
  document.body.appendChild(overlay);
  document.getElementById('invoice-popup-close-btn').addEventListener('click', closeInvoicePopup);

  // Start building the shareable image the moment the popup opens, in the
  // background -- iOS requires navigator.share() to be called synchronously
  // inside the actual tap, with nothing awaited first. By the time "Share
  // Invoice" is tapped, the file is (usually) already sitting ready to go.
  let shareFile = null;
  let shareFilePromise = prepareInvoiceShareFile(s).then(f => { shareFile = f; return f; });

  document.getElementById('invoice-popup-share-btn').addEventListener('click', async () => {
    if(shareFile){ shareFileNow(shareFile, s); return; }
    // Still generating (rare -- only if tapped within the first instant) --
    // wait for it, then share immediately once ready. This retry itself
    // still counts as inside the same tap's activation window on most
    // browsers as long as it's not an excessive delay.
    const btn = document.getElementById('invoice-popup-share-btn');
    btn.disabled = true; btn.textContent = 'Preparing\u2026';
    const f = await shareFilePromise;
    btn.disabled = false; btn.textContent = 'Share Invoice';
    if(f) shareFileNow(f, s);
    else alert('Could not generate the invoice image. Check your connection and try again.');
  });
}

// Renders the invoice to an image and resolves to a File, or null on
// failure. Pure background work -- no gesture-gated APIs called here.
async function prepareInvoiceShareFile(s){
  if(typeof html2canvas === 'undefined') return null;
  const node = buildInvoiceImageNode(s);
  let canvas;
  try{
    canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff' });
  } catch(e){
    node.remove();
    console.error('invoice image generation failed', e);
    return null;
  }
  node.remove();
  return new Promise(resolve => {
    canvas.toBlob(blob => {
      if(!blob){ resolve(null); return; }
      const filename = `invoice-${(s.invoiceId||s.id).replace(/[^a-z0-9-]/gi,'')}.png`;
      resolve(new File([blob], filename, { type: 'image/png' }));
    }, 'image/png');
  });
}

// Called synchronously (or as close to it as possible) from inside a real
// tap -- this is the only place navigator.share() is actually invoked.
function shareFileNow(file, s){
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    const bankBits = [];
    if(state.settings.bankAccountName) bankBits.push(`Acc. Name: ${state.settings.bankAccountName}`);
    if(state.settings.bankAccountNumber) bankBits.push(`Acc. No : ${state.settings.bankAccountNumber}`);
    const caption = (!s.paid && bankBits.length) ? `- BML Account -\n${bankBits.join('\n')}` : '';
    navigator.share(caption ? { files: [file], text: caption } : { files: [file] }).catch(e => {
      // Some browsers reject a files+text share together -- fall back to
      // file-only rather than silently dropping the whole share.
      if(caption && e && e.name !== 'AbortError'){
        navigator.share({ files: [file] }).catch(() => { /* user cancelled */ });
      }
    });
  } else {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    alert('Your browser can\'t open the share sheet directly, so the invoice image downloaded instead \u2014 attach it manually in WhatsApp or Viber.');
  }
}

async function shareInvoiceImage(s){
  const file = await prepareInvoiceShareFile(s);
  if(!file){ alert('Could not generate the invoice image. Try again.'); return; }
  shareFileNow(file, s);
}

function renderGate(){

    `;
    const input = document.getElementById('pin-input');
    input.focus();
    if(state.pinTargetRole === 'owner'){
      document.getElementById('forgot-pin-link').addEventListener('click', () => {
        state.gateStage = 'forgot'; state.forgotError = ''; state.forgotMsg = '';
        renderGate();
      });
    }
    const grant = (staffName) => {
      state.role = state.pinTargetRole;
      state.staffName = staffName || null;
      state.gateStage = 'pick';
      state.pinError = '';
      state.tab = DEFAULT_TAB[state.role];
      saveSession(state.gateRole, state.role, state.staffName, CURRENT_BOAT_ID);
      location.hash = state.tab;
      render();
    };
    const fail = () => { state.pinError = 'Incorrect PIN. Try again.'; renderGate(); };
    const tryPin = () => {
      const entered = input.value;
      if(state.pinTargetRole === 'staff'){
        const users = state.settings.staffUsers || [];
        const match = users.find(u => u.pin === entered);
        if(match){ grant(match.name); return; }
        // Legacy fallback: single staff PIN, only while no staff accounts exist yet.
        if(users.length === 0 && entered === state.settings.staffPin){ grant(null); return; }
        fail();
        return;
      }
      // Owner (and any other pinField role)
      if(entered === state.settings[r.pinField]){ grant(null); }
      else fail();
    };
    document.getElementById('pin-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
    document.getElementById('pin-back').addEventListener('click', () => {
      if(state.gateRole){ state.gateStage='signin'; } else { state.gateStage='pick'; }
      state.pinError=''; renderGate();
    });
    return;
  }

  if(state.gateStage === 'forgot'){
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="pin-box">
          <div class="rname">Reset Owner PIN</div>
          <p class="note" style="margin-top:0;text-align:left;">Enter the 6-digit code currently shown in your authenticator app.</p>

      const code = totpInput.value.trim();
      if(!/^\d{6}$/.test(code)){
        state.forgotError = 'Enter the 6-digit code from your authenticator app.'; renderGate(); return;
      }
      state.forgotError = ''; state.forgotMsg = 'Verifying\u2026';

      try{
        const res = await fetch(`${API_BASE}/api/reset-pin/totp-verify`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ code, boatId: CURRENT_BOAT_ID })

        const data = await res.json().catch(() => ({}));
        if(res.ok && data.ok && data.token){
          state.gateStage = 'reset-confirm'; state.resetToken = data.token;
          state.forgotMsg = ''; state.forgotError = '';
          renderGate();
        } else {
          state.forgotError = (data && data.error) || 'That code is incorrect or expired. Try again.';
          state.forgotMsg = '';

  if(state.gateStage === 'reset-confirm'){

      const newPin = pinInput.value.trim();
      if(!/^\d{4,6}$/.test(newPin)){
        state.resetError = 'PIN must be 4\u20136 digits.'; renderGate(); return;
      }
      state.resetError = ''; state.resetMsg = 'Saving\u2026';
      renderGate();
      try{
        const res = await fetch(`${API_BASE}/api/reset-pin/confirm`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ token: state.resetToken, newPin })
        });
        const data = await res.json().catch(() => ({}));
        if(res.ok && data.ok){
          state.resetMsg = 'PIN updated. Taking you to sign in\u2026';
          renderGate();
          setTimeout(() => {
            state.gateStage = 'pin'; state.pinTargetRole = 'owner';
            state.resetMsg = ''; state.resetError = ''; state.resetToken = null;
            location.hash = OWNER_HASH;
            renderGate();
          }, 1400);
        } else {
          state.resetError = data.error || 'That link is invalid or expired. Request a new one.';
          state.resetMsg = '';
          renderGate();
        }
      }catch(e){
        console.error('reset-pin confirm failed', e);
        state.resetError = 'Something went wrong. Try again.';
        state.resetMsg = '';
        renderGate();
      }
    });
    return;
  }

  // Owner-specific link: go straight to the Owner PIN box, no picker.
  if(state.gateRole === 'owner'){
    state.pinTargetRole = 'owner';
    state.gateStage = 'pin';
    renderGate();
    return;
  }

  // Staff-specific link: Sign In / Request Access toggle, no Owner card.
  if(state.gateRole === 'staff'){
    renderStaffGate();
    return;
  }

  // Manager-specific link: PIN sign-in only -- managers are invited
  // directly by the owner, not self-requesting like staff can.
  if(state.gateRole === 'manager'){
    renderManagerGate();
    return;
  }

  // Fallback (shouldn't normally be reached, kept for safety): generic picker.
  area.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-title">
          <h1>Staff Sign-In</h1>
          <p>This link is for internal use only</p>
        </div>
        <div class="role-grid">
          ${INTERNAL_ROLES.map(key => {
            const r = ROLES[key];
            return `
              <div class="role-card" data-role="${key}">
                <div class="ricon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[r.icon]}</svg></div>
                <div class="rname">${r.name}</div>
                <div class="rdesc">${r.desc}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  area.querySelectorAll('.role-card').forEach(c => c.addEventListener('click', () => {
    state.pinTargetRole = c.dataset.role; state.gateStage = 'pin'; state.pinError=''; renderGate();
  }));
}

      const match = users.find(u => u.pin === entered);
      if(match || (users.length === 0 && entered === state.settings.staffPin)){
        state.role = 'staff';
        state.staffName = match ? match.name : null;
        state.tab = DEFAULT_TAB.staff;
        saveSession('staff', 'staff', state.staffName, CURRENT_BOAT_ID);
        location.hash = state.tab;
        render();
        return;
      }
      document.getElementById('staffgate-error').textContent = 'Incorrect PIN. Try again.';
    };
    document.getElementById('staffgate-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
  } else {
    body.innerHTML = `
      <label>Your name</label>
      <input type="text" id="req-name" placeholder="e.g. Ahmed">
      <label>Email address</label>
      <input type="text" id="req-email" placeholder="e.g. ahmed@example.com">
      <label>Mobile number</label>
      <input type="tel" id="req-mobile" placeholder="e.g. 771 2345">
      <button class="btn btn-primary" id="req-submit" style="width:100%;">Request Access</button>
      <div class="note" style="margin-top:12px;">An owner or manager will need to approve your request and share a sign-in PIN with you before you can get in.</div>
    `;
    document.getElementById('req-submit').addEventListener('click', async () => {
      const name = document.getElementById('req-name').value.trim();
      const email = document.getElementById('req-email').value.trim();
      const mobile = document.getElementById('req-mobile').value.trim();
      if(!name || !email){ alert('Enter your name and email address.'); return; }
      await withFreshSettings(fresh => {
        const list = fresh.pendingStaff || (fresh.pendingStaff = []);
        list.push({id:'req-'+Date.now(), name, email, mobile, requestedAt:new Date().toISOString()});
      });
      state.gateMode = 'submitted';
      renderStaffGate();

}

function logoutInternal(){
  clearSession();
  state.role = null; state.gateStage='pick'; state.pinTargetRole=null; state.pinError=''; state.tab=null; state.staffName=null; state.gateMode='signin';
  if(state.gateRole === 'owner'){
    history.replaceState(null,'','#org');
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'login';
    renderOrgArea();
    return;

  const backHash = (state.gateRole === 'manager' ? MANAGER_HASH : INTERNAL_HASH) + '/' + CURRENT_BOAT_ID;
